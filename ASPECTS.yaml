companions:
  - path: "deploy/required-config.*.json"
    moves_with: ["deploy/Dockerfile.*"]
    enforced_by: server/tests/test_deployment_source_identity.py
  - path: "platform/migrations/*.sql"
    moves_with: ["the named earlier expand migration"]
    enforced_by: scripts/migration_expand_contract_gate.py
  - path: "web/scripts/check_*.mjs"
    moves_with: [dispatch/run-local-ci.sh]
  - path: "executor/contracts/schemas/*.v1.schema.json"
    moves_with:
      - "executor/contracts/fixtures/valid/**"
      - "executor/contracts/fixtures/invalid/**"
      - executor/contracts/validate_contracts.py
  - path: scripts/ci/native_release_producer.py
    moves_with: [.codebuild/release.yml, scripts/test_native_release_producer.py]
  - path: contract/CONTRACT.md
    moves_with: [server/CONTRACT-ADDENDUM.md]
  - path: deploy/studio-door/vercel.json
