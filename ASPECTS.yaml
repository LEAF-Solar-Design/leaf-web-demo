targets:
  - id: leaf-platform-app
    exposure: pre_ga
    deploy_shape: ecs-fargate
    manifest: deploy/required-config.app.json
    dockerfile: deploy/Dockerfile.app
    restart_semantics: rolling; expected-vs-observed via server/deployment_identity.py
    evidence: [server/routers/deployment_identity.py, "GET /api/ready"]
  - id: leaf-platform-broker
    exposure: pre_ga
    deploy_shape: ecs-fargate
    manifest: deploy/required-config.broker.json
    dockerfile: deploy/Dockerfile.broker
    note: holds the APS credential exclusively; app must never import da
  - id: leaf-platform-web
    exposure: pre_ga
    deploy_shape: ecs-fargate
    manifest: deploy/required-config.web.json
    dockerfile: deploy/Dockerfile.web
    companions: [deploy/write-runtime-flags.sh]
  - id: leaf-platform-harness
    exposure: pre_ga
    deploy_shape: ecs-fargate
    manifest: deploy/required-config.harness.json
    dockerfile: deploy/Dockerfile.harness
  - id: leaf-platform-worker
    exposure: pre_ga
    deploy_shape: ecs-fargate
    manifest: deploy/required-config.worker.json
    dockerfile: deploy/Dockerfile.canonical-worker
  - id: studio-door
    exposure: pre_ga
    deploy_shape: vercel
    paths: ["deploy/studio-door/**"]
    deploy_command: "manual: vercel deploy --prod --yes"
  - id: web-spa
    exposure: pre_ga
    deploy_shape: vercel
    deploy_command: scripts/deploy-web.py
    gap: writes stdout READY / NOT-READY only; step 12 adds the receipt
  - id: native-release
    exposure: pre_ga
    deploy_shape: codebuild
    manifest: .codebuild/release.yml
    evidence: [scripts/ci/native_release_producer.py]
  - id: e2b-instant-execution
    exposure: pre_ga
    deploy_shape: e2b-template
    paths: [e2b.Dockerfile]
    evidence: [scripts/e2b-microvm-smoke.py]
    companions:
      - harness/src/ports/impl/e2bAgentRunner.ts
      - harness/src/vendor/mushy-author/ports/impl/e2bAgentRunner.ts

contracts:
  - id: web-app-http
    kind: http
    producer:
      repo: self
      paths: ["server/routers/**"]
      revision: HEAD
      extractor: fastapi-request-keys
    consumers:
      - repo: self
        paths:
          - web/src/api.js
          - web/src/overlayClient.js
          - web/src/operatorClient.js
          - web/src/annotationClient.js
          - web/src/projects/api.js
          - web/src/campaigns/api.js
          - web/src/converse.js
        revision: HEAD
        extractor: ts-fetch-paths
      - repo: LEAF-Solar-Design/leaf_website
        paths: ["app/**"]
        revision: unresolved
        status: unresolved
      - repo: LEAF-Solar-Design/Branch2025
        paths: ["**/WebView*"]
        revision: unresolved
        status: unresolved
    artifact: [contract/CONTRACT.md, server/envelope_schema.json]
    adoption_law: contract/ADOPTION.md
    companions: [server/CONTRACT-ADDENDUM.md]
  - id: engine-tool-registry
    kind: file
    producer:
      repo: self
      paths: [engine/registry.json]
      revision: HEAD
    consumers:
      - repo: self
        paths: [server/deps.py]
        revision: HEAD
    artifact: [contract/CONTRACT.md, engine/envelope_schema.json]
  - id: harness-executor
    kind: file
    producer:
      repo: self
      paths: ["executor/control_plane/**", "executor/contracts/schemas/*.v1.schema.json"]
      revision: HEAD
    consumers:
      - repo: self
        paths: ["harness/src/agent/tools/**"]
        revision: HEAD
    evidence_producer: executor/contracts/validate_contracts.py
  - id: harness-project-repository-edit
    kind: other
    producer:
      repo: self
      paths: [server/routers/project_repository_edit.py]
      revision: HEAD
    consumers:
      - repo: self
        paths: [harness/src/agent/projectRepositoryEditCoordinator.ts]
        revision: HEAD
    artifact: [contract/PROJECT-REPOSITORY-EDIT.md, contract/project-repository-edit.v1.schema.json]
  - id: harness-ops-dashboard-ingest
    kind: http
    producer:
      repo: self
      paths: [harness/src/vendor/mushy-author/ports/impl/httpUpstreamSink.ts]
      revision: HEAD
    consumers:
      - repo: LEAF-Solar-Design/ops-dashboard
        paths: [src/app/api/upstream/ingest/route.ts]
        revision: unresolved
  - id: platform-telemetry-bigquery
    kind: data-schema
    producer:
      repo: self
      paths: [server/telemetry_sink.py]
      revision: HEAD
    consumers:
      - repo: LEAF-Solar-Design/ops-dashboard
        paths: ["**"]
        revision: unresolved
        status: unresolved
    artifact: [docs/PLATFORM_TELEMETRY.md]
    note: >-
      mid-cutover; LEAF_TELEMETRY_BACKEND bigquery|firehose|dual.
      Re-verify when the dual window closes. The BigQuery reader for dataset
      leaf_platform_analytics has no resolved consumer file path; the consumer
      glob is repository-wide until that path is established.
  - id: aps-emf-alarm-dimensions
    kind: metric-dimension-set
    producer:
      repo: self
      paths: [server/emf_metrics.py]
      revision: HEAD
    consumers:
      - repo: LEAF-Solar-Design/leaf-automation-aws-terraform
        paths: [terraform/environments/production/us-east-1/cloudwatch_aps.tf]
        revision: unresolved
    evidence_producer: "repo:leaf-tf-mainref .github/scripts/verify_alarm_dimension_decoupling.py"
    known_broken: SubmitLatency
  - id: solar-size-strings
    kind: http
    producer:
      repo: LEAF-Solar-Design/aws-string-sizer
      paths: [app.py, main.py]
      revision: 1e568b6ff48450d524ff2b47625e3a97b2d60f01
      route: "POST /string-length"
      extractor: fastapi-request-keys
    consumers:
      - repo: self
        paths: [server/solar_sizing_client.py]
        revision: HEAD
        extractor: python-pydantic-fields
        status: mismatch
      - repo: LEAF-Solar-Design/Branch2025
        paths:
          - LeafSolarDesign.Core/StringSizer/StringSizerRequest.cs
          - LeafSolarDesign.Core/StringSizer/StringSizerClient.cs
        revision: 2eab8d9a74ddc0ff40be13966c88514db06bd395
        extractor: csharp-json-properties
        status: agrees
    outcome: unresolved
    reason_source: "C:/Users/ehaug/.claude/plans/ref/studio-remaining-20260920/a3-wire-contract-finding.md"
