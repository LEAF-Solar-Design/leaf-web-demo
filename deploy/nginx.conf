# Leaf web frontend — static SPA served on :8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the text payloads (bundle + json intake are the big ones).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache the content-hashed build assets.
    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static misses must not return the app shell for the edge to cache.
    location ~* \.(woff|woff2|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico|css|js|mjs|map|wasm|webmanifest|txt|xml)$ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown app routes render the revalidated app shell.
    location / {
        try_files $uri $uri.html /index.html;
    }
}
