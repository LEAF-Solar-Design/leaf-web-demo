# Leaf platform — local deploy stack (WAVE 5 deploy pack).
#
# The first deploy-readiness artifact: containerize app + broker + harness + web
# and prove the env contract (RUN.md, server/README.md, CONTRACT-ADDENDUM §7-§16)
# wires up under `docker compose`. Everything runs at APS_LIVE=0 with NO
# third-party secrets; operator opt-ins (APS creds, a Claude grant, DATABASE_URL)
# are commented below. The one internal credential — the app→harness hop secret
# (LEAF_HARNESS_SECRET, §15/§16) — defaults to a DEV-ONLY value so one-command
# boot keeps working; override it via `.env`/environment for any shared host.
#
#   docker compose build          # build all four images
#   docker compose up -d          # start; wait for healthchecks
#   open http://localhost:8080    # the app; API at http://localhost:8130
#   docker compose down -v        # stop + drop the named volumes
name: leaf-platform

services:
  # --- APS credential broker (§8): the only secret-holder; :8140 -------------
  broker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.broker
    image: leaf-broker:local
    environment:
      APS_LIVE: "0"
      BROKER_LEDGER: /data/state/broker_ledger.jsonl   # shared with the app (usage reads it)
      BROKER_TENANTS: /data/state/broker_tenants.json  # persisted kill-switch
      LEAF_STORE_DIR: /data/drawings                   # shared with the app (write loop)
      LEAF_UPLOADS_DIR: /data/uploads                  # shared with the app (S19 upload staging: app writes, broker extracts)
      # PostgreSQL broker authority is staged but OFF. Its connection string is
      # separate from the app substitution so setting DATABASE_URL cannot move
      # this secret-holding process to a new authority by accident.
      LEAF_BROKER_STORE: ${LEAF_BROKER_STORE:-legacy}
      LEAF_CALLBACK_REPLAY_STORE: ${LEAF_CALLBACK_REPLAY_STORE:-legacy}
      LEAF_DRAWING_STORE: ${LEAF_DRAWING_STORE:-legacy}
      LEAF_JOBS_STORE: ${LEAF_JOBS_STORE:-legacy}
      DATABASE_URL: ${LEAF_BROKER_DATABASE_URL:-}
      # §8 F4 caller-auth hop: same env on broker + app + harness. Empty (the default)
      # keeps the friction-free off-live demo; set it and every protected
      # /broker/* call requires the constant-time X-Broker-Secret header.
      LEAF_BROKER_SECRET: ${LEAF_BROKER_SECRET:-}
      # --- operator opt-in for APS_LIVE=1 (NEVER baked into the image): -------
      # APS_CRED: /run/secrets/aps/credentials.json
    volumes:
      - leaf-state:/data/state
      - leaf-drawings:/data/drawings
      - leaf-uploads:/data/uploads
      # - ${HOME:-~}/.aps:/run/secrets/aps:ro          # mount your ~/.aps for live APS
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8140/broker/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # --- Author harness sidecar (§15/§16): real Agent SDK build lane; :8150 -----
  harness:
    build:
      context: .
      dockerfile: deploy/Dockerfile.harness
    image: leaf-harness:local
    environment:
      HARNESS_PORT: "8150"
      BROKER_URL: http://broker:8140
      # §8 F4 hop — MUST match the broker's value. The harness's broker client
      # (brokerApsClient.ts) sends X-Broker-Secret only when this is set; without
      # it, enabling the secret would 401 every author/converse broker call.
      LEAF_BROKER_SECRET: ${LEAF_BROKER_SECRET:-}
      LEAF_TENANTS_DIR: /data/tenants     # MUST match the app's LEAF_TENANTS_DIR (§16.H)
      LEAF_GRANTS_DIR: /data/grants       # per-tenant Claude token files (harness-only)
      LEAF_TENANT_FIXTURE: /app/test/fixtures/tenant-repo
      # F5 caller auth (harness/src/server.ts): the gate is ON in the container
      # stack, so every non-/health route requires X-Harness-Secret. The harness
      # port is NOT published to the host (compose-network only); the default
      # secret is a dev-only placeholder that keeps `docker compose up` one
      # command. Override for anything shared: LEAF_HARNESS_SECRET=<random>.
      LEAF_HARNESS_AUTH: "1"
      LEAF_HARNESS_SECRET: ${LEAF_HARNESS_SECRET:-leaf-compose-dev-secret}
      # --- Converse lane (§18 spine mount, census #12 chip 1) -----------------
      # BOTH must be non-empty or the lane stays dark FAIL-CLOSED (POST /turn
      # answers 501; author/Build lane unaffected). The secret is the harness->
      # app back-edge credential (X-Dispatch-Secret; gate consult + dispatch);
      # the SAME value must reach the app below. No baked default: the
      # zero-secret demo compose keeps the converse lane off by design.
      LEAF_APP_URL: http://app:8130
      LEAF_APP_DISPATCH_SECRET: ${LEAF_APP_DISPATCH_SECRET:-}
      LEAF_SESSIONS_DIR: /data/sessions   # loop-side durable store (sdk resume ids, confirmation mirrors)
      # PostgreSQL harness sessions are staged but OFF. Select postgres only
      # after the one-shot migration preflight has completed.
      LEAF_HARNESS_SESSION_STORE: ${LEAF_HARNESS_SESSION_STORE:-file}
      LEAF_HARNESS_AUTHORING_MODE: ${LEAF_HARNESS_AUTHORING_MODE:-disabled}
      LEAF_HARNESS_DATABASE_URL: ${LEAF_HARNESS_DATABASE_URL:-}
      # --- operator opt-ins (NEVER baked): ------------------------------------
      # LEAF_TENANT_REPO: /data/tenants/demo-tenant  # demo single-repo back-compat override
      # LEAF_GRANT_FILE: /run/secrets/claude-grant   # a demo-tenant grant token file
    volumes:
      - leaf-tenants:/data/tenants        # shared with the app (§16.H)
      - leaf-grants:/data/grants
      - leaf-sessions:/data/sessions      # harness-only converse store
      # - ./.secrets/claude-grant:/run/secrets/claude-grant:ro
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8150/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # --- Tenant-facing app (§7-§16): async spine + catalog + write loop; :8130 --
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
    image: leaf-app:local
    ports:
      - "8130:8130"
    environment:
      APS_LIVE: "0"
      BROKER_URL: http://broker:8140
      LEAF_AUTHOR_HARNESS_URL: http://harness:8150
      # Same value as the harness service: broker_client.harness_headers() forwards
      # it as X-Harness-Secret on every app→harness call (author/tenant/turn).
      LEAF_HARNESS_SECRET: ${LEAF_HARNESS_SECRET:-leaf-compose-dev-secret}
      LEAF_TENANTS_DIR: /data/tenants                  # MUST match the harness (§16.H)
      LEAF_STORE_DIR: /data/drawings                   # shared with the broker (write loop)
      LEAF_UPLOADS_DIR: /data/uploads                  # shared with the broker (S19: staged uploads must be broker-resolvable)
      BROKER_LEDGER: /data/state/broker_ledger.jsonl   # app reads the broker's ledger for /api/usage
      LEAF_BROKER_SECRET: ${LEAF_BROKER_SECRET:-}      # §8 F4 hop — MUST match the broker's value (same env, both sides)
      JOBS_DB: /data/state/jobs.db                     # durable async job records (restart-survivable)
      SESSIONS_DB: /data/state/sessions.db             # conversational sessions/events/approvals (same durability tier as jobs.db). SINGLE-WRITER: SQLite+WAL+threading.Lock assumes ONE app process — keep one replica/one uvicorn worker, and on network filesystems (EFS/NFS, where WAL is unsafe) point JOBS_DB/SESSIONS_DB at task-local storage instead (see the production task definition)
      # Converse back-edge (§18.5): SAME value as the harness's copy above.
      # Empty => /internal/agent/gate and the dispatch back-edge answer 401
      # (fail closed) and the harness keeps the converse lane dark.
      LEAF_APP_DISPATCH_SECRET: ${LEAF_APP_DISPATCH_SECRET:-}
      # --- Agent gate-chain state (§18 / census #12 chip 3): every MUTABLE gate
      # artifact is pinned under /data/state (leaf-state volume) so the kill
      # switch, pending approvals, session grants, rate budgets, audit + turn
      # ledger and per-tenant flags all survive an app-container restart. The
      # policy CATALOG is deliberately NOT state: it is versioned config, baked
      # into the image from server/agent_policy.json (edit via git + rebuild;
      # the gate re-reads it per request). Drills: docs/AGENT-OPS-RUNBOOK.md.
      LEAF_AGENT_POLICY_FILE: /app/server/agent_policy.json      # versioned config (git-owned, in-image)
      LEAF_AGENT_KILL_FILE: /data/state/agent.disabled           # file-presence kill switch, NO API off-toggle (§5)
      LEAF_AGENT_APPROVALS_DIR: /data/state/agent_approvals      # durable pending approvals (TTL = policy approval_ttl_s)
      LEAF_AGENT_GRANTS_FILE: /data/state/agent_session_grants.json  # confirm-once session grants
      LEAF_AGENT_RATE_FILE: /data/state/agent_rate_state.json    # per-tenant per-hour budget snapshot (the authority)
      LEAF_AGENT_AUDIT: /data/state/agent_audit.jsonl            # append-only gate-decision audit
      LEAF_AGENT_LEDGER: /data/state/agent_ledger.jsonl          # append-only per-turn metering ledger
      LEAF_AGENT_TENANTS_FILE: /data/state/agent_tenants.json    # per-tenant kill flag + tighten-only overlay (ops surface writes)
      # New shared authorities remain explicit opt-ins. Invalid values fail
      # closed in the application instead of falling back to local files.
      LEAF_SESSIONS_STORE: ${LEAF_SESSIONS_STORE:-legacy}
      LEAF_JOBS_STORE: ${LEAF_JOBS_STORE:-legacy}
      LEAF_AGENT_STORE: ${LEAF_AGENT_STORE:-legacy}
      LEAF_GUEST_CAP_STORE: ${LEAF_GUEST_CAP_STORE:-memory}
      LEAF_DRAWING_STORE: ${LEAF_DRAWING_STORE:-legacy}
      LEAF_UPLOAD_STORE: ${LEAF_UPLOAD_STORE:-legacy}
      LEAF_GUEST_CAP_HMAC_SECRET: ${LEAF_GUEST_CAP_HMAC_SECRET:-}
      # --- operator opt-in: platform Project/Job persistence (Neon/Postgres) ---
      DATABASE_URL: ${DATABASE_URL:-}                  # empty => platform DB endpoints stay dark (demo-safe)
    volumes:
      - leaf-tenants:/data/tenants
      - leaf-drawings:/data/drawings
      - leaf-state:/data/state
      - leaf-uploads:/data/uploads
    depends_on:
      broker:
        condition: service_healthy
      harness:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8130/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # --- Web frontend (static nginx): :8080 -------------------------------------
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE: http://localhost:8130   # the browser (on the host) hits the app's published port
        VITE_MOCK: "0"
    image: leaf-web:local
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # IPv4 literal: nginx listens on 0.0.0.0:8080 and busybox wget resolves
      # `localhost` to ::1 (IPv6) with no fallback -> a false "unhealthy".
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

# Named volumes. `down -v` drops them all (fresh state next up).
#   leaf-tenants  : per-tenant mushy repos      — SHARED app <-> harness (§16.H)
#   leaf-grants   : per-tenant Claude tokens     — harness only
#   leaf-sessions : converse loop store (sdk resume ids, confirmation mirrors) — harness only.
#                   Dropping it burns in-flight approvals fail-safe (the gate denies the
#                   foreign-session redemption; the user simply re-proposes).
#   leaf-drawings : versioned drawing store      — SHARED app <-> broker (write loop)
#   leaf-state    : broker ledger + kill-switch + app jobs.db + agent gate-chain
#                   state (agent.disabled, agent_approvals/, grants, rate, audit,
#                   ledger, agent_tenants.json)  — SHARED app <-> broker
volumes:
  leaf-tenants:
  leaf-grants:
  leaf-sessions:
  leaf-drawings:
  leaf-state:
  leaf-uploads:
