name: Prewarm staging group

# Merge-queue slice B: stage the validated group head from the main workflow ref.
on:
  workflow_dispatch:
    inputs:
      group_head_sha:
        description: Exact queued group head (40 hex characters)
        type: string
        default: ""

permissions:
  contents: read
  # Cross-checking this repository's producer run records.
  actions: read
  pull-requests: read

concurrency:
  group: ${{ format('prewarm-staging-cutover-mg-stage-{0}', inputs.group_head_sha) }}
  cancel-in-progress: true

env:
  MIGRATION_SURFACE: "platform/migrations/ platform/db.py"
  # #1136 paused app after its prewarm run refused: server/app.py:340's
  # platform_link.validate_postgres_startup required 0058_campaign_host_enrollment
  # (constraint campaign_host_enrollments_machine_unique). Web staged natively
  # twice (builds 1a2cc8c9, fb726619) on leaf-deploy-terraform-staging.
  # #1146 restored app because the native release rail applies migrations to staging:
  # on 2026-09-08, the native-18 image (source 30d46496) booted with health 200,
  # proving 0058 applied, including the startup-required constraint above.
  # 2026-09-09: no consumer adopts a staged candidate. CloudTrail from
  # 2026-09-08T11:35Z to 2026-09-09T01:35Z shows digest intersection zero
  # between staged app-alt:257 to :262 / web-alt:208 to :215 and live
  # app:824 to :828 / web:371 to :373.
  # The listener sweep from 2026-09-08T08:00Z to 2026-09-09T01:30Z
  # shows zero listener changes.
  # The native release consumer rolls staging with native-N images of the
  # SAME commits: f20fa02b live 63 min after queue staging, 1c7bcf4f 44 min after.
  # Receipt: C:/tmp/staged-wiggling-fairy/receipts/12d/adoption-finding-native-rail.json;
  # leaf-plan #74 (aecd1e38).
  # Prewarm scales app-alt from 0 to 1. The terraform TTL reaper,
  # reap-leaf-platform-staging-prewarm-stages.yml (private-repo Actions),
  # has not run since 2026-09-05T23:56Z. App-alt has run at one task since
  # 2026-09-08T18:34Z (about $1.19 per day at Fargate list prices), blocking
  # STEP=plan-live-leg: "the reviewed primary app must be the only live app color".
  # Way back: restore `web app` when the native release consumer prefers the
  # queue's staged candidate whose tree equals the admitted release's tree
  # (the release rail owner's change), or when a native descale returns the
  # idle colour to 0 between groups. Web stays as the queue's exercised
  # prewarm path (about $0.30 per day).
  STAGE_SERVICES: "web"
  # The controller's mq-supply waits 40 x 30 s for the same supply-set object,
  # then mq-prewarm waits for the relay receipt. The readiness record lands
  # with the supply set from the same group build, so this wait must be at least as long.
  # The 42-minute job timeout holds both waits because supply and readiness run in sequence.
  # Group d8ba959d on 2026-09-09: an 18 minute build produced readiness at
  # 09:13:39Z, after the empty relay receipt at 09:12:48Z.
  SUPPLY_SET_POLLS: "40"
  SUPPLY_SET_INTERVAL: "30"

jobs:
  guard-ref:
    name: Refuse dispatches outside main
    if: github.event_name == 'workflow_dispatch'
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    permissions: {}
    steps:
      - name: Require the main workflow ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This relay must run from refs/heads/main."
            exit 1
          fi

  stage-group:
    name: Stage the idle colour with this merge group's exact head
    needs: guard-ref
    if: github.event_name == 'workflow_dispatch' && inputs.group_head_sha != '' && github.ref == 'refs/heads/main'
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 42
    # Satisfies OIDC sub repo:LEAF-Solar-Design@90289782/leaf-web-demo@1304548236:environment:ecr-release.
    environment: ecr-release
    env:
      MQ_TRANSPORT_BUCKET: "leaf-mq-transport-807034087062-us-east-1"
      MQ_TRANSPORT_PREFIX: "mq/leaf-web-demo/"
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - name: Validate and record the live merge-group head and base
        id: group
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.group_head_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::Group head must be a 40-hex SHA."
            exit 1
          }
          HEAD_SHA=${HEAD_SHA,,}
          gh api graphql --paginate \
            -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                mergeQueue(branch: "main") {
                  entries(first: 50, after: $endCursor) {
                    nodes { position headCommit { oid } baseCommit { oid } pullRequest { number } }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }' > queue-pages.json
          jq -s '[.[] | .data.repository.mergeQueue.entries.nodes[]?] | sort_by(.position)' \
            queue-pages.json > queue.json
          ENTRY=$(jq -c --arg head "$HEAD_SHA" '[.[] | select(.headCommit.oid == $head)] | first // empty' queue.json)
          if [ -z "$ENTRY" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Group head is no longer in the live queue; nothing to stage."
            exit 0
          fi
          BASE_SHA=$(printf '%s' "$ENTRY" | jq -r '.baseCommit.oid')
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          POSITION=$(printf '%s' "$ENTRY" | jq '.position')
          MEMBERS=$(jq -c --argjson position "$POSITION" \
            '[.[] | select(.position <= $position) | .pullRequest.number]' queue.json)
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "members=$MEMBERS" >> "$GITHUB_OUTPUT"
          echo "sha12=$(printf '%s' "$HEAD_SHA" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "reason=merge group" >> "$GITHUB_OUTPUT"
          echo "Merge group queued: eligible=true (merge group), head=$HEAD_SHA."

      # The exact group head, never a preview: a merge group's head already
      # has main folded in, so there is nothing to compute and nothing to
      # trust but GitHub's own report of it.
      - uses: actions/checkout@v4
        if: steps.group.outputs.eligible == 'true'
        with:
          ref: ${{ steps.group.outputs.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Require the group head's first parent to equal its base
        id: parentage
        if: steps.group.outputs.eligible == 'true'
        env:
          BASE_SHA: ${{ steps.group.outputs.base_sha }}
        run: |
          set -euo pipefail
          echo "ok=false" >> "$GITHUB_OUTPUT"
          # FAIL CLOSED, the same posture as the migration-surface refusal
          # below: an unreadable or mismatched parentage means this is not
          # provably the group GitHub told us to stage.
          ACTUAL=$(git rev-parse --verify --quiet 'HEAD^1' 2>/dev/null || true)
          if [ -z "$ACTUAL" ]; then
            echo "::notice::No first parent to read on the group head; not staging."
            exit 0
          fi
          if [ "$ACTUAL" != "$BASE_SHA" ]; then
            echo "::notice::Group head's first parent ($ACTUAL) is not the reported base ($BASE_SHA); not staging."
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "Group head's first parent matches base $BASE_SHA."

      # Identical to the PR path's step below it (design's fail-closed
      # migration-surface refusal): same script, same tag derivation, run
      # here over the group head instead of a merge preview.
      - name: Refuse a candidate that touches the migration surface
        id: candidate
        if: steps.parentage.outputs.ok == 'true'
        run: |
          set -euo pipefail
          echo "stageable=false" >> "$GITHUB_OUTPUT"
          # FAIL CLOSED, the opposite posture to the docs-noop filter: an
          # unreadable preview or diff means we do not know what we would be
          # staging, and the safe answer is not to stage it.
          if ! git rev-parse --verify --quiet 'HEAD^1' >/dev/null 2>&1; then
            echo "::notice::No merge preview to read (conflicted or still computing); not staging."
            exit 0
          fi
          if ! FILES=$(git diff --no-renames --name-only 'HEAD^1' HEAD 2>/dev/null); then
            echo "::notice::Could not read the merge delta; not staging."
            exit 0
          fi
          TOUCHED=""
          for PREFIX in $MIGRATION_SURFACE; do
            MATCHES=$(printf '%s\n' "$FILES" | grep -F -- "$PREFIX" || true)
            [ -n "$MATCHES" ] && TOUCHED="${TOUCHED:+$TOUCHED }$MATCHES"
          done
          if [ -n "$TOUCHED" ]; then
            echo "::notice::Candidate changes the migration surface ($TOUCHED); refusing to stage it. The merge deploy runs migrations the normal way."
            {
              echo "## Prewarm relay: migration-surface refusal"
              echo "This PR's merge preview changes: $TOUCHED"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "migration_refusal=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREVIEW_SHA=$(git rev-parse HEAD)
          TREE=$(git rev-parse 'HEAD^{tree}')
          [[ "$PREVIEW_SHA" =~ ^[0-9a-f]{40}$ && "$TREE" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Preview identity is not two exact object names."
            exit 1
          }
          IMAGE_TAG="spec-$TREE-$(printf '%s' "$PREVIEW_SHA" | cut -c1-12)"
          {
            echo "stageable=true"
            echo "migration_refusal=false"
            echo "preview_sha=$PREVIEW_SHA"
            echo "tree=$TREE"
            echo "image_tag=$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Candidate $IMAGE_TAG is stageable."

      - name: Configure AWS credentials for prewarm
        if: steps.group.outputs.eligible == 'true'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE }}
          aws-region: us-east-1

      - name: Wait for the speculative supply set to exist
        id: supply
        if: steps.candidate.outputs.stageable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.candidate.outputs.tree }}
        run: |
          set -euo pipefail
          echo "present=false" >> "$GITHUB_OUTPUT"
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          NAME="spec-v3-supply-set-$TREE"
          KEY="${MQ_TRANSPORT_PREFIX}supply-set/$TREE.json"
          ATTEMPT=0
          while [ "$ATTEMPT" -lt "$SUPPLY_SET_POLLS" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            # Prefix-conditioned ListBucket cannot authorize HeadObject absence probes.
            # The producer's duplicate guard preserves the attempt-2 jam: an
            # attempt-1 supply set cannot attest a rerun. A bogus immutable key
            # is a permanent squat on this tree until an admin purges it.
            if timeout 60 aws s3api list-objects-v2 --bucket "$MQ_TRANSPORT_BUCKET" --prefix "$KEY" --max-keys 1 > supply-list.json 2> s3-error.txt; then
              if jq -e --arg key "$KEY" 'any(.Contents[]?; .Key == $key)' supply-list.json >/dev/null; then
                echo "present=true" >> "$GITHUB_OUTPUT"
                echo "Speculative supply set $NAME is present after $ATTEMPT poll(s)."
                exit 0
              fi
            else
              S3_EXIT=$?
              if grep -Eq 'AccessDenied|NoSuchBucket|\(403\)' s3-error.txt; then
                echo "::error::S3 poll failed ($S3_EXIT): bucket $MQ_TRANSPORT_BUCKET; check the mq/leaf-web-demo/ transport policy."
                cat s3-error.txt
                exit 1
              fi
            fi
            # Do not pay the interval after the LAST look: the loop has already
            # decided, and sleeping here just holds a runner for another
            # interval to announce a miss it already knows about.
            if [ "$ATTEMPT" -lt "$SUPPLY_SET_POLLS" ]; then
              sleep "$SUPPLY_SET_INTERVAL"
            fi
          done
          echo "::notice::No unexpired $NAME after $SUPPLY_SET_POLLS polls; nothing to stage yet. The next push or approval re-triggers this relay."

      - name: Wait for the exact speculative tag-readiness record
        id: readiness
        if: steps.supply.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.candidate.outputs.tree }}
          SOURCE_SHA: ${{ steps.candidate.outputs.preview_sha }}
          IMAGE_TAG: ${{ steps.candidate.outputs.image_tag }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          [[ "$TREE" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          NAME="spec-tag-readiness-$TREE-$SOURCE_SHA"
          PREFIX="${MQ_TRANSPORT_PREFIX}readiness/$TREE/$SOURCE_SHA/"
          transport_error() {
            if grep -Eq 'AccessDenied|NoSuchBucket|\(403\)' s3-error.txt; then
              echo "::error::S3 poll failed: bucket $MQ_TRANSPORT_BUCKET; check the mq/leaf-web-demo/ transport policy."
              cat s3-error.txt
              exit 1
            fi
          }
          ATTEMPT=0
          while [ "$ATTEMPT" -lt "$SUPPLY_SET_POLLS" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            if timeout 60 aws s3api list-objects-v2 --bucket "$MQ_TRANSPORT_BUCKET" --prefix "$PREFIX" > readiness-list.json 2> s3-error.txt; then
              # first-valid-wins: newest first, with Key breaking LastModified ties.
              jq -r '[.Contents[]?] | sort_by(.LastModified, .Key) | reverse | .[] | .Key' readiness-list.json | tr -d '\r' > readiness-keys.txt
              while IFS= read -r KEY; do
                [[ "$KEY" == "$PREFIX"* ]] || continue
                SUFFIX="${KEY#"$PREFIX"}"
                [[ "$SUFFIX" =~ ^[0-9]+-[0-9]+\.json$ ]] || continue
                if timeout 60 aws s3api head-object --bucket "$MQ_TRANSPORT_BUCKET" --key "$KEY" > readiness-head.json 2> s3-error.txt; then
                  :
                else
                  S3_EXIT=$?
                  transport_error
                  continue
                fi
                CAND_RUN=$(jq -j '.Metadata["run-id"] // empty' readiness-head.json)
                CAND_ATTEMPT=$(jq -j '.Metadata["run-attempt"] // empty' readiness-head.json)
                [[ "$CAND_RUN" =~ ^[0-9]+$ && "$CAND_ATTEMPT" =~ ^[0-9]+$ ]] || continue
                [ "$SUFFIX" = "$CAND_RUN-$CAND_ATTEMPT.json" ] || continue
                WORKFLOW_PATH=".github/workflows/build-platform-images.yml"
                jq -e --arg repo "$REPO_ID" --arg sha "$SOURCE_SHA" \
                  --arg ref "$GITHUB_REPOSITORY/$WORKFLOW_PATH@refs/heads/main" '
                  .Metadata["repository-id"] == $repo and .Metadata["head-sha"] == $sha
                  and .Metadata["workflow-ref"] == $ref and .Metadata.event == "workflow_dispatch"
                ' readiness-head.json >/dev/null || continue
                RUN_RECORD=$(timeout 60 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAND_RUN" 2>/dev/null || true)
                [ -n "$RUN_RECORD" ] || continue
                PATH_OK=$(jq -j --arg path "$WORKFLOW_PATH" '(.path // "" | sub("@.*$"; "")) == $path' <<<"$RUN_RECORD")
                EVENT_OK=$(jq -j '.event == "workflow_dispatch"' <<<"$RUN_RECORD")
                BRANCH_OK=$(jq -j '.head_branch == "main"' <<<"$RUN_RECORD")
                ACTUAL_ATTEMPT=$(jq -j '.run_attempt' <<<"$RUN_RECORD")
                REPO_OK=$(jq -j --argjson repo "$REPO_ID" '.repository.id == $repo and .head_repository.id == $repo' <<<"$RUN_RECORD")
                [ "$PATH_OK" = "true" ] && [ "$EVENT_OK" = "true" ] && [ "$BRANCH_OK" = "true" ] && [ "$REPO_OK" = "true" ] || continue
                [ "$ACTUAL_ATTEMPT" = "$CAND_ATTEMPT" ] || continue
                if timeout 60 aws s3api get-object --bucket "$MQ_TRANSPORT_BUCKET" --key "$KEY" --checksum-mode ENABLED tag-readiness.json > readiness-get.json 2> s3-error.txt; then
                  :
                else
                  S3_EXIT=$?
                  transport_error
                  continue
                fi
                EXPECTED_CHECKSUM=$(jq -j '.ChecksumSHA256 // empty' readiness-get.json)
                ACTUAL_CHECKSUM=$(openssl dgst -sha256 -binary tag-readiness.json | openssl base64 -A)
                [ -n "$EXPECTED_CHECKSUM" ] && [ "$ACTUAL_CHECKSUM" = "$EXPECTED_CHECKSUM" ] || continue
                MEMBER_SIZE=$(wc -c < tag-readiness.json)
                [ "$MEMBER_SIZE" -gt 0 ] && [ "$MEMBER_SIZE" -le 16384 ] || continue
                if jq -e --arg schema "leaf.speculative-tag-readiness.v1" \
                    --arg tree "$TREE" --arg source_sha "$SOURCE_SHA" \
                    --arg image_tag "$IMAGE_TAG" \
                    --arg workflow_path "$WORKFLOW_PATH" \
                    --argjson run "$CAND_RUN" --argjson attempt "$ACTUAL_ATTEMPT" \
                    --argjson repo "$REPO_ID" '
                  .schema == $schema
                  and .source_tree == $tree
                  and .source_sha == $source_sha
                  and .image_tag == $image_tag
                  and .producer_workflow_path == $workflow_path
                  and .producer_run_id == $run
                  and .producer_run_attempt == $attempt
                  and .repository_id == $repo
                  and (.digests.app | test("^sha256:[0-9a-f]{64}$"))
                  and (.digests.broker | test("^sha256:[0-9a-f]{64}$"))
                  and (.digests.canonical_worker | test("^sha256:[0-9a-f]{64}$"))
                  and (.digests.harness | test("^sha256:[0-9a-f]{64}$"))
                  and (.digests.web | test("^sha256:[0-9a-f]{64}$"))
                ' tag-readiness.json >/dev/null 2>&1; then
                  echo "ready=true" >> "$GITHUB_OUTPUT"
                  echo "Speculative tag readiness $NAME verified after $ATTEMPT poll(s) (run $CAND_RUN)."
                  exit 0
                fi
              done < readiness-keys.txt
            else
              S3_EXIT=$?
              transport_error
              echo "::notice::S3 readiness poll returned $S3_EXIT for bucket $MQ_TRANSPORT_BUCKET."
            fi
            if [ "$ATTEMPT" -lt "$SUPPLY_SET_POLLS" ]; then
              sleep "$SUPPLY_SET_INTERVAL"
            fi
          done
          echo "::notice::No exact $NAME after $SUPPLY_SET_POLLS polls; nothing to stage yet. The next push or approval re-triggers this relay."

      - name: Dispatch the prewarm for each coloured service
        id: dispatch
        if: steps.readiness.outputs.ready == 'true'
        env:
          IMAGE_TAG: ${{ steps.candidate.outputs.image_tag }}
          SHA12: ${{ steps.group.outputs.sha12 }}
        run: |
          set -euo pipefail
          echo '[]' > dispatched.json
          for SERVICE in $STAGE_SERVICES; do
            # A refused call is recorded per service; mq-prewarm fails closed.
            # Rail operator handle grammar for LEAF_DEPLOY_APPROVED_BY: ^[A-Za-z0-9-]{1,39}$.
            # LEAF_DEPLOY_PREWARM_PARK=1: the step parks the idle colour (desired count 0)
            # after a successful stage; nothing adopts a staged candidate (leaf-plan #74)
            # and a warm web-alt trips staging's deployment-identity check. Inert until prewarm.sh reads it.
            if ! DISPATCH_OUTPUT=$(timeout 60 aws codebuild start-build \
                --project-name leaf-deploy-terraform-staging \
                --environment-variables-override \
                name=STEP,value=prewarm \
                "name=LEAF_DEPLOY_APPROVED_BY,value=merge-queue-$SHA12" \
                "name=LEAF_DEPLOY_SERVICE,value=$SERVICE" \
                "name=LEAF_DEPLOY_IMAGE_TAG,value=$IMAGE_TAG" \
                name=LEAF_DEPLOY_EXPECTED_TD,value=auto-live \
                name=LEAF_DEPLOY_PREWARM_PARK,value=1 \
                "name=LEAF_DEPLOY_REQUEST_ID,value=$SHA12-$GITHUB_RUN_ID" \
                --output json 2>&1); then
              printf '%s' "$DISPATCH_OUTPUT"
              echo "::warning::Prewarm dispatch for $SERVICE failed; the merge deploy will warm normally."
              jq --arg service "$SERVICE" '. + [{service: $service, build_id: null, disposition: "dispatch-failed"}]' \
                dispatched.json > dispatched.tmp && mv dispatched.tmp dispatched.json
              continue
            fi
            BUILD_ID=$(jq -r '.build.id | select(type == "string")' <<<"$DISPATCH_OUTPUT" 2>/dev/null || true)
            if [[ "$BUILD_ID" =~ ^leaf-deploy-terraform-staging:[0-9a-f-]{36}$ ]]; then
              echo "Prewarm for $SERVICE is build $BUILD_ID."
              jq --arg service "$SERVICE" --arg build_id "$BUILD_ID" \
                '. + [{service: $service, build_id: $build_id, disposition: "dispatched"}]' \
                dispatched.json > dispatched.tmp && mv dispatched.tmp dispatched.json
            else
              echo "::warning::Dispatched $SERVICE but received no valid build id; not claiming one."
              jq --arg service "$SERVICE" '. + [{service: $service, build_id: null, disposition: "unresolved"}]' \
                dispatched.json > dispatched.tmp && mv dispatched.tmp dispatched.json
            fi
          done
          jq . dispatched.json

      - name: Emit the relay receipt
        id: receipt
        if: always() && steps.group.outputs.eligible == 'true'
        env:
          HEAD_SHA: ${{ steps.group.outputs.head_sha }}
          BASE_SHA: ${{ steps.group.outputs.base_sha }}
          MEMBERS: ${{ steps.group.outputs.members }}
          ELIGIBILITY: ${{ steps.group.outputs.reason }}
          IMAGE_TAG: ${{ steps.candidate.outputs.image_tag }}
          PREVIEW_SHA: ${{ steps.candidate.outputs.preview_sha }}
          TREE: ${{ steps.candidate.outputs.tree }}
          MIGRATION_REFUSAL: ${{ steps.candidate.outputs.migration_refusal }}
          SUPPLY_PRESENT: ${{ steps.supply.outputs.present }}
          TAG_READY: ${{ steps.readiness.outputs.ready }}
          CONFIGURED_SERVICES: ${{ env.STAGE_SERVICES }}
        run: |
          set -euo pipefail
          [ -f dispatched.json ] || echo '[]' > dispatched.json
          jq -n \
            --arg schema "leaf.staging-prewarm-relay.v2" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --argjson members "$MEMBERS" \
            --arg eligibility "$ELIGIBILITY" \
            --arg image_tag "${IMAGE_TAG:-}" \
            --arg preview_sha "${PREVIEW_SHA:-}" \
            --arg tree "${TREE:-}" \
            --arg migration_refusal "${MIGRATION_REFUSAL:-false}" \
            --arg supply_set_present "${SUPPLY_PRESENT:-false}" \
            --arg tag_ready "${TAG_READY:-false}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg configured_services "$CONFIGURED_SERVICES" \
            --slurpfile dispatched dispatched.json \
            '{schema: $schema, producer: "codebuild",
              group: {head_sha: $head_sha, base_sha: $base_sha, members: $members},
              eligibility: $eligibility,
              image_tag: $image_tag, preview_sha: $preview_sha, tree: $tree,
              migration_refusal: ($migration_refusal == "true"),
              supply_set_present: ($supply_set_present == "true"),
              tag_ready: ($tag_ready == "true"),
              configured_services: ($configured_services | split(" ") | map(select(length > 0)) | unique),
              relay_run_id: $run_id, relay_run_attempt: $run_attempt, dispatched: $dispatched[0]}' > prewarm-relay-receipt.json
          jq . prewarm-relay-receipt.json

      - name: Put the relay receipt in S3
        if: always() && steps.receipt.outcome == 'success' && steps.group.outputs.eligible == 'true'
        env:
          HEAD_SHA: ${{ steps.group.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || exit 1
          SHA12="${HEAD_SHA:0:12}"
          if timeout 60 aws s3api put-object --bucket "$MQ_TRANSPORT_BUCKET" \
            --key "${MQ_TRANSPORT_PREFIX}relay/$SHA12/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" \
            --body prewarm-relay-receipt.json --if-none-match '*' --checksum-algorithm SHA256 \
            --metadata "run-id=$GITHUB_RUN_ID,run-attempt=$GITHUB_RUN_ATTEMPT,workflow-ref=$GITHUB_WORKFLOW_REF,repository-id=$GITHUB_REPOSITORY_ID,head-sha=$HEAD_SHA,event=$GITHUB_EVENT_NAME" 2> s3-error.txt; then
            :
          else
            S3_EXIT=$?
            echo "::error::Relay receipt write failed ($S3_EXIT): bucket $MQ_TRANSPORT_BUCKET; check the mq/leaf-web-demo/ transport policy. Per-run keys must be unique."
            cat s3-error.txt
            exit 1
          fi

      - name: Upload the relay receipt
        continue-on-error: true
        if: always() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          # Keyed by the group head's short sha, the same identity the
          # descale arm's PR-side lookup uses for a PR number: stable, and
          # never guessed from a listing.
          name: prewarm-relay-receipt-mg-${{ steps.group.outputs.sha12 }}
          path: prewarm-relay-receipt.json
          if-no-files-found: error
          retention-days: 30
