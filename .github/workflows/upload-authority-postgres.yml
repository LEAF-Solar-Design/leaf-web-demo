name: Upload authority PostgreSQL gate

on:
  pull_request:
    paths:
      - '.github/workflows/upload-authority-postgres.yml'
      - 'da/store.py'
      - 'platform/migrations/0016_drawing_upload_authority.sql'
      - 'platform/api.py'
      - 'platform/tests/conftest.py'
      - 'platform/tests/test_drawing_import.py'
      - 'deploy/required-config.app.json'
      - 'deploy/required-config.broker.json'
      - 'server/guest_uploads.py'
      - 'server/broker.py'
      - 'server/routers/drawings.py'
      - 'server/routers/uploads.py'
      - 'server/write_loop.py'
      - 'server/tests/conftest.py'
      - 'server/tests/test_broker_boundary.py'
      - 'server/tests/test_deployment_source_identity.py'
      - 'server/tests/test_drawing_upload_authority_postgres.py'
      - 'server/tests/test_guest_fail_closed.py'
      - 'server/tests/test_guest_session_auth.py'
      - 'server/tests/test_guest_uploads.py'
      - 'server/tests/test_postgres_container_wiring.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-authority-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leaf_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leaf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/leaf_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            platform/requirements.txt
            da/requirements.txt

      - name: Install test dependencies
        run: >-
          python -m pip install
          -r server/requirements.txt
          -r platform/requirements.txt
          -r da/requirements.txt

      - name: Run PostgreSQL authority and race tests
        working-directory: server
        run: python -m pytest -q tests/test_drawing_upload_authority_postgres.py

      - name: Run upload and authored-mutation boundary tests
        working-directory: server
        run: >-
          python -m pytest -q
          tests/test_guest_uploads.py
          tests/test_guest_fail_closed.py
          tests/test_guest_session_auth.py
          tests/test_broker_boundary.py
          tests/test_postgres_container_wiring.py
          tests/test_deployment_source_identity.py

      - name: Run canonical drawing import gate tests
        run: python -m pytest -q platform/tests/test_drawing_import.py
