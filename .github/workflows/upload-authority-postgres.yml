name: Upload authority PostgreSQL gate

on:
  pull_request:
    paths:
      - '.github/workflows/upload-authority-postgres.yml'
      - 'contract/customization.v1.schema.json'
      - 'da/store.py'
      - 'platform/authority-inventory.json'
      - 'platform/campaign_capabilities.py'
      - 'platform/campaign_enrollment.py'
      - 'platform/campaign_execution.py'
      - 'platform/campaigns.py'
      - 'platform/tests/test_campaign_capabilities.py'
      - 'server/campaign_capability_api.py'
      - 'server/campaign_capability_job.py'
      - 'server/campaign_bridge.py'
      - 'server/routers/campaigns.py'
      - 'server/routers/jobs.py'
      - 'server/build_receipts.py'
      - 'server/tool_loader.py'
      - 'server/tool_validate.py'
      - 'server/deps.py'
      - 'server/tests/test_campaign_capability_job.py'
      - 'server/tests/test_campaign_capability_job_access.py'
      - 'server/tests/test_campaign_capability_api.py'
      - 'server/tests/test_campaign_capability_api_postgres.py'
      - 'platform/db.py'
      # The two explicit entries are pinned by
      # server/tests/test_postgres_container_wiring.py so nobody can quietly
      # drop the upload and customization migrations from this gate; keep them.
      # The glob is additive: the schema_status authority gate below asserts
      # catalog objects created by 0014_broker.sql, and a migration this
      # workflow can break but is not triggered by is the same gap in a new
      # place. Overlapping entries are harmless -- `paths` is a union.
      - 'platform/migrations/0016_drawing_upload_authority.sql'
      - 'platform/migrations/0020_customization_authority.sql'
      - 'platform/migrations/**'
      - 'platform/api.py'
      - 'platform/mutation_fence.py'
      - 'platform/tests/conftest.py'
      - 'platform/tests/test_db_readiness_static.py'
      - 'platform/overlay_store.py'
      - 'platform/tests/test_overlay_store_postgres.py'
      - 'platform/tests/test_overlay_store_static.py'
      # The rest of the platform import closure the live async-job callback test
      # reaches. Its terminal write mirrors through platform_link._update_by_spine,
      # which calls _load_platform(); that first runs _ensure_platform_package(),
      # which EXECUTES platform/__init__.py through spec.loader.exec_module, and
      # then imports leaf_platform.{db,store,deps}. A break in any of them raises
      # through terminal_in_transaction and fails that test.
      # This is the COMPUTED closure, not a guess: walking import-time edges from
      # the package __init__ plus store/deps/db reaches exactly
      # {__init__, db, deps, models, store}. db.py was already listed, and
      # __init__.py imports nothing, so it adds no further edges. That is where
      # this list stops, because nothing else in the package runs on this path.
      - 'platform/__init__.py'
      - 'platform/deps.py'
      - 'platform/models.py'
      - 'platform/store.py'
      - 'platform/tests/test_drawing_import.py'
      - 'platform/tests/test_schema_status_postgres_authority.py'
      - 'scripts/reconcile_customization_authority.py'
      - 'scripts/reconcile_sessions_authority.py'
      # The WORKDIR/COPY guard in test_postgres_container_wiring.py reads this
      # file, so a change to it must trigger the gate that runs the guard.
      - 'deploy/Dockerfile.app'
      - 'deploy/required-config.app.json'
      - 'deploy/required-config.broker.json'
      - 'server/guest_uploads.py'
      - 'server/broker.py'
      - 'server/customization_audit.py'
      - 'server/customization_authority.py'
      - 'server/customization_flags.py'
      - 'server/customization_models.py'
      - 'server/customization_postgres_store.py'
      - 'server/customization_service.py'
      - 'server/customization_store.py'
      # The async-job authority and its callback route. `server/broker.py` was
      # already listed, so a change to the callback attempt guard already
      # triggered this workflow while no step here ran the suite that covers it.
      # `server/da/callbacks.py` is loaded by `broker._get_callbacks()` and does
      # the signing and PostgreSQL replay consumption the live subprocess test
      # drives end to end, so a PR touching only that file must start this job.
      - 'server/da/callbacks.py'
      - 'server/job_pg_store.py'
      - 'server/jobs.py'
      - 'server/ops_metrics_read.py'
      - 'server/platform_link.py'
      - 'server/routers/drawings.py'
      - 'server/routers/ops.py'
      - 'server/routers/uploads.py'
      - 'server/write_loop.py'
      - 'server/tests/conftest.py'
      - 'server/tests/test_broker_boundary.py'
      - 'server/tests/test_customization_postgres_contract.py'
      - 'server/tests/test_customization_postgres_integration.py'
      - 'server/tests/test_customization_runtime.py'
      - 'server/tests/test_deployment_source_identity.py'
      - 'server/tests/test_drawing_upload_authority_postgres.py'
      - 'server/tests/test_guest_fail_closed.py'
      - 'server/tests/test_guest_session_auth.py'
      - 'server/tests/test_guest_uploads.py'
      - 'server/tests/test_jobs_callbacks_postgres.py'
      - 'server/tests/test_ops_metrics.py'
      - 'server/tests/test_ops_metrics_pg.py'
      - 'server/tests/test_postgres_authority_inventory_contract.py'
      - 'server/tests/test_postgres_container_wiring.py'
      - 'server/tests/test_reconcile_sessions_authority.py'
      - 'server/tests/test_session_store_postgres.py'
      - 'server/tests/test_version_restore.py'
      - 'server/session_store.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-authority-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-authority:
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leaf_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leaf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/leaf_test
      PG_CUSTOMIZATION_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/leaf_test
      # The T1 overlay live suite SKIPS when this is unset. A review found
      # every one of its concurrency tests silently skipping in CI, so the
      # CAS and locking guarantees were unverified on the gate.
      OVERLAY_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/leaf_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            platform/requirements.txt
            da/requirements.txt

      - name: Install test dependencies
        run: >-
          python -m pip install
          -r server/requirements.txt
          -r platform/requirements.txt
          -r da/requirements.txt

      # FIRST, because every step below assumes a schema this image can serve.
      # Until this step existed, no CI job anywhere executed schema_status()
      # with an authority selector at postgres against a live database: the
      # test-gate workflow is deliberately hermetic (DATABASE_URL unset on
      # purpose) so run-all-gates' db_gated `platform` suite skips there, and
      # this workflow listed platform/db.py in `paths:` while every step ran a
      # named server/ test that never called schema_status(). Trigger coverage
      # is not step coverage: PR #187 went green on all three checks with a
      # committed db.py that returned ok=false on real PostgreSQL, which
      # assert_schema_current() raises on at startup.
      - name: Run platform authority schema_status gate
        working-directory: server
        run: |
          # Did-not-skip assertion in the same shape as the overlay step below,
          # whose comment carries the full reason for the bash string match
          # over `... | grep -q`. Both halves are load-bearing HERE, and the
          # `if !` is the half that does the work today. MEASURED, not assumed:
          # with DATABASE_URL unset this module does not skip, it FAILS --
          # "13 failed, 13 passed", each failure a
          # `RuntimeError: DATABASE_URL is not set` raised from platform/db.py.
          # A bare `out=$(pytest ...)` would abort the step under `bash -e {0}`
          # with all 13 tracebacks trapped inside `$out`, so the log would show
          # a red step and no reason. The `if !` prints them. The string match
          # then covers the other mode, a future skipif that exits 0.
          #
          # Note for anyone extending this: the platform conftest's
          # pytest_ignore_collect does NOT apply here. pytest consults that hook
          # when it recurses into a directory, not for a file named explicitly
          # on the command line, and this step names its module explicitly.
          # Verified against pytest 9.1.1 with a known-positive control.
          if ! out=$(python -m pytest --import-mode=importlib -q -rs \
              ../platform/tests/test_schema_status_postgres_authority.py); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          if [[ "${out,,}" == *skipped* ]]; then
            printf '%s\n' "$out"
            echo 'FAIL: schema_status authority tests skipped - DATABASE_URL is not reaching pytest.'
            exit 1
          fi

      - name: Run T1 overlay store PostgreSQL suite
        working-directory: platform
        run: |
          # The static half carries the assertion; the live half deliberately
          # does NOT. The next step re-runs `tests/test_overlay_store_postgres.py`
          # for the sole purpose of asserting it did not skip, so adding a
          # second copy of that assertion here would gate the same command
          # twice and buy nothing. The static proofs are the ones nothing else
          # covers, and they are meant to run in every environment: measured,
          # this module reports "22 passed" with DATABASE_URL unset. So a skip
          # here means a test-level gate appeared and the dependency-free
          # proofs quietly stopped being proofs.
          if ! out=$(python -m pytest -q -rs tests/test_overlay_store_static.py); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          if [[ "${out,,}" == *skipped* ]]; then
            printf '%s\n' "$out"
            echo 'FAIL: overlay static proofs skipped - they must run everywhere.'
            exit 1
          fi
          # -p no:randomly keeps the concurrency tests deterministic.
          python -m pytest -q tests/test_overlay_store_postgres.py

      - name: Assert the overlay live suite did NOT skip
        working-directory: platform
        run: |
          # A skipped concurrency suite reports green and proves nothing.
          # This is the check the review's finding actually needs.
          # Guarded like every sibling step: a bare `out=$(...)` aborts the step
          # under `bash -e {0}` before the printf below can run, so a red suite
          # reached the log as nothing but the exit code (the #1017 gate).
          if ! out=$(python -m pytest -q tests/test_overlay_store_postgres.py -rs); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          # A bash string match rather than `echo "$out" | grep -qi`. This is
          # DEFENSIVE, not a bug fix: the pipeline form is correct as this
          # workflow stands today, and the reason is worth writing down because
          # it is easy to arm by accident.
          #
          # `grep -q` exits at its FIRST match and can SIGPIPE a producer that
          # is still writing. Whether that matters depends entirely on pipefail.
          # These steps declare no `shell:`, and no workflow- or job-level
          # `defaults.run.shell` exists, so GitHub runs them as `bash -e {0}` --
          # WITHOUT pipefail. The pipeline therefore reports grep's own status
          # and the check works. Measured with the match early and ~1.6MB still
          # unwritten: `bash -e` catches the skip, `bash -eo pipefail` misses it.
          #
          # The trap is that `shell: bash`, or a `defaults.run.shell: bash`
          # block, adds `-eo pipefail` -- a routine hardening edit that could
          # then silently cause this assertion to MISS a skip. Not always: it
          # needs the producer to actually take SIGPIPE, so a short or trailing
          # match still returns 0 and still catches. That conditional, invisible
          # failure is the point; the string match removes the pipefail/SIGPIPE
          # failure mode outright rather than leaving it to output shape.
          #
          # `${out,,}` lowercases first, so it is exactly as case-insensitive as
          # the `grep -qi` it replaces. Same shape as the sessions reconciler
          # step below.
          if [[ "${out,,}" == *skipped* ]]; then
            echo 'FAIL: overlay live tests skipped — OVERLAY_PG_URL not reaching pytest'
            exit 1
          fi

      # This file has ALREADY reported vacuous green once: it read "4 passed,
      # 16 skipped" locally while two of its tests called a nonexistent
      # `postgres_authority.connect()` (the real API is `connection()`), and
      # only CI caught it. Its 22 race tests are gated on DATABASE_URL by both
      # a `requires_database` skipif and a fixture-level `pytest.skip`, so
      # losing the environment variable turns the whole authority-and-race
      # proof into a green no-op. That is what this assertion refuses.
      - name: Run PostgreSQL authority and race tests
        working-directory: server
        run: |
          if ! out=$(python -m pytest -q -rs tests/test_drawing_upload_authority_postgres.py); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          if [[ "${out,,}" == *skipped* ]]; then
            printf '%s\n' "$out"
            echo 'FAIL: upload authority race tests skipped - DATABASE_URL is not reaching pytest.'
            exit 1
          fi

      # EXEMPT from the did-not-skip assertion, and it is the one step here
      # that must stay exempt: this test is gated on LEAF_RESTORE_PG_PROOF_DB,
      # which this workflow deliberately does not set. Its skipif reason spells
      # out why -- the test applies every migration and leaves randomized
      # manifest, version and checkout rows behind, so a generic ambient
      # DATABASE_URL must NEVER trigger it. Measured output here is
      # "1 skipped, 26 deselected", so a blanket assertion would red-fail the
      # workflow on every run. Skipping IS the correct behaviour; the step is
      # kept so that an operator who exports a disposable URL gets the proof.
      - name: Run PostgreSQL live-DWG version restore proof
        working-directory: server
        run: >-
          python -m pytest -q tests/test_version_restore.py
          -k postgres_live_dwg_restore_preserves_blob_and_readable_cache

      - name: Run observability read-model PostgreSQL verifier
        working-directory: server
        run: |
          # Whole-module skipif on DATABASE_URL, so all three tests vanish
          # together and the read-model verifier reports green having verified
          # nothing. Same assertion shape as the steps above.
          if ! out=$(python -m pytest -q -rs tests/test_ops_metrics_pg.py); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          if [[ "${out,,}" == *skipped* ]]; then
            printf '%s\n' "$out"
            echo 'FAIL: ops metrics read-model tests skipped - DATABASE_URL is not reaching pytest.'
            exit 1
          fi

      # Nine of this suite's ten tests need DATABASE_URL, and its run-all-gates
      # floor is 1, so on the hermetic test-gate workflow it reports green with
      # nine tests inert. That is not hypothetical: the signed /da/callback test
      # was cited as evidence the callback path worked while it could not have
      # passed, because a later `attempt` guard in broker.py refuses the body it
      # sends and no runner ever executed it. The suite runs here, where a
      # database exists, and the skip check below is what makes that a fact
      # rather than an intention.
      - name: Run async-job callback PostgreSQL suite
        working-directory: server
        run: |
          # ONE run for both the result and the did-not-skip check. Two runs
          # could disagree, and it is the executed run whose skips matter.
          # The `if !` is not decoration: under `bash -e {0}` a bare
          # `out=$(pytest ...)` aborts the step on a real test failure with the
          # captured stdout still inside `$out`, so the failure detail never
          # reaches the log. This prints it, then fails.
          if ! out=$(python -m pytest -q -rs tests/test_jobs_callbacks_postgres.py); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          # Same bash string match as the overlay and sessions steps, for the
          # reason written out in full at the overlay skip-check above.
          # `${out,,}` keeps it as case-insensitive as `grep -qi`.
          # The match is deliberately broad, so a passing run whose output happened
          # to contain the word "skipped" (a warning, say) would fail this step.
          # That direction is accepted: a false FAIL is loud and fixed in one edit,
          # a false PASS is the vacuous green this step exists to prevent. Keeping
          # the same form as the two steps around it is worth more than a tighter
          # pattern that only this one uses.
          if [[ "${out,,}" == *skipped* ]]; then
            printf '%s\n' "$out"
            echo 'FAIL: async-job callback tests skipped - DATABASE_URL is not reaching pytest.'
            echo 'A skipped suite reports green and proves nothing. That is the bug this step exists for.'
            exit 1
          fi

      - name: Run host capability platform PostgreSQL suite
        working-directory: server
        run: |
          report=$(mktemp "$RUNNER_TEMP/host-capability-platform.XXXXXX.xml")
          if python -m pytest -q -rs ../platform/tests/test_campaign_capabilities.py --junitxml="$report" >"$report.log" 2>&1; then
            tail -5 "$report.log"
          else
            pytest_exit=$?
            tail -100 "$report.log"
            exit "$pytest_exit"
          fi
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          cases = list(root.iter("testcase"))
          if not cases:
              raise SystemExit("FAIL: no host capability testcases")
          if any(list(root.iter(tag)) for tag in ("skipped", "error", "failure")):
              raise SystemExit("FAIL: host capability report contains skipped/error/failure nodes")
          module = "test_campaign_capabilities"
          if any(module not in case.get("classname", "").split(".") for case in cases):
              raise SystemExit("FAIL: unexpected host capability module identity")
          required = {
              "test_host_grant_exact_authority_read_preserves_state",
              "test_completed_link_recovers_missing_settlement_from_exact_replay",
              "test_link_state_alone_cannot_complete_task",
          }
          observed = {case.get("name", "").split("[", 1)[0] for case in cases}
          missing = required - observed
          if missing:
              raise SystemExit(f"FAIL: missing host capability cases: {sorted(missing)}")
          print(f"Host capability PostgreSQL proof: {len(cases)} cases, no skips")
          PY

      - name: Run host capability API PostgreSQL suite
        working-directory: server
        run: |
          report=$(mktemp "$RUNNER_TEMP/host-capability-api.XXXXXX.xml")
          if python -m pytest -q -rs tests/test_campaign_capability_api_postgres.py --junitxml="$report" >"$report.log" 2>&1; then
            tail -5 "$report.log"
          else
            pytest_exit=$?
            tail -100 "$report.log"
            exit "$pytest_exit"
          fi
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          cases = list(root.iter("testcase"))
          if not cases:
              raise SystemExit("FAIL: no host capability testcases")
          if any(list(root.iter(tag)) for tag in ("skipped", "error", "failure")):
              raise SystemExit("FAIL: host capability report contains skipped/error/failure nodes")
          module = "test_campaign_capability_api_postgres"
          if any(module not in case.get("classname", "").split(".") for case in cases):
              raise SystemExit("FAIL: unexpected host capability module identity")
          required = {
              "test_real_postgres_capability_api_two_uses_and_unknown_outcome",
          }
          observed = {case.get("name", "").split("[", 1)[0] for case in cases}
          missing = required - observed
          if missing:
              raise SystemExit(f"FAIL: missing host capability cases: {sorted(missing)}")
          print(f"Host capability PostgreSQL proof: {len(cases)} cases, no skips")
          PY

      - name: Run customization authority PostgreSQL tests
        working-directory: server
        run: |
          test -n "${PG_CUSTOMIZATION_TEST_URL:-}"
          mkdir -p "$RUNNER_TEMP/leaf-customization-pythonpath"
          ln -s "$GITHUB_WORKSPACE/scripts" \
            "$RUNNER_TEMP/leaf-customization-pythonpath/scripts"
          # The `test -n` above proves the variable exists in the STEP's shell.
          # This proves pytest itself observed it: the integration module is
          # skipif'd on PG_CUSTOMIZATION_TEST_URL, and the two modules beside
          # it are ungated today but nothing stops a gate appearing there. Same
          # assertion shape as the steps above, plus the executed-count floor
          # the boundary step below justifies in full: three modules run in ONE
          # invocation here, and a `pytest_collection_modifyitems` hook that
          # REMOVES items produces a clean exit 0 that never prints "skipped".
          # run-all-gates.py floors only two of the three, and
          # test_customization_postgres_integration has no floor there at all,
          # so some of what runs here sits unpinned. The two floors were 9 and
          # 26 when this was written; both were re-measured on 2026-08-13 (to 11
          # and 50) because they had drifted below their executed counts, so
          # read the current numbers off run-all-gates.py rather than from here.
          # The unpinned remainder is deliberately not restated: it is a
          # subtraction against those floors AND against what this live-PG
          # invocation executes, and re-deriving it needs a measured run in
          # THIS environment, not the hermetic one the floors come from.
          if ! out=$(PYTHONPATH="$RUNNER_TEMP/leaf-customization-pythonpath" \
              python -m pytest -q -rs \
              "$GITHUB_WORKSPACE/server/tests/test_customization_postgres_contract.py" \
              "$GITHUB_WORKSPACE/server/tests/test_customization_postgres_integration.py" \
              "$GITHUB_WORKSPACE/server/tests/test_customization_runtime.py"); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          if [[ "${out,,}" == *skipped* ]]; then
            printf '%s\n' "$out"
            echo 'FAIL: customization authority tests skipped - PG_CUSTOMIZATION_TEST_URL is not reaching pytest.'
            exit 1
          fi
          ran=$(printf '%s\n' "$out" | grep -oE '[0-9]+ passed' | tail -1 | cut -d' ' -f1)
          if [ "${ran:-0}" -lt 56 ]; then
            printf '%s\n' "$out"
            echo "FAIL: only ${ran:-0} customization tests executed, floor is 56 - tests stopped being collected without reporting a skip."
            exit 1
          fi

      - name: Run fused request activation PostgreSQL tests
        working-directory: server
        run: |
          [[ -n "${PG_CUSTOMIZATION_TEST_URL:-}" ]]
          if ! out=$(python -m pytest -q -rs \
              "$GITHUB_WORKSPACE/server/tests/test_request_journal_activation_postgres.py"); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          if [[ "${out,,}" == *skipped* ]]; then
            printf '%s\n' "$out"
            echo 'FAIL: fused request activation PostgreSQL tests skipped.'
            exit 1
          fi
          ran=$(printf '%s\n' "$out" | grep -oE '[0-9]+ passed' | tail -1 | cut -d' ' -f1)
          if [ "${ran:-0}" -lt 8 ]; then
            printf '%s\n' "$out"
            echo "FAIL: only ${ran:-0} fused request activation tests executed, floor is 8."
            exit 1
          fi

      # The gate a LEAF_SESSIONS_STORE promotion out of dual_write_shadow rests
      # on. DATABASE_URL is set at job level, so the live half of this suite
      # EXECUTES here; the "did not skip" assertion below is what stops it
      # quietly reverting to 10-passed-21-skipped vacuous green.
      - name: Run sessions authority reconciler tests
        working-directory: server
        run: |
          # Keep pytest inside a conditional so bash -e does not exit before
          # the captured failure is printed. This suite is the authority gate;
          # an opaque exit code cannot identify the failed schema contract.
          if ! out=$(python -m pytest -q tests/test_reconcile_sessions_authority.py -rs 2>&1); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          # A bash string match rather than `... | grep -q`, for the reason
          # written out at the overlay skip-check above: `grep -q` can SIGPIPE a
          # still-writing producer, which IF pipefail is on can silently cause
          # this assertion to miss a skip. Pipefail is not on here (no `shell:`
          # and no `defaults.run.shell`, so GitHub uses `bash -e {0}`), so this
          # is defensive against a future `shell: bash`, not a live fix.
          # `${out,,}` keeps it as case-insensitive as `grep -qi`.
          if [[ "${out,,}" == *skipped* ]]; then
            echo 'FAIL: sessions reconciler live tests skipped — DATABASE_URL not reaching pytest'
            exit 1
          fi

      - name: Run upload and authored-mutation boundary tests
        working-directory: server
        run: |
          # Unlike every other assertion in this job, this one is NOT a
          # database-wiring check, and the message says so. Measured: these
          # seven modules report "227 passed" with DATABASE_URL entirely
          # unset, so losing the database would not skip them. Exactly one
          # conditional skip exists across the set -- test_guest_fail_closed.py
          # gates a test on `os.name != "posix"` because fcntl is a Linux
          # deployment contract -- and it cannot fire on ubuntu-latest. So what
          # this assertion buys is a NEW skip gate appearing in any of the seven
          # modules, and the runner image ceasing to be posix, which would
          # genuinely stop verifying the fcntl contract.
          #
          # The skip match alone is NOT enough, so this step also pins the
          # total. A skip-only assertion sees nothing when items are REMOVED
          # rather than marked: `pytest_collection_modifyitems` runs even for
          # files named explicitly on the command line (unlike
          # `pytest_ignore_collect`, which pytest bypasses for explicit initial
          # args). Demonstrated on this exact step -- a hook dropping the three
          # cutover-marker items yields "224 passed", exit 0, and the word
          # "skipped" never appears. Three tests stop running and the step
          # stays green.
          #
          # scripts/run-all-gates.py does carry per-module floors, but they do
          # NOT cover this. They are 57, 36, 14, 59, 41, 9 for six of these
          # seven modules, summing to 216 while those same six actually run
          # 224; test_drawing_authority_cutover_marker has no floor there at
          # all and runs 3; and the runner tolerates counts above a floor as
          # drift rather than failing. So 11 tests are unpinned there -- 8
          # inside the floored modules, plus that whole 3-test module. The
          # floors complement this total; they do not replace it.
          #
          # 227 was measured on this runner and locally on PostgreSQL 16.14
          # (61 + 38 + 14 + 59 + 41 + 11 + 3). It is a floor, so adding tests
          # never trips it and only a DROP does. Deleting a test on purpose
          # means lowering this number in the same commit, deliberately.
          #
          # Raised 227 -> 230 on 2026-08-07, in two steps. +2 for the post-merge
          # review of the WORKDIR/COPY guard, and +1 more after merging
          # origin/main, which added
          # test_the_image_asserts_its_own_reconcilers_at_build_time to the same
          # module and did NOT raise this number. Raising by exactly the count of
          # tests added is safe whatever the true total is, because all three are
          # unconditional -- that module carries no skipif, pytest.skip or
          # importorskip, so no runner executes fewer. Adding them without
          # raising this would have been safe too, and useless: the floor's
          # whole value is being tight enough that a later DROP trips it.
          #
          # The parenthetical breakdown above is stale and deliberately left
          # as-written rather than re-derived by arithmetic: its 41 term predates
          # commits that changed that module's count, and re-measuring it needs
          # this runner's PostgreSQL, not a local box where the guest and broker
          # modules skip. Re-measure it there before trusting the addends.
          if ! out=$(python -m pytest -q -rs \
              tests/test_guest_uploads.py \
              tests/test_guest_fail_closed.py \
              tests/test_guest_session_auth.py \
              tests/test_broker_boundary.py \
              tests/test_postgres_container_wiring.py \
              tests/test_deployment_source_identity.py \
              tests/test_drawing_authority_cutover_marker.py); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          if [[ "${out,,}" == *skipped* ]]; then
            printf '%s\n' "$out"
            echo 'FAIL: upload and authored-mutation boundary tests skipped - a new gate appeared, or the runner stopped being posix.'
            exit 1
          fi
          # `cut` ends the pipeline, so this assignment cannot abort the step
          # under `bash -e`: an unmatched grep leaves `ran` empty, which the
          # `${ran:-0}` default turns into a loud 0 rather than a silent pass.
          ran=$(printf '%s\n' "$out" | grep -oE '[0-9]+ passed' | tail -1 | cut -d' ' -f1)
          if [ "${ran:-0}" -lt 230 ]; then
            printf '%s\n' "$out"
            echo "FAIL: only ${ran:-0} boundary tests executed, floor is 230 - tests stopped being collected without reporting a skip."
            exit 1
          fi

      - name: Run canonical drawing import gate tests
        working-directory: server
        run: |
          # The other `platform/tests/` module run from `server/`, but its
          # failure mode is the opposite of the schema_status step's. MEASURED:
          # with DATABASE_URL unset this reports "17 skipped" -- the `make_org`
          # fixture in platform/tests/conftest.py calls pytest.skip -- so the
          # whole gate becomes a green no-op and the STRING MATCH is the half
          # that catches it. As at that step, pytest_ignore_collect is not
          # involved: it is not consulted for a file named explicitly on the
          # command line.
          if ! out=$(python -m pytest --import-mode=importlib -q -rs \
              ../platform/tests/test_drawing_import.py); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          if [[ "${out,,}" == *skipped* ]]; then
            printf '%s\n' "$out"
            echo 'FAIL: canonical drawing import gate tests skipped - DATABASE_URL is not reaching pytest.'
            exit 1
          fi
