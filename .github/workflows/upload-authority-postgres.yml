name: Upload authority PostgreSQL gate

on:
  pull_request:
    paths:
      - '.github/workflows/upload-authority-postgres.yml'
      - 'contract/customization.v1.schema.json'
      - 'da/store.py'
      - 'platform/authority-inventory.json'
      - 'platform/db.py'
      # The two explicit entries are pinned by
      # server/tests/test_postgres_container_wiring.py so nobody can quietly
      # drop the upload and customization migrations from this gate; keep them.
      # The glob is additive: the schema_status authority gate below asserts
      # catalog objects created by 0014_broker.sql, and a migration this
      # workflow can break but is not triggered by is the same gap in a new
      # place. Overlapping entries are harmless -- `paths` is a union.
      - 'platform/migrations/0016_drawing_upload_authority.sql'
      - 'platform/migrations/0020_customization_authority.sql'
      - 'platform/migrations/**'
      - 'platform/api.py'
      - 'platform/mutation_fence.py'
      - 'platform/tests/conftest.py'
      - 'platform/tests/test_db_readiness_static.py'
      - 'platform/overlay_store.py'
      - 'platform/tests/test_overlay_store_postgres.py'
      - 'platform/tests/test_overlay_store_static.py'
      - 'platform/tests/test_drawing_import.py'
      - 'platform/tests/test_schema_status_postgres_authority.py'
      - 'scripts/reconcile_customization_authority.py'
      - 'deploy/required-config.app.json'
      - 'deploy/required-config.broker.json'
      - 'server/guest_uploads.py'
      - 'server/broker.py'
      - 'server/customization_audit.py'
      - 'server/customization_authority.py'
      - 'server/customization_flags.py'
      - 'server/customization_models.py'
      - 'server/customization_postgres_store.py'
      - 'server/customization_service.py'
      - 'server/customization_store.py'
      - 'server/ops_metrics_read.py'
      - 'server/platform_link.py'
      - 'server/routers/drawings.py'
      - 'server/routers/ops.py'
      - 'server/routers/uploads.py'
      - 'server/write_loop.py'
      - 'server/tests/conftest.py'
      - 'server/tests/test_broker_boundary.py'
      - 'server/tests/test_customization_postgres_contract.py'
      - 'server/tests/test_customization_postgres_integration.py'
      - 'server/tests/test_customization_runtime.py'
      - 'server/tests/test_deployment_source_identity.py'
      - 'server/tests/test_drawing_upload_authority_postgres.py'
      - 'server/tests/test_guest_fail_closed.py'
      - 'server/tests/test_guest_session_auth.py'
      - 'server/tests/test_guest_uploads.py'
      - 'server/tests/test_ops_metrics.py'
      - 'server/tests/test_ops_metrics_pg.py'
      - 'server/tests/test_postgres_authority_inventory_contract.py'
      - 'server/tests/test_postgres_container_wiring.py'
      - 'server/tests/test_version_restore.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-authority-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leaf_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leaf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/leaf_test
      PG_CUSTOMIZATION_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/leaf_test
      # The T1 overlay live suite SKIPS when this is unset. A review found
      # every one of its concurrency tests silently skipping in CI, so the
      # CAS and locking guarantees were unverified on the gate.
      OVERLAY_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/leaf_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            platform/requirements.txt
            da/requirements.txt

      - name: Install test dependencies
        run: >-
          python -m pip install
          -r server/requirements.txt
          -r platform/requirements.txt
          -r da/requirements.txt

      # FIRST, because every step below assumes a schema this image can serve.
      # Until this step existed, no CI job anywhere executed schema_status()
      # with an authority selector at postgres against a live database: the
      # test-gate workflow is deliberately hermetic (DATABASE_URL unset on
      # purpose) so run-all-gates' db_gated `platform` suite skips there, and
      # this workflow listed platform/db.py in `paths:` while every step ran a
      # named server/ test that never called schema_status(). Trigger coverage
      # is not step coverage: PR #187 went green on all three checks with a
      # committed db.py that returned ok=false on real PostgreSQL, which
      # assert_schema_current() raises on at startup.
      - name: Run platform authority schema_status gate
        working-directory: server
        run: >-
          python -m pytest --import-mode=importlib -q
          ../platform/tests/test_schema_status_postgres_authority.py

      - name: Run T1 overlay store PostgreSQL suite
        working-directory: platform
        run: |
          python -m pytest -q tests/test_overlay_store_static.py
          # -p no:randomly keeps the concurrency tests deterministic.
          python -m pytest -q tests/test_overlay_store_postgres.py

      - name: Assert the overlay live suite did NOT skip
        working-directory: platform
        run: |
          # A skipped concurrency suite reports green and proves nothing.
          # This is the check the review's finding actually needs.
          out=$(python -m pytest -q tests/test_overlay_store_postgres.py -rs)
          echo "$out" | tail -5
          if echo "$out" | grep -qi 'skipped'; then
            echo 'FAIL: overlay live tests skipped — OVERLAY_PG_URL not reaching pytest'
            exit 1
          fi

      - name: Run PostgreSQL authority and race tests
        working-directory: server
        run: python -m pytest -q tests/test_drawing_upload_authority_postgres.py

      - name: Run PostgreSQL live-DWG version restore proof
        working-directory: server
        run: >-
          python -m pytest -q tests/test_version_restore.py
          -k postgres_live_dwg_restore_preserves_blob_and_readable_cache

      - name: Run observability read-model PostgreSQL verifier
        working-directory: server
        run: python -m pytest -q tests/test_ops_metrics_pg.py

      - name: Run customization authority PostgreSQL tests
        working-directory: server
        run: |
          test -n "${PG_CUSTOMIZATION_TEST_URL:-}"
          mkdir -p "$RUNNER_TEMP/leaf-customization-pythonpath"
          ln -s "$GITHUB_WORKSPACE/scripts" \
            "$RUNNER_TEMP/leaf-customization-pythonpath/scripts"
          PYTHONPATH="$RUNNER_TEMP/leaf-customization-pythonpath" \
            python -m pytest -q \
            "$GITHUB_WORKSPACE/server/tests/test_customization_postgres_contract.py" \
            "$GITHUB_WORKSPACE/server/tests/test_customization_postgres_integration.py" \
            "$GITHUB_WORKSPACE/server/tests/test_customization_runtime.py"

      - name: Run upload and authored-mutation boundary tests
        working-directory: server
        run: >-
          python -m pytest -q
          tests/test_guest_uploads.py
          tests/test_guest_fail_closed.py
          tests/test_guest_session_auth.py
          tests/test_broker_boundary.py
          tests/test_postgres_container_wiring.py
          tests/test_deployment_source_identity.py
          tests/test_drawing_authority_cutover_marker.py

      - name: Run canonical drawing import gate tests
        working-directory: server
        run: >-
          python -m pytest --import-mode=importlib -q
          ../platform/tests/test_drawing_import.py
