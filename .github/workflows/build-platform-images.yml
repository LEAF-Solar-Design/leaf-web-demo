name: Build platform images

# ---------------------------------------------------------------------------
# Builds the five leaf-platform release images (app / broker / canonical-worker /
# harness / web) in parallel from ONE commit and pushes all five to ECR at ONE tag:
# prod-<shortsha>. Each image has its own registry-backed Buildx cache in a
# DEDICATED <image>-buildcache ECR repository -- never the release repository.
# ECR tags are immutable, so cache publication uses buildcache-<shortsha> and
# never overwrites a tag. A build imports its immediate predecessor's cache
# when that exact tag exists, else the nearest first-parent ancestor's tag
# still published: the cache keys are commit-stable below the per-commit
# ARGs (#458), so a few-commits-old cache still hits the heavy toolchain
# layers. Every cache lookup fails open to building without cache input.
#
# Cache retention contract: the AWS *-buildcache repositories must
# expire buildcache-* tags after 14 days or retain no more than the latest 20
# per repository (leaf-automation-aws-terraform, leaf_platform_buildcache.tf).
# The same bounded-retention contract covers spec-* tags in the release
# repositories (speculative PR builds, below).
# Production prod-* tags use a separate lifecycle and are never cache inputs
# or outputs. A staging supply-set manifest records all five immutable
# digests, the full source SHA, and the deterministic web artifact hash. A
# partial push can never produce a production handoff candidate.
#
# SPECULATIVE PR BUILDS (lane L5, operator decision D3, 2026-08-05): a PR
# update dispatches this workflow (speculate-platform-images.yml, --ref main,
# so main's workflow text runs under the main-ref OIDC subject) with
# speculative=true. That run builds all five images from the PR's MERGE
# PREVIEW -- the tree a clean squash-merge lands on main -- and pushes them
# under spec-<tree> tags, a namespace no deploy workflow accepts (the staging
# deploy validates tags against sha-*/prod-* only), then mints a
# spec-supply-set-<tree> artifact ONLY after all five digests verify present.
# The push-to-main run's `adopt` job then aliases prod-<shortsha> onto those
# digests when its gate-proven tree matches, skipping the whole build matrix;
# any anomaly degrades to the full build. Identity is the git TREE: an
# adopted image bakes the preview commit's LEAF_SOURCE_SHA, the supply-set
# manifest (schema v2) carries the merge commit plus the speculative
# provenance, and the deploy path never verifies live source_sha outside
# mode=build. See docs/SPECULATIVE-PR-BUILDS.md.
#
# Auto-build, MANUAL handoff: every push to main that touches a build input
# builds and pushes images. A docs-only push (all changed files under docs/
# or root-level *.md — the audited set outside every image build context)
# no-ops after `prepare`'s docs-noop decide step (folded from the former
# standalone `noop` gate job on 2026-08-05: the separate job cost ~8s of
# work plus ~12s of runner scheduling ahead of every real build, measured
# on run 30992431627) and publishes a docs-noop marker artifact
# so the staging relay skips cleanly instead of alarming on a missing
# supply set. The gate fails open: any uncertainty builds normally.
# promote=true now requires an accepted staging execution receipt and emits a
# digest-bound handoff artifact. This workflow never dispatches production.
#
# Auth, TWO OIDC roles: build, verify, and the speculative lane assume
# leaf-github-web-demo-ecr-push-role (AWS_ECR_PUSH_ROLE repo secret), limited
# to the five leaf-platform release ECR repositories plus their *-buildcache
# counterparts, no ECS, IAM, or secrets. The pre-gate warm job assumes ONLY
# leaf-github-web-demo-buildcache-push-role (AWS_ECR_BUILDCACHE_PUSH_ROLE repo
# secret), which can reach nothing but the five *-buildcache repositories --
# IAM, not convention, is what keeps warm's configured credential away from
# every tag the deploy rail consumes. Every release-role job additionally
# declares environment: ecr-release (a GitHub environment with a main-only
# deployment branch policy), so its OIDC sub presents the
# repo:...:environment:ecr-release form. warm never declares it: once the
# release role's trust drops the ref-based subject
# (leaf-automation-aws-terraform leaf_iam.tf, 2026-08-05 transition), a
# token minted inside warm cannot assume the release role at all -- that
# closes the same-subject residual both #453 and #451 reviews filed.
# (speculate pushes real spec-* images by
# design, so it genuinely needs the release role; that namespace is fenced
# from deploys as described above.)
# TERRAFORM_REPO_TOKEN (PAT with Actions read access to both repositories) is
# only needed for the optional promote step.
# ---------------------------------------------------------------------------

on:
  push:
    # NO native path filtering on this trigger, deliberately: GitHub
    # evaluates such filters over a truncated changed-file window (its own
    # docs cite a 300-file limit), so a large mixed push could hide a code
    # file past the window and silently skip a build that mattered. The
    # docs-only no-op decision lives in prepare's decide step below, where
    # every abnormal path fails OPEN to building.
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional exact main commit or exact head of an open draft PR targeting main. Defaults to the workflow ref."
        type: string
        required: false
      promote:
        description: "Create a production handoff from an accepted staging execution receipt. Does not deploy."
        type: boolean
        default: false
      staging_acceptance_workflow_run_id:
        description: "Required with promote: successful infra-repo staging acceptance workflow run ID."
        type: string
        required: false
      release_workflow_run_id:
        description: "Required with promote: successful build workflow run that published the five-service manifest."
        type: string
        required: false
      release_run_attempt:
        description: "Required with promote: exact successful attempt of the release workflow run."
        type: string
        required: false
      staging_acceptance_run_attempt:
        description: "Required with promote: exact successful attempt of the staging acceptance workflow run."
        type: string
        required: false
      staging_acceptance_artifact:
        description: "Required with promote: exact staging-authored-execute-*-run-<id>-attempt-<attempt> artifact name."
        type: string
        required: false
      speculative:
        description: "Build the merge preview of an open same-repository PR and push spec-<tree> images. Never tags a deployable name."
        type: boolean
        default: false
      speculative_pr_number:
        description: "Required with speculative: the open PR whose head is source_sha."
        type: string
        required: false
      force_rebuild_all:
        description: "Build and attest all five surfaces even when signed fingerprints are reusable."
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

# Dormant until the reviewed Terraform consumer lands. This is a source
# constant, not a repository variable, so no mutable setting can make a v3
# supply set live before the shared-lock consumer exists.
env:
  DIGEST_AWARE_CONVERGENCE_ENABLED: "false"
  SURFACE_PREDICATE_TYPE: https://leafdesign.ai/attestations/platform-surface/v1

concurrency:
  # Serial main builds make the previous push's cache the normal input. GitHub
  # can replace an older pending run, so a missing predecessor remains valid
  # and falls back to the nearest ancestor's cache, else an uncached build.
  #
  # Push runs are newest-wins too (merge-burst coalescing, 2026-08-06): the
  # staging relay is latest-main-only, so once a newer merge enters this
  # group the in-progress build's images can never dispatch. Letting it
  # finish anyway paid ~24 runner-minutes per superseded build, and the
  # winning run then queued HERE behind the doomed one (run 31059550767
  # waited 278s and started 1s after its predecessor completed; the first
  # organic burst wasted ~100 runner-minutes across runs 30979773615,
  # 31058884757, 31059053864, 31059285091). Cancelling creates no deploy
  # path: the relay dispatches only a run whose conclusion is success, and
  # manual promotion's verifier requires a completed successful release
  # run. It CAN leave inert residue behind: a run cancelled after its
  # verify/adopt leg uploaded the supply set leaves that artifact minted
  # (nothing consumes an artifact of a non-successful run), and a run
  # cancelled mid-matrix or mid-adopt leaves partial prod-*/adopt tags no
  # deploy rail accepts, plus a thinner buildcache chain the
  # nearest-ancestor fallback already covers.
  # Accepted residual: a push can cancel an in-progress NON-push run in
  # this group (promote, draft-PR build); both are rare, operator-attended,
  # and cheap to re-dispatch, which beats splitting the group they share.
  #
  # Speculative runs live in their own PER-PR group: they are dispatched on
  # the main ref, so without this split they would queue INSIDE the release
  # group ahead of real merge builds. Within one PR, newest-wins: a stale
  # preview's images can never be adopted (the tree moved), so cancelling the
  # older run only saves runners.
  group: build-platform-images-${{ inputs.speculative && format('speculative-pr-{0}', inputs.speculative_pr_number) || github.ref }}
  cancel-in-progress: ${{ inputs.speculative || github.event_name == 'push' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level permissions REPLACE the workflow-level set, so the two
    # workflow-level grants are restated. actions:read backs one step:
    # the warm-skip hint's gate-proof artifact listing. Read-only.
    permissions:
      contents: read
      pull-requests: read
      actions: read

    outputs:
      build: ${{ steps.decide.outputs.build }}
      tag: ${{ steps.tag.outputs.value }}
      cache_tag: ${{ steps.tag.outputs.cache_value }}
      previous_cache_tag: ${{ steps.tag.outputs.previous_cache_value }}
      source_sha: ${{ steps.source.outputs.sha }}
      source_mode: ${{ steps.source.outputs.mode }}
      workflow_blob: ${{ steps.source.outputs.workflow_blob }}
      source_tree: ${{ steps.tag.outputs.tree }}
      solver_revision: ${{ steps.solver.outputs.revision }}
      solver_source_sha256: ${{ steps.solver.outputs.source_sha256 }}
      gate_reuse_expected: ${{ steps.reuse-hint.outputs.expected }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      # Docs-only no-op gate, folded into prepare from the former
      # standalone `noop` job (2026-08-05; the separate job cost ~8s of
      # work plus ~12s of runner scheduling ahead of every real build).
      # Decides from the REAL push diff (local git, no truncated API
      # window) whether any changed file is a build input. Every
      # abnormal path — non-push event, unusable before-sha, unfetchable
      # before commit (force push), failed diff, unexpected script
      # output — lands on build=true; only a fully computed docs-only
      # diff may skip. On skip it publishes a docs-noop marker artifact
      # so the staging relay (dispatch-staging-deploys.yml) can tell a
      # deliberate no-op from a partial run that lost its supply set,
      # which must stay a loud failure. Every later step in this job and
      # the test / warm / adopt guards gate on build == 'true'; build
      # and verify follow through their result checks.
      #
      # Credential reconciliation with this job's checkout, explicitly:
      # the checkout persists NO credentials because later prepare steps
      # execute preview-authored scripts on speculative dispatches, while
      # this decide step needs a credentialed fetch of the push's
      # before-commit. Neither posture widens: the fetch carries its own
      # scoped, non-persisted auth header (the merge-preview fetch idiom
      # below), and this step executes NO checkout content on non-push
      # events — it exits at the event arm before python3 runs, so a
      # preview-authored tree never executes in this token-bearing step;
      # on push events the tree is main's own trusted commit. An auth
      # failure lands on the fail-open arm: the push builds, it never
      # silently skips.
      - name: Decide whether this push touched any build input
        id: decide
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build() {
            echo "::notice::docs-noop gate: building ($1)."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$EVENT_NAME" = "push" ] || build "event=$EVENT_NAME"
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || build "unusable before-sha"
          [[ "$BEFORE_SHA" =~ ^0{40}$ ]] && build "branch-creation push"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf '%s' "x-access-token:$GH_TOKEN" | base64 -w0)" \
            fetch --no-tags --depth=1 origin "$BEFORE_SHA" \
            || build "before-sha unfetchable"
          # --no-renames: detected renames report only their DESTINATION
          # path, so server/app.py -> docs/app.py would arrive here as
          # docs/app.py alone and skip a build that just lost an input.
          # Disabling detection surfaces both sides as delete+add; either
          # side that is a build input forces a build.
          FILES=$(git diff --no-renames --name-only "$BEFORE_SHA" "$GITHUB_SHA") \
            || build "diff failed"
          VERDICT=$(printf '%s\n' "$FILES" | python3 scripts/docs_noop_filter.py) \
            || VERDICT=build
          [ "$VERDICT" = "skip" ] || build "diff includes build inputs"
          echo "::notice::docs-noop gate: push touches documentation only; skipping the build and staging train."
          echo "build=false" >> "$GITHUB_OUTPUT"

      - name: Write the docs-noop marker for the staging relay
        if: steps.decide.outputs.build == 'false'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-noop"
          printf '{"schema":"leaf.docs-noop.v1","source_revision":"%s"}\n' \
            "$GITHUB_SHA" > "$RUNNER_TEMP/docs-noop/docs-noop.json"

      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.build == 'false'
        with:
          name: docs-noop-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-noop/docs-noop.json

      - name: Require exact source to be reviewed
        if: steps.decide.outputs.build == 'true'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_INPUT: ${{ inputs.promote }}
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
          SPECULATIVE_INPUT: ${{ inputs.speculative }}
          SPECULATIVE_PR_NUMBER: ${{ inputs.speculative_pr_number }}
          STAGING_ACCEPTANCE_RUN_ID: ${{ inputs.staging_acceptance_workflow_run_id }}
          STAGING_ACCEPTANCE_ARTIFACT: ${{ inputs.staging_acceptance_artifact }}
          RELEASE_WORKFLOW_RUN_ID: ${{ inputs.release_workflow_run_id }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
          STAGING_ACCEPTANCE_RUN_ATTEMPT: ${{ inputs.staging_acceptance_run_attempt }}
        run: |
          set -euo pipefail
          # Fail fast off refs/heads/main. The push trigger is main-only and
          # every automated dispatcher passes --ref main, so a non-main ref
          # can only be a manual or API dispatch. Without this check such a
          # run burns the whole gate and then dies at the ecr-release
          # environment's main-only deployment branch policy on the first
          # release-role job (sol-critic on PR #454, round 1).
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::build-platform-images may only run on refs/heads/main (got '$GITHUB_REF'); dispatch with --ref main. The ecr-release environment's main-only branch policy blocks every release-role job on any other ref."
            exit 1
          fi
          api_get() {
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/$1"
          }

          WORKFLOW_BLOB="$(api_get "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build-platform-images.yml?ref=$GITHUB_SHA" | jq -r '.sha // empty')"
          [[ "$WORKFLOW_BLOB" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::The provider could not bind this run to one immutable workflow blob."
            exit 1
          }
          echo "workflow_blob=$WORKFLOW_BLOB" >> "$GITHUB_OUTPUT"

          CURRENT_SHA=$(git rev-parse HEAD)
          SOURCE_MODE="main"
          if [[ ! "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checked-out source is not an exact commit."
            exit 1
          fi
          if [ -n "$SOURCE_SHA_INPUT" ]; then
            if [[ ! "$SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::source_sha must be a full 40-character lowercase hexadecimal commit."
              exit 1
            fi
            if [ "$CURRENT_SHA" != "$SOURCE_SHA_INPUT" ]; then
              echo "::error::Checkout did not resolve to source_sha."
              exit 1
            fi
          fi

          if [ "$SPECULATIVE_INPUT" = "true" ]; then
            if [ "$PROMOTE_INPUT" = "true" ]; then
              echo "::error::A speculative run can never promote."
              exit 1
            fi
            if [ -z "$SOURCE_SHA_INPUT" ]; then
              echo "::error::Speculative builds require the exact PR head as source_sha."
              exit 1
            fi
            if [[ ! "$SPECULATIVE_PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "::error::Speculative builds require the open PR number."
              exit 1
            fi
            PULL=$(api_get "repos/$GITHUB_REPOSITORY/pulls/$SPECULATIVE_PR_NUMBER")
            if ! jq -e --arg sha "$CURRENT_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .state == "open"
              and .base.ref == "main"
              and .head.repo.full_name == $repo
              and .head.repo.fork == false
              and (.head.sha | ascii_downcase) == $sha
            ' <<<"$PULL" >/dev/null; then
              echo "::error::Speculative source must be the exact current head of the open same-repository PR."
              exit 1
            fi
            # Build the MERGE PREVIEW, not the head: its tree is what a clean
            # squash-merge lands on main, so only that tree can ever be
            # adopted (operator decision D3). A conflicted or still-computing
            # preview has nothing worth building. The checkout deliberately
            # persisted no credentials (later prepare steps execute
            # preview-authored scripts), so this one fetch carries its own
            # scoped auth header and persists nothing.
            if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf '%s' "x-access-token:$GH_TOKEN" | base64 -w0)" \
              fetch --no-tags --depth=2 origin "refs/pull/$SPECULATIVE_PR_NUMBER/merge"; then
              echo "::error::The PR has no fetchable merge preview; nothing to speculate on."
              exit 1
            fi
            PREVIEW_SHA=$(git rev-parse FETCH_HEAD)
            # The preview must merge THIS dispatched head. If the PR moved
            # between dispatch and fetch, a newer speculative run owns it and
            # this one would silently build the wrong bytes.
            if [ "$(git rev-parse --verify --quiet "$PREVIEW_SHA^2" || true)" != "$CURRENT_SHA" ]; then
              echo "::error::The merge preview no longer merges the dispatched head; a newer speculative dispatch owns this PR."
              exit 1
            fi
            git checkout --quiet "$PREVIEW_SHA"
            echo "sha=$PREVIEW_SHA" >> "$GITHUB_OUTPUT"
            echo "mode=speculative" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=$(api_get "repos/$GITHUB_REPOSITORY/compare/$CURRENT_SHA...main")
          MERGE_BASE=$(jq -r '.merge_base_commit.sha // empty' <<<"$RESPONSE")
          STATUS=$(jq -r '.status // empty' <<<"$RESPONSE")
          if [ "${MERGE_BASE,,}" != "$CURRENT_SHA" ] || \
             { [ "$STATUS" != "ahead" ] && [ "$STATUS" != "identical" ]; }; then
            SOURCE_MODE="draft-pr"
            PULLS=$(api_get "repos/$GITHUB_REPOSITORY/commits/$CURRENT_SHA/pulls")
            if ! jq -e --arg sha "$CURRENT_SHA" --arg repo "$GITHUB_REPOSITORY" '
              any(.[];
                .state == "open"
                and .draft == true
                and .base.ref == "main"
                and .head.repo.full_name == $repo
                and .head.repo.fork == false
                and (.head.sha | ascii_downcase) == $sha
              )
            ' <<<"$PULLS" >/dev/null; then
              echo "::error::Build source must be on main or the exact head of an open same-repository draft PR targeting main."
              exit 1
            fi
          fi
          if [ "$PROMOTE_INPUT" = "true" ] && [ "$SOURCE_MODE" != "main" ]; then
            echo "::error::Only a source commit on main may request production promotion."
            exit 1
          fi
          if [ "$PROMOTE_INPUT" = "true" ]; then
            [ -n "$SOURCE_SHA_INPUT" ] || {
              echo "::error::Production handoff requires the exact release source_sha input."
              exit 1
            }
            [[ "$RELEASE_WORKFLOW_RUN_ID" =~ ^[1-9][0-9]{5,19}$ ]] || {
              echo "::error::Production handoff requires the successful release workflow run ID."
              exit 1
            }
            [[ "$STAGING_ACCEPTANCE_RUN_ID" =~ ^[1-9][0-9]{5,19}$ ]] || {
              echo "::error::Production handoff requires an exact staging acceptance workflow run ID."
              exit 1
            }
            [[ "$RELEASE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Production handoff requires the exact release run attempt."
              exit 1
            }
            [[ "$STAGING_ACCEPTANCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Production handoff requires the exact staging acceptance run attempt."
              exit 1
            }
            [[ "$STAGING_ACCEPTANCE_ARTIFACT" =~ ^staging-authored-execute-([a-z0-9][a-z0-9-]{5,49})-run-${STAGING_ACCEPTANCE_RUN_ID}-attempt-${STAGING_ACCEPTANCE_RUN_ATTEMPT}$ ]] || {
              echo "::error::Production handoff requires the exact attempt-specific staging execute artifact name."
              exit 1
            }
          fi
          echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          echo "mode=$SOURCE_MODE" >> "$GITHUB_OUTPUT"

      - name: Resolve canonical solver provenance
        id: solver
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          SOURCES=deploy/autofill-solver-sources.json
          jq -e 'type == "object" and length == 1' "$SOURCES" >/dev/null || {
            echo "::error::Automated release requires exactly one reviewed canonical solver source."
            exit 1
          }
          revision=$(jq -er 'keys[0] | select(test("^[0-9a-f]{40}$"))' "$SOURCES")
          source_sha256=$(jq -er --arg revision "$revision" \
            '.[$revision] | select(test("^[0-9a-f]{64}$"))' "$SOURCES")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$source_sha256" >> "$GITHUB_OUTPUT"

      - name: Validate image workflow invariants
        if: steps.decide.outputs.build == 'true'
        # The harness parses this workflow's YAML; the runner's system
        # python does not ship PyYAML, so install the harness deps first.
        run: |
          python -m pip install --quiet -r scripts/requirements-ci.txt
          python scripts/test_build_platform_images_workflow.py

      - name: Derive immutable image tag
        id: tag
        if: steps.decide.outputs.build == 'true'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_MODE: ${{ steps.source.outputs.mode }}
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          current_short="$(git rev-parse --short HEAD)"
          current_tree="$(git rev-parse 'HEAD^{tree}')"
          current_cache_tag="buildcache-$current_short"
          previous_cache_tag=""
          if [ "$SOURCE_MODE" = "speculative" ]; then
            # The tag is the tree PLUS the preview commit that bakes the
            # images: two previews can realize the same tree while baking
            # different LEAF_SOURCE_SHA values, so a tree-only tag would let
            # a later run claim provenance for images an earlier run built,
            # and a crashed run could leave a mixed-bake five-image set.
            # Deploys refuse the whole spec-* namespace either way (the
            # staging deploy validates tags against sha-*/prod-* only).
            current_spec_short="$(git rev-parse HEAD | cut -c1-12)"
            image_tag="spec-$current_tree-$current_spec_short"
            # Import the cache of the main tip the preview merged onto (its
            # first parent) and export nothing: speculative runs churn too
            # fast to be worth polluting the buildcache-* namespace.
            current_cache_tag=""
            previous_cache_tag="buildcache-$(git rev-parse --short 'HEAD^1')"
          elif [ "$SOURCE_MODE" = "draft-pr" ]; then
            image_tag="sha-$current_sha"
          else
            image_tag="prod-$current_short"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" \
            && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ \
            && ! "$BEFORE_SHA" =~ ^0+$ \
            && "$(git cat-file -t "$BEFORE_SHA" 2>/dev/null || true)" == "commit" ]]; then
            previous_short="$(git rev-parse --short "$BEFORE_SHA")"
            previous_cache_tag="buildcache-$previous_short"
          fi

          if [[ -n "$previous_cache_tag" \
            && "$previous_cache_tag" == "$current_cache_tag" ]]; then
            echo "::error::Current and previous cache tags must differ"
            exit 1
          fi

          echo "value=$image_tag" >> "$GITHUB_OUTPUT"
          echo "cache_value=$current_cache_tag" >> "$GITHUB_OUTPUT"
          echo "previous_cache_value=$previous_cache_tag" >> "$GITHUB_OUTPUT"
          echo "tree=$current_tree" >> "$GITHUB_OUTPUT"

      # Warm-skip hint. When a same-repo gate proof already names this exact
      # tree, the called gate's reuse probe is expected to skip the shards
      # (operator decision D3), the gate leg collapses to ~30s, and the build
      # job starts long before any warm leg could publish its cache: on the
      # first two reuse-path runs (30978164812, 30983842725) zero of nine
      # warm legs finished before build began — five runners burned per push
      # for nothing. The hint mirrors the probe's LISTING filters (exact
      # artifact name, un-expired, same-repo workflow_run provenance) but
      # deliberately not its download-and-verify, because both divergence
      # directions are benign: a false "expected" costs one full-gate run its
      # warm (build falls back to an older cache), a missed one costs
      # today's redundant warm. Skipping the GATE stays the sole business of
      # test-gate.yml's verified probe and fan-in re-verification; this
      # output feeds warm's per-leg chain-keeper decision and nothing else,
      # and the contract test pins exactly that.
      - name: Probe for an expected gate reuse (warm-skip hint)
        id: reuse-hint
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deliberately NOT errexit (set +e overrides the runner's `bash -e`
          # wrapper): every failure below must degrade to expected=false —
          # warm runs, the pre-hint behaviour — never redden the build.
          set -uo pipefail
          set +e
          expected="false"
          tree="$(git rev-parse 'HEAD^{tree}' 2>/dev/null)"
          if [[ "$tree" =~ ^[0-9a-f]{40}$ ]]; then
            repo_id="$(gh api "repos/$GITHUB_REPOSITORY" --jq .id 2>/dev/null)"
            listing="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=gate-proof-$tree&per_page=30" 2>/dev/null)"
            if [[ -n "$repo_id" && -n "$listing" ]]; then
              # Same-repo provenance comes from the artifact's workflow_run
              # metadata, exactly as in the gate's probe: a fork's
              # pull_request run can upload an artifact with any name. The
              # probe's per-candidate minting-workflow check is skipped here
              # on purpose — it costs one API call per candidate, and a
              # same-repo actor gaming a warm SKIP is outside the threat
              # model (they hold push and could edit this workflow).
              hits="$(jq -r --argjson repo_id "$repo_id" '
                [.artifacts[]
                 | select(.expired | not)
                 | select(.workflow_run.head_repository_id == $repo_id)]
                | length' <<<"$listing" 2>/dev/null)"
              if [[ "$hits" =~ ^[1-9][0-9]*$ ]]; then
                expected="true"
              fi
            fi
          fi
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          if [[ "$expected" == "true" ]]; then
            echo "::notice::a same-repo gate proof already names tree $tree; warm legs with a fresh cache chain exit early (the gate's own probe still verifies the proof before any shard skip)"
          else
            echo "::notice::no same-repo gate proof names tree ${tree:-<unknown>}; the warm job runs beside the gate"
          fi
          exit 0

  test:
    # An untested image must not reach ECR. Branch protection is unavailable
    # on this repository's GitHub plan (the branch-protection API answers 403),
    # so this workflow-internal dependency is what enforces that FOR THE BUILD
    # JOB: build cannot start until the full run-all-gates.py scoreboard is
    # green for the exact commit `prepare` resolved -- not merely for the
    # branch tip. It does not constrain the `warm` job, which is instead
    # boxed in by IAM: its role reaches only the *-buildcache repositories.
    needs: prepare
    # Speculative runs never gate here: the PR's own standalone Test gate run
    # is what mints the tree-bound proof, and spec-* images are unreachable
    # by any deploy until `adopt` sees that proof on the merge run. The
    # build check carries the docs-noop gate: prepare SUCCEEDS on a
    # docs-only push (it publishes the marker), so without it this job's
    # implicit success() would run the full gate on every docs push.
    if: ${{ !inputs.promote && !inputs.speculative && needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/test-gate.yml
    permissions:
      contents: read
      # actions:read flows to the called gate's reuse probe and fan-in so
      # they can read tree-bound gate-proof artifacts minted by earlier runs
      # (a called workflow's permissions are capped by this grant). Read-only.
      actions: read
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  # Layer-cache warmer. Runs BESIDE the test gate, not after it, and is
  # CONFIGURED to publish no image: push:false, no tags. All it publishes is
  # the buildcache-<sha> layer tag the real build then reuses, turning a cold
  # ~100s post-gate build into a cache hit.
  #
  # What enforces that is IAM, not this file: the job assumes
  # leaf-github-web-demo-buildcache-push-role, whose resource scope is the
  # five *-buildcache repositories and nothing else (ECR has no tag-level
  # IAM condition, so the boundary is repository-level; see
  # leaf-automation-aws-terraform's leaf_platform_buildcache.tf). A future
  # shell step here, or a compromised action running with this job's
  # credentials, still cannot write a repository the deploy rail reads.
  # The pinned no-publish configuration below remains drift detection, not
  # the boundary; see the limitation block in
  # scripts/test_build_platform_images_workflow.py.
  #
  # canonical-worker IS warmed since operator decision D1 (2026-08-05). Its
  # original exclusion was a deliberate security call: warming it hands the
  # private read-only solver deploy key to a job that exists purely as an
  # optimisation, and lets a gate-red commit's Dockerfile see the solver
  # source ~3 minutes earlier than the gated build would. The operator
  # weighed that against canonical-worker setting the post-gate wall time as
  # the only cold build and granted the key. The key stays step-scoped
  # exactly as in `build`: a fail-closed presence check plus the one exact
  # solver checkout, never an env of the whole job or a Docker argument.
  #
  # continue-on-error is deliberate: a warm failure must degrade to today's
  # behaviour (a cold build off the predecessor cache), never redden a run.
  #
  # CHAIN KEEPER (2026-08-05, the #456/#458 follow-up): warm always
  # schedules, and each leg decides IN-JOB whether to exit early — prepare
  # holds no AWS credential, so it cannot probe ECR for this decision. A
  # leg exits early only when prepare's reuse hint expects the gate verdict
  # to be reused (the gate leg is then ~30s, the build job starts before
  # any warm leg could publish, and warming cannot pay off) AND that
  # image's exact predecessor buildcache tag exists. The second clause is
  # what keeps the cache chain alive: on a fully adopted merge the build
  # matrix skips too, so a warm skipped on the hint alone left NOTHING
  # publishing a buildcache tag — the four adopted merges through run
  # 31006482947 published no tag, and every speculative build ran fully
  # cold (~99s). Steady state under green adoption: warm builds on roughly
  # every other merge; a skipping merge costs five short probe legs
  # (~2 runner-minutes). Every probe failure lands on skip=false — warm
  # runs, never starving the chain.
  warm:
    needs: prepare
    if: ${{ !inputs.promote && !inputs.speculative && needs.prepare.outputs.build == 'true' }}
    # In-AWS 8-vCPU CodeBuild runner: same-region ECR pushes remove the ~200s
    # cross-network blob-upload flake class (run 30975460947).
    #
    # This is the SECOND flip. The first (PR #643) was reverted the same day by
    # PR #648 because the CodeBuild fleet egresses through shared AWS NAT
    # addresses, so every anonymous base-image pull counted against Docker Hub's
    # per-IP limit and run 32032185875 died with 429 on every leg before it
    # built anything. What makes the re-flip safe is NOT the runner: it is
    # BASE_IMAGE_PREFIX below, which moves every base-image pull onto this
    # account's ECR pull-through cache so Docker Hub leaves the build path
    # entirely. Do not flip this line back on without that build-arg, and do not
    # remove that build-arg while this line names a CodeBuild runner.
    #
    # ROLLBACK is still this one line: `runs-on: ubuntu-latest`. The cache path
    # keeps working from a GitHub-hosted runner (the job authenticates to the
    # same registry it pushes to), so reverting the runner never requires
    # reverting the Dockerfiles.
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        image: [app, broker, canonical-worker, harness, web]

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 807034087062.dkr.ecr.us-east-1.amazonaws.com
      IMAGE_NAME: leaf-platform-${{ matrix.image }}
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
      CURRENT_CACHE_TAG: ${{ needs.prepare.outputs.cache_tag }}
      PREVIOUS_CACHE_TAG: ${{ needs.prepare.outputs.previous_cache_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          # Deep enough for the cache step's first-parent ancestor walk
          # (its --max-count is 15); nothing here reads further back.
          fetch-depth: 20
          persist-credentials: false

      - name: Configure AWS credentials (OIDC, buildcache-scoped role)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_BUILDCACHE_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GHA-WarmPlatform-${{ matrix.image }}-${{ github.run_id }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The chain-keeper decision, per leg: each image has its own cache
      # repository, so each leg probes its own chain. It runs before the
      # solver steps so a skipping canonical-worker leg never fetches the
      # deploy key — the same posture speculate's existence-skip holds.
      - name: Decide whether the cache chain needs this warm build
        id: chain
        env:
          GATE_REUSE_EXPECTED: ${{ needs.prepare.outputs.gate_reuse_expected }}
        run: |
          # Deliberately NOT errexit (set +e overrides the runner's `bash -e`
          # wrapper): every failure below must land on skip=false — warm
          # runs and republishes the chain; a redundant warm costs about a
          # runner-minute, while a false skip starves every later cache
          # consumer (warm, gated build, and speculative imports alike).
          set -uo pipefail
          set +e
          skip="false"
          if [[ "$GATE_REUSE_EXPECTED" == "true" && -n "$PREVIOUS_CACHE_TAG" ]]; then
            found="$(aws ecr batch-get-image \
              --repository-name "$IMAGE_NAME-buildcache" \
              --image-ids "imageTag=$PREVIOUS_CACHE_TAG" \
              --query 'length(images)' \
              --output text 2>/dev/null)"
            if [[ "$found" == "1" ]]; then
              skip="true"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [[ "$skip" == "true" ]]; then
            echo "::notice::$IMAGE_NAME: gate reuse is expected and the predecessor cache $PREVIOUS_CACHE_TAG exists; this warm leg exits early"
          else
            echo "::notice::$IMAGE_NAME: warming (gate reuse expected: ${GATE_REUSE_EXPECTED:-false}; predecessor cache tag: ${PREVIOUS_CACHE_TAG:-<none>})"
          fi
          exit 0

      - name: Require the read-only canonical solver deploy key
        if: matrix.image == 'canonical-worker' && steps.chain.outputs.skip != 'true'
        env:
          AUTOFILL_SOLVER_DEPLOY_KEY: ${{ secrets.AUTOFILL_SOLVER_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "$AUTOFILL_SOLVER_DEPLOY_KEY" ] || {
            echo "::error::AUTOFILL_SOLVER_DEPLOY_KEY is required for the private canonical solver checkout."
            exit 1
          }

      - name: Check out the exact canonical solver source
        if: matrix.image == 'canonical-worker' && steps.chain.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: LEAF-Solar-Design/autofill-solver
          ref: ${{ needs.prepare.outputs.solver_revision }}
          path: autofill-solver
          ssh-key: ${{ secrets.AUTOFILL_SOLVER_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Docker Buildx
        if: steps.chain.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Select immutable cache references
        id: cache
        if: steps.chain.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cache_repo="$ECR_REGISTRY/$IMAGE_NAME-buildcache"
          cache_from=""
          cache_to=""

          # THIS commit's cache first. The `warm` job builds the same tree in
          # parallel with the test gate and publishes exactly this tag, so by
          # the time the gate is green the layers already exist and this build
          # is a near-total cache hit rather than a cold rebuild. The fallback
          # keeps the previous behaviour whenever warm was skipped, failed, or
          # simply has not finished — it is never a hard dependency, so a warm
          # failure costs seconds, not a red build.
          current_warm="$(aws ecr batch-get-image \
            --repository-name "$IMAGE_NAME-buildcache" \
            --image-ids "imageTag=$CURRENT_CACHE_TAG" \
            --query 'length(images)' \
            --output text 2>/dev/null || true)"
          if [[ "$current_warm" == "1" ]]; then
            cache_from="type=registry,ref=$cache_repo:$CURRENT_CACHE_TAG"
            echo "::notice::$IMAGE_NAME reusing the warmed cache $CURRENT_CACHE_TAG"
          elif [[ -n "$PREVIOUS_CACHE_TAG" ]]; then
            found="$(aws ecr batch-get-image \
              --repository-name "$IMAGE_NAME-buildcache" \
              --image-ids "imageTag=$PREVIOUS_CACHE_TAG" \
              --query 'length(images)' \
              --output text 2>/dev/null || true)"
            if [[ "$found" == "1" ]]; then
              cache_from="type=registry,ref=$cache_repo:$PREVIOUS_CACHE_TAG"
            fi
          fi

          # Nearest-ancestor fallback (chain keeper, 2026-08-05): under the
          # adoption path a fully green merge run skips both cache writers,
          # so the exact predecessor tag can be several commits stale. The
          # cache keys are commit-stable below the per-commit ARGs (#458),
          # so a near-ancestor cache still hits the heavy toolchain layers.
          # Candidates come from the checkout's own first-parent history
          # (fetch-depth: 20 above exists for exactly this walk) and are
          # probed in ONE batch-get-image call — deliberately not an ECR
          # listing, which neither workflow role is granted
          # (leaf-automation-aws-terraform pins both to BatchGetImage plus
          # push actions). Every failure lands on the uncached build.
          if [[ -z "$cache_from" ]]; then
            ids=()
            for sha in $(git rev-list --first-parent --skip=1 --max-count=15 HEAD 2>/dev/null); do
              short="$(git rev-parse --short "$sha" 2>/dev/null)" || continue
              if [[ "buildcache-$short" == "${CURRENT_CACHE_TAG:-}" ]]; then
                continue
              fi
              ids+=("imageTag=buildcache-$short")
            done
            if [[ "${#ids[@]}" -gt 0 ]]; then
              found_tags="$(aws ecr batch-get-image \
                --repository-name "$IMAGE_NAME-buildcache" \
                --image-ids "${ids[@]}" \
                --query 'images[].imageId.imageTag' \
                --output text 2>/dev/null | tr '\t\n' '  ' || true)"
              for id in "${ids[@]}"; do
                tag="${id#imageTag=}"
                if [[ " $found_tags " == *" $tag "* ]]; then
                  cache_from="type=registry,ref=$cache_repo:$tag"
                  echo "::notice::$IMAGE_NAME importing the nearest ancestor cache $tag"
                  break
                fi
              done
            fi
            if [[ -z "$cache_from" ]]; then
              echo "::notice::$IMAGE_NAME has no predecessor cache; building without cache input"
            fi
          fi

          if current_exists="$(aws ecr batch-get-image \
              --repository-name "$IMAGE_NAME-buildcache" \
              --image-ids "imageTag=$CURRENT_CACHE_TAG" \
              --query 'length(images)' \
              --output text 2>/dev/null)"; then
            if [[ "$current_exists" == "1" ]]; then
              echo "::notice::$IMAGE_NAME cache $CURRENT_CACHE_TAG already exists; immutable tag will not be overwritten"
            else
              # ignore-error: the existence check above cannot exclude the
              # other writer of this immutable tag finishing in between (warm
              # and the gated build race by design, and ECR refuses the second
              # manifest with ImageTagAlreadyExistsException). Losing that race
              # must cost only the cache export, never the build.
              cache_to="type=registry,ref=$cache_repo:$CURRENT_CACHE_TAG,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
            fi
          else
            echo "::warning::Unable to verify $CURRENT_CACHE_TAG; skipping cache publication"
          fi

          echo "from=$cache_from" >> "$GITHUB_OUTPUT"
          echo "to=$cache_to" >> "$GITHUB_OUTPUT"

      - name: Warm the layer cache for ${{ matrix.image }}
        if: steps.chain.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          build-args: |
            LEAF_SOURCE_SHA=${{ needs.prepare.outputs.source_sha }}
            ${{ matrix.image == 'canonical-worker' && format('AUTOFILL_SOLVER_REVISION={0}', needs.prepare.outputs.solver_revision) || '' }}
          # Every upstream base resolves through this account's ECR pull-through
          # cache instead of Docker Hub. buildx named contexts override an image
          # reference WITHOUT editing the Dockerfile, which matters here: the
          # release-provenance contract
          # (scripts/platform_release_manifest.py::_dockerfile_contract) parses
          # the literal FROM tokens and asserts they equal the resolved
          # base-image set, so a templated `FROM ${...}python:3.12-slim` would
          # make the manifest record a name nothing can resolve. This keeps the
          # Dockerfiles, the manifest keys and the recorded digests unchanged
          # (the two registries serve byte-identical manifests) and changes only
          # where the bytes come from.
          #
          # All five are listed for every image so this block stays byte-identical
          # across warm/build/speculate, which the workflow validator requires;
          # named contexts an image does not reference are simply never resolved.
          # `node:20-slim` also covers Dockerfile.broker's `COPY --from=node:20-slim`,
          # which is a base-image pull that no FROM-only survey catches.
          build-contexts: |
            nginx:alpine=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/nginx:alpine
            node:20-slim=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/node:20-slim
            node:22-bookworm=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/node:22-bookworm
            node:22-slim=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/node:22-slim
            python:3.12-slim=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/python:3.12-slim
            ${{ matrix.image == 'canonical-worker' && 'autofill_solver=./autofill-solver' || '' }}
          push: false
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}

  build:
    # `adopt` joined the dependency list for ORDERING, not gating: when it
    # verified and aliased a speculative supply set for this exact tree the
    # whole matrix below is redundant and skips; on ANY other outcome —
    # adopt skipped (dispatch runs), absorbed failure, no artifact, foreign
    # digests — this full build runs exactly as before. The gate edge
    # (needs.test.result == 'success') remains the only thing that lets an
    # image reach ECR.
    needs: [prepare, test, adopt]
    # A FAILED adopt run is not a fall-through: it means tags were already
    # written (the pre-write path can only end skipped or successful), so
    # building would collide with the half-aliased release tag. Only a
    # skipped adopt (dispatch runs) or a successful adopt that declined
    # (adopted != true) lets the matrix run.
    if: >-
      ${{ !cancelled() && !inputs.promote && !inputs.speculative &&
          needs.prepare.result == 'success' &&
          needs.test.result == 'success' &&
          (needs.adopt.result == 'skipped' ||
           (needs.adopt.result == 'success' && needs.adopt.outputs.adopted != 'true')) }}
    # Re-flipped 2026-08-17 behind the ECR pull-through cache; see the `warm`
    # job's comment for why the first flip failed and what changed.
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 60
    # The ecr-release GitHub environment (main-only deployment branch
    # policy) is what qualifies this job's OIDC subject for the release
    # role's trust; warm deliberately never declares it.
    environment: ecr-release
    permissions:
      id-token: write
      contents: read
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        image: [app, broker, canonical-worker, harness, web]

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 807034087062.dkr.ecr.us-east-1.amazonaws.com
      IMAGE_NAME: leaf-platform-${{ matrix.image }}
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
      CURRENT_CACHE_TAG: ${{ needs.prepare.outputs.cache_tag }}
      PREVIOUS_CACHE_TAG: ${{ needs.prepare.outputs.previous_cache_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          # Deep enough for the cache step's first-parent ancestor walk
          # (its --max-count is 15); nothing here reads further back.
          fetch-depth: 20
          persist-credentials: false

      # `needs: test` guarantees a green gate ran in this workflow run; this
      # additionally requires that verdict to name THIS checkout's exact tree,
      # whichever path produced it (the full 8-shard run, or the tree-identity
      # reuse of a PR-green proof — operator decision D3, 2026-08-05). Fail
      # closed: an empty or foreign tree means no image is pushed.
      - name: Require the green gate verdict to bind to this exact tree
        env:
          PROVEN_TREE: ${{ needs.test.outputs.proven_tree }}
        run: |
          set -euo pipefail
          [[ "$PROVEN_TREE" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::The test gate reported no proven tree; refusing to push images."
            exit 1
          }
          built_tree="$(git rev-parse 'HEAD^{tree}')"
          if [ "$built_tree" != "$PROVEN_TREE" ]; then
            echo "::error::Gate verdict binds tree $PROVEN_TREE but this build checkout is tree $built_tree; refusing to push images."
            exit 1
          fi
          echo "gate verdict bound to tree $PROVEN_TREE == build tree"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GHA-BuildPlatform-${{ matrix.image }}-${{ github.run_id }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve one signed reusable surface
        id: surface
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOLVER_REVISION: ${{ needs.prepare.outputs.solver_revision }}
          SOLVER_SOURCE_SHA256: ${{ needs.prepare.outputs.solver_source_sha256 }}
          FORCE_REBUILD_ALL: ${{ inputs.force_rebuild_all }}
        run: |
          set -euo pipefail
          echo "reuse=false" >> "$GITHUB_OUTPUT"
          case "${{ matrix.image }}" in
            app) bases=(python:3.12-slim) ;;
            broker) bases=(node:20-slim python:3.12-slim) ;;
            canonical-worker) bases=(python:3.12-slim) ;;
            harness) bases=(node:22-bookworm node:22-slim) ;;
            web) bases=(nginx:alpine node:22-slim) ;;
            *) echo "::error::Unknown platform surface."; exit 1 ;;
          esac
          base_args=()
          for base in "${bases[@]}"; do
            # Resolved through this account's ECR pull-through cache, never
            # registry-1.docker.io: this step runs on the CodeBuild fleet's
            # shared NAT egress, where anonymous Docker Hub requests 429
            # (#658 cause 1 -- this exact line was the one code path #654's
            # build-contexts fix never covered). The cache serves the
            # byte-identical manifest, so the recorded digest and the
            # `--base-image name=digest` manifest key are unchanged; only
            # where the bytes come from moves.
            digest="$(docker buildx imagetools inspect \
              "$ECR_REGISTRY/public-ecr/docker/library/$base" \
              --format '{{json .Manifest}}' | jq -er '.digest')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Base image $base did not resolve to one immutable digest through the pull-through cache."
              exit 1
            }
            base_args+=(--base-image "$base=$digest")
          done
          build_args=()
          solver_args=()
          if [ "${{ matrix.image }}" = "canonical-worker" ]; then
            build_args+=(--build-arg "AUTOFILL_SOLVER_REVISION=$SOLVER_REVISION")
            solver_args+=(--solver-revision "$SOLVER_REVISION")
            solver_args+=(--solver-source-sha256 "$SOLVER_SOURCE_SHA256")
          fi
          buildkit_version="$(docker buildx version | head -n 1)"
          python scripts/platform_release_manifest.py surface-fingerprint \
            --repo-root . \
            --source-revision "$SOURCE_SHA" \
            --service "${{ matrix.image }}" \
            "${base_args[@]}" \
            "${build_args[@]}" \
            --buildkit-version "$buildkit_version" \
            --platform linux/amd64 \
            "${solver_args[@]}" \
            --output "$RUNNER_TEMP/surface-fingerprint.json"
          fingerprint="$(jq -er '.surface_fingerprint' "$RUNNER_TEMP/surface-fingerprint.json")"
          recipe="$(jq -er '.recipe_fingerprint' "$RUNNER_TEMP/surface-fingerprint.json")"
          lookup_tag="surface-v1-$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "recipe=$recipe" >> "$GITHUB_OUTPUT"
          echo "lookup_tag=$lookup_tag" >> "$GITHUB_OUTPUT"

          # Evidence identity is always produced. The selector below controls
          # only signed reuse discovery and never whether the release carries
          # a provider-bound v3 description of the images it actually chose.
          if [ "$DIGEST_AWARE_CONVERGENCE_ENABLED" != "true" ]; then
            echo "::notice::Digest-aware reuse remains dormant; continuing with a fresh build and strong evidence."
            exit 0
          fi
          if [ "${FORCE_REBUILD_ALL:-false}" = "true" ]; then
            echo "::notice::The requested security refresh forces a fresh build and attestation for every surface."
            exit 0
          fi

          if ! response="$(aws ecr batch-get-image \
              --repository-name "$IMAGE_NAME" \
              --image-ids "imageTag=$lookup_tag" \
              --output json)"; then
            echo "::notice::$IMAGE_NAME reuse discovery is unavailable; building this surface."
            exit 0
          fi
          count="$(jq '[.images[]?] | length' <<<"$response")"
          if [ "$count" = "0" ]; then
            echo "::notice::$IMAGE_NAME has no signed reusable surface for $fingerprint."
            exit 0
          fi
          [ "$count" = "1" ] || {
            echo "::error::$IMAGE_NAME:$lookup_tag did not resolve uniquely."
            exit 1
          }
          digest="$(jq -er '.images[0].imageId.imageDigest' <<<"$response")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Reusable surface returned a malformed image digest."
            exit 1
          }
          subject="$ECR_REGISTRY/$IMAGE_NAME"
          if ! gh attestation verify "oci://$subject@$digest" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type "$SURFACE_PREDICATE_TYPE" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-platform-images.yml" \
              --source-ref refs/heads/main \
              --format json > "$RUNNER_TEMP/surface-attestation.json"; then
            echo "::notice::$IMAGE_NAME has no verifiable signed surface proof; building this surface."
            exit 0
          fi
          if ! jq --arg service "${{ matrix.image }}" \
              --arg repository "$IMAGE_NAME" \
              --arg digest "$digest" \
              --arg fingerprint "$fingerprint" \
              --arg recipe "$recipe" '
            [.[] | .verificationResult.statement.predicate
             | select(.schema == "leaf.platform-surface-provenance.v1")
             | select(.service == $service)
             | select(.repository == $repository)
             | select(.image_digest == $digest)
             | select(.surface_fingerprint == $fingerprint)
             | select(.recipe_fingerprint == $recipe)]
            | if length == 1 then .[0] else error("no unique exact surface predicate") end
          ' "$RUNNER_TEMP/surface-attestation.json" > "$RUNNER_TEMP/surface-predicate.json"; then
            echo "::notice::$IMAGE_NAME signed proof does not bind this exact surface; building it."
            exit 0
          fi
          if ! python scripts/platform_release_manifest.py verify-surface-predicate \
              --predicate "$RUNNER_TEMP/surface-predicate.json" \
              --output "$RUNNER_TEMP/verified-surface-predicate.json"; then
            echo "::notice::$IMAGE_NAME signed proof has malformed or extra evidence; building it."
            exit 0
          fi
          mv "$RUNNER_TEMP/verified-surface-predicate.json" "$RUNNER_TEMP/surface-predicate.json"
          if ! producer="$(jq -er '.producer_source_revision' "$RUNNER_TEMP/surface-predicate.json")"; then
            echo "::notice::$IMAGE_NAME signed proof has no exact producer source; building it."
            exit 0
          fi
          [[ "$producer" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::notice::$IMAGE_NAME signed producer source is malformed; building it."
            exit 0
          }
          if ! relation="$(gh api \
              "repos/$GITHUB_REPOSITORY/compare/$producer...$SOURCE_SHA" \
              --jq '.status')"; then
            echo "::notice::$IMAGE_NAME signed producer ancestry is unavailable; building it."
            exit 0
          fi
          if [ "$relation" != "ahead" ] && [ "$relation" != "identical" ]; then
            echo "::notice::$IMAGE_NAME signed producer is not an ancestor of this protected main release; building it."
            exit 0
          fi
          if ! git cat-file -e "$producer^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags --depth=1 origin "$producer"; then
              echo "::notice::$IMAGE_NAME signed producer object is unavailable; building it."
              exit 0
            fi
          fi
          producer_tree="$(jq -er '.producer_source_tree' "$RUNNER_TEMP/surface-predicate.json")"
          workflow_blob="$(jq -er '.producer_workflow_blob' "$RUNNER_TEMP/surface-predicate.json")"
          exact_tree="$(git rev-parse "$producer^{tree}")"
          exact_workflow_blob="$(git rev-parse "$producer:.github/workflows/build-platform-images.yml")"
          if [ "$producer_tree" != "$exact_tree" ] || [ "$workflow_blob" != "$exact_workflow_blob" ]; then
            echo "::notice::$IMAGE_NAME signed producer tree or workflow blob is stale; building it."
            exit 0
          fi
          if ! witness="$(aws ecr batch-get-image \
              --repository-name "$IMAGE_NAME" \
              --image-ids "imageTag=sha-$producer" \
              --query 'images[0].imageId.imageDigest' \
              --output text)"; then
            echo "::notice::$IMAGE_NAME baked-source witness is unavailable; building this surface."
            exit 0
          fi
          [ "$witness" = "$digest" ] || {
            echo "::error::Reusable surface baked-source witness does not resolve to its attested digest."
            exit 1
          }
          producer_run_id="$(jq -er '.producer_run_id' "$RUNNER_TEMP/surface-predicate.json")"
          producer_run_attempt="$(jq -er '.producer_run_attempt' "$RUNNER_TEMP/surface-predicate.json")"
          if [ "${{ matrix.image }}" = "web" ]; then
            expected_web_hash="$(jq -er '.artifact_sha256' "$RUNNER_TEMP/surface-predicate.json")"
            rm -rf "$RUNNER_TEMP/reused-web-dist"
            if ! gh run download "$producer_run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "web-dist-$producer-attempt-$producer_run_attempt" \
                --dir "$RUNNER_TEMP/reused-web-dist"; then
              echo "::notice::The signed web artifact is unavailable; building web."
              exit 0
            fi
            actual_web_hash="$(python scripts/platform_release_manifest.py \
              digest-web-dist --root "$RUNNER_TEMP/reused-web-dist")"
            [ "$actual_web_hash" = "$expected_web_hash" ] || {
              echo "::error::Reusable web artifact does not match its signed hash."
              exit 1
            }
          fi
          predicate_hash="$(jq -cS . "$RUNNER_TEMP/surface-predicate.json" | sha256sum | awk '{print $1}')"
          echo "reuse=true" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "producer=$producer" >> "$GITHUB_OUTPUT"
          echo "producer_tree=$producer_tree" >> "$GITHUB_OUTPUT"
          echo "workflow_blob=$workflow_blob" >> "$GITHUB_OUTPUT"
          echo "producer_run_id=$producer_run_id" >> "$GITHUB_OUTPUT"
          echo "producer_run_attempt=$producer_run_attempt" >> "$GITHUB_OUTPUT"
          echo "provenance_digest=sha256:$predicate_hash" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$(jq -er '.artifact_sha256 // "not_web"' "$RUNNER_TEMP/surface-predicate.json")" >> "$GITHUB_OUTPUT"
          echo "::notice::$IMAGE_NAME will reuse signed digest $digest from protected-main producer $producer."

      # A cancelled five-way matrix can leave a complete immutable output for
      # some images and no output for others. Resume only at that image
      # boundary. The finite BatchGetImage probe preserves the release role's
      # least-privilege contract: it does not list the repository. A complete
      # set is trusted only because sha-*/prod-* are protected full-build
      # namespaces and the recovery cleanup removed the known foreign spec-*
      # witness before this run. Any mixed state fails before a write rather
      # than asking Buildx to collide with an immutable tag.
      - name: Inspect exact full-build outputs
        id: resume
        if: steps.surface.outputs.reuse != 'true'
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOLVER_REVISION: ${{ needs.prepare.outputs.solver_revision }}
        run: |
          set -euo pipefail
          required_tags=("$IMAGE_TAG")
          add_required_tag() {
            local candidate="$1"
            local existing
            for existing in "${required_tags[@]}"; do
              [ "$existing" = "$candidate" ] && return 0
            done
            required_tags+=("$candidate")
          }
          add_required_tag "sha-$SOURCE_SHA"
          if [ "${{ matrix.image }}" = "canonical-worker" ]; then
            add_required_tag "sha-$SOURCE_SHA-solver-$SOLVER_REVISION"
          fi
          if [ "${{ matrix.image }}" = "app" ] && [[ "$IMAGE_TAG" == prod-* ]]; then
            add_required_tag "src-$SOURCE_SHA"
          fi

          image_ids=()
          for tag in "${required_tags[@]}"; do
            image_ids+=("imageTag=$tag")
          done
          response="$(aws ecr batch-get-image \
            --repository-name "$IMAGE_NAME" \
            --image-ids "${image_ids[@]}" \
            --output json)" || {
              echo "::error::Could not inspect the exact immutable output tags for $IMAGE_NAME."
              exit 1
            }

          unexpected_failures="$(jq '[.failures[]? | select(.failureCode != "ImageNotFound")] | length' <<<"$response")"
          if [ "$unexpected_failures" != "0" ]; then
            echo "::error::The exact-tag probe returned a failure other than ImageNotFound for $IMAGE_NAME."
            jq -c '.failures' <<<"$response"
            exit 1
          fi

          present=0
          digests=()
          for tag in "${required_tags[@]}"; do
            matches="$(jq --arg tag "$tag" '[.images[]? | select(.imageId.imageTag == $tag)] | length' <<<"$response")"
            if [ "$matches" = "0" ]; then
              continue
            fi
            if [ "$matches" != "1" ]; then
              echo "::error::Exact output tag $IMAGE_NAME:$tag returned $matches image records."
              exit 1
            fi
            digest="$(jq -r --arg tag "$tag" '.images[] | select(.imageId.imageTag == $tag) | .imageId.imageDigest' <<<"$response")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Exact output tag $IMAGE_NAME:$tag returned a malformed digest."
              exit 1
            }
            present=$((present + 1))
            digests+=("$digest")
          done

          if [ "$present" = "0" ]; then
            echo "::notice::$IMAGE_NAME has no exact full-build outputs; building normally."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$present" != "${#required_tags[@]}" ]; then
            echo "::error::$IMAGE_NAME has only $present of ${#required_tags[@]} exact full-build output tags; refusing an immutable partial overwrite."
            exit 1
          fi
          unique_digests="$(printf '%s\n' "${digests[@]}" | sort -u | wc -l | tr -d ' ')"
          if [ "$unique_digests" != "1" ]; then
            echo "::error::$IMAGE_NAME exact full-build output tags resolve to different digests; refusing to continue."
            exit 1
          fi
          echo "::notice::$IMAGE_NAME already has the complete exact output set at ${digests[0]}; skipping its build."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Require the read-only canonical solver deploy key
        if: matrix.image == 'canonical-worker' && steps.surface.outputs.reuse != 'true' && steps.resume.outputs.skip != 'true'
        env:
          AUTOFILL_SOLVER_DEPLOY_KEY: ${{ secrets.AUTOFILL_SOLVER_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "$AUTOFILL_SOLVER_DEPLOY_KEY" ] || {
            echo "::error::AUTOFILL_SOLVER_DEPLOY_KEY is required for the private canonical solver checkout."
            exit 1
          }

      - name: Check out the exact canonical solver source
        if: matrix.image == 'canonical-worker' && steps.surface.outputs.reuse != 'true' && steps.resume.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: LEAF-Solar-Design/autofill-solver
          ref: ${{ needs.prepare.outputs.solver_revision }}
          path: autofill-solver
          ssh-key: ${{ secrets.AUTOFILL_SOLVER_DEPLOY_KEY }}
          persist-credentials: false

      - name: Select immutable cache references
        id: cache
        if: steps.surface.outputs.reuse != 'true' && steps.resume.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cache_repo="$ECR_REGISTRY/$IMAGE_NAME-buildcache"
          cache_from=""
          cache_to=""

          # THIS commit's cache first. The `warm` job builds the same tree in
          # parallel with the test gate and publishes exactly this tag, so by
          # the time the gate is green the layers already exist and this build
          # is a near-total cache hit rather than a cold rebuild. The fallback
          # keeps the previous behaviour whenever warm was skipped, failed, or
          # simply has not finished — it is never a hard dependency, so a warm
          # failure costs seconds, not a red build.
          current_warm="$(aws ecr batch-get-image \
            --repository-name "$IMAGE_NAME-buildcache" \
            --image-ids "imageTag=$CURRENT_CACHE_TAG" \
            --query 'length(images)' \
            --output text 2>/dev/null || true)"
          if [[ "$current_warm" == "1" ]]; then
            cache_from="type=registry,ref=$cache_repo:$CURRENT_CACHE_TAG"
            echo "::notice::$IMAGE_NAME reusing the warmed cache $CURRENT_CACHE_TAG"
          elif [[ -n "$PREVIOUS_CACHE_TAG" ]]; then
            found="$(aws ecr batch-get-image \
              --repository-name "$IMAGE_NAME-buildcache" \
              --image-ids "imageTag=$PREVIOUS_CACHE_TAG" \
              --query 'length(images)' \
              --output text 2>/dev/null || true)"
            if [[ "$found" == "1" ]]; then
              cache_from="type=registry,ref=$cache_repo:$PREVIOUS_CACHE_TAG"
            fi
          fi

          # Nearest-ancestor fallback (chain keeper, 2026-08-05): under the
          # adoption path a fully green merge run skips both cache writers,
          # so the exact predecessor tag can be several commits stale. The
          # cache keys are commit-stable below the per-commit ARGs (#458),
          # so a near-ancestor cache still hits the heavy toolchain layers.
          # Candidates come from the checkout's own first-parent history
          # (fetch-depth: 20 above exists for exactly this walk) and are
          # probed in ONE batch-get-image call — deliberately not an ECR
          # listing, which neither workflow role is granted
          # (leaf-automation-aws-terraform pins both to BatchGetImage plus
          # push actions). Every failure lands on the uncached build.
          if [[ -z "$cache_from" ]]; then
            ids=()
            for sha in $(git rev-list --first-parent --skip=1 --max-count=15 HEAD 2>/dev/null); do
              short="$(git rev-parse --short "$sha" 2>/dev/null)" || continue
              if [[ "buildcache-$short" == "${CURRENT_CACHE_TAG:-}" ]]; then
                continue
              fi
              ids+=("imageTag=buildcache-$short")
            done
            if [[ "${#ids[@]}" -gt 0 ]]; then
              found_tags="$(aws ecr batch-get-image \
                --repository-name "$IMAGE_NAME-buildcache" \
                --image-ids "${ids[@]}" \
                --query 'images[].imageId.imageTag' \
                --output text 2>/dev/null | tr '\t\n' '  ' || true)"
              for id in "${ids[@]}"; do
                tag="${id#imageTag=}"
                if [[ " $found_tags " == *" $tag "* ]]; then
                  cache_from="type=registry,ref=$cache_repo:$tag"
                  echo "::notice::$IMAGE_NAME importing the nearest ancestor cache $tag"
                  break
                fi
              done
            fi
            if [[ -z "$cache_from" ]]; then
              echo "::notice::$IMAGE_NAME has no predecessor cache; building without cache input"
            fi
          fi

          if current_exists="$(aws ecr batch-get-image \
              --repository-name "$IMAGE_NAME-buildcache" \
              --image-ids "imageTag=$CURRENT_CACHE_TAG" \
              --query 'length(images)' \
              --output text 2>/dev/null)"; then
            if [[ "$current_exists" == "1" ]]; then
              echo "::notice::$IMAGE_NAME cache $CURRENT_CACHE_TAG already exists; immutable tag will not be overwritten"
            else
              # ignore-error: the existence check above cannot exclude the
              # other writer of this immutable tag finishing in between (warm
              # and the gated build race by design, and ECR refuses the second
              # manifest with ImageTagAlreadyExistsException). Losing that race
              # must cost only the cache export, never the build.
              cache_to="type=registry,ref=$cache_repo:$CURRENT_CACHE_TAG,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
            fi
          else
            echo "::warning::Unable to verify $CURRENT_CACHE_TAG; skipping cache publication"
          fi

          echo "from=$cache_from" >> "$GITHUB_OUTPUT"
          echo "to=$cache_to" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        id: build-image
        if: steps.surface.outputs.reuse != 'true' && steps.resume.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          build-args: |
            LEAF_SOURCE_SHA=${{ needs.prepare.outputs.source_sha }}
            ${{ matrix.image == 'canonical-worker' && format('AUTOFILL_SOLVER_REVISION={0}', needs.prepare.outputs.solver_revision) || '' }}
          # Every upstream base resolves through this account's ECR pull-through
          # cache instead of Docker Hub. buildx named contexts override an image
          # reference WITHOUT editing the Dockerfile, which matters here: the
          # release-provenance contract
          # (scripts/platform_release_manifest.py::_dockerfile_contract) parses
          # the literal FROM tokens and asserts they equal the resolved
          # base-image set, so a templated `FROM ${...}python:3.12-slim` would
          # make the manifest record a name nothing can resolve. This keeps the
          # Dockerfiles, the manifest keys and the recorded digests unchanged
          # (the two registries serve byte-identical manifests) and changes only
          # where the bytes come from.
          #
          # All five are listed for every image so this block stays byte-identical
          # across warm/build/speculate, which the workflow validator requires;
          # named contexts an image does not reference are simply never resolved.
          # `node:20-slim` also covers Dockerfile.broker's `COPY --from=node:20-slim`,
          # which is a base-image pull that no FROM-only survey catches.
          build-contexts: |
            nginx:alpine=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/nginx:alpine
            node:20-slim=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/node:20-slim
            node:22-bookworm=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/node:22-bookworm
            node:22-slim=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/node:22-slim
            python:3.12-slim=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/python:3.12-slim
            ${{ matrix.image == 'canonical-worker' && 'autofill_solver=./autofill-solver' || '' }}
          # zstd prototype, app leg only: Fargate pays a full image pull on
          # every task launch (four per staging deploy), and zstd layers
          # decompress markedly faster than gzip. The `outputs` line replaces
          # `push: true` for the app leg because buildx refuses --push
          # alongside an explicit image output; both forms push. The digest
          # downstream steps sign and record (steps.build-image.outputs.digest)
          # IS the zstd manifest's digest — provenance, the supply set, and
          # speculative adoption all mint from this one build, never a
          # re-push, so compression cannot fork the identity chain.
          push: ${{ matrix.image != 'app' }}
          outputs: ${{ matrix.image == 'app' && 'type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true' || '' }}
          # Every full-build image carries sha-<full-commit>, the baked
          # identity witness required by blue/green deployment. The app image
          # of a release (prod-*) build additionally carries
          # src-<full-commit>: a CI build-identity stamp consumed only by
          # the staging migration source diff (its fast path recovers the
          # exact candidate commit from the prod tag's digest). It is never
          # a release or review tag — every deploy rail and production
          # review gate stays sha-/prod- only — and the spec-* and
          # draft-pr sha-* namespaces stay single-tagged.
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.prepare.outputs.source_sha }}
            ${{ matrix.image == 'canonical-worker' && format('{0}/{1}:sha-{2}-solver-{3}', env.ECR_REGISTRY, env.IMAGE_NAME, needs.prepare.outputs.source_sha, needs.prepare.outputs.solver_revision) || '' }}
            ${{ matrix.image == 'app' && startsWith(env.IMAGE_TAG, 'prod-') && format('{0}/{1}:src-{2}', env.ECR_REGISTRY, env.IMAGE_NAME, needs.prepare.outputs.source_sha) || '' }}
            ${{ env.DIGEST_AWARE_CONVERGENCE_ENABLED == 'true' && format('{0}/{1}:surface-v1-{2}', env.ECR_REGISTRY, env.IMAGE_NAME, steps.surface.outputs.fingerprint) || '' }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}

      - name: Set up Node for the signed web artifact
        if: matrix.image == 'web' && steps.surface.outputs.reuse != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Hash the signed web deployment artifact
        id: surface-web
        if: matrix.image == 'web' && steps.surface.outputs.reuse != 'true'
        working-directory: web
        env:
          VITE_API_BASE: ""
          VITE_MOCK: "0"
          VITE_AUTH0_DOMAIN: leafautomation.us.auth0.com
          VITE_AUTH0_CLIENT_ID: zkJjr0ZFtcyQjyJ8e4zdkdgzoMaVWt5O
          VITE_AUTH0_AUDIENCE: https://api.leafdesign.ai
          LEAF_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          printf '{"ok":true,"service":"leaf-platform-web","component":"frontend","source_sha":"%s"}\n' \
            "$LEAF_SOURCE_SHA" > dist/health.json
          artifact_sha256="$(python ../scripts/platform_release_manifest.py \
            digest-web-dist --root dist)"
          echo "sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"

      - name: Preserve the exact v3 web deployment artifact
        if: matrix.image == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: surface-web-dist-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.surface.outputs.reuse == 'true' && format('{0}/reused-web-dist', runner.temp) || 'web/dist' }}
          if-no-files-found: error
          retention-days: 30

      - name: Create exact surface provenance predicate
        if: steps.surface.outputs.reuse != 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          WEB_ARTIFACT_SHA256: ${{ steps.surface-web.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Buildx did not return one immutable component digest."
            exit 1
          }
          artifact_args=()
          if [ "${{ matrix.image }}" = "web" ]; then
            artifact_args+=(--artifact-sha256 "$WEB_ARTIFACT_SHA256")
          fi
          python scripts/platform_release_manifest.py surface-predicate \
            --fingerprint "$RUNNER_TEMP/surface-fingerprint.json" \
            --repository "$IMAGE_NAME" \
            --image-digest "$IMAGE_DIGEST" \
            --source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --workflow-blob "$(git rev-parse 'HEAD:.github/workflows/build-platform-images.yml')" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            "${artifact_args[@]}" \
            --output "$RUNNER_TEMP/surface-predicate.json"

      - name: Sign exact surface provenance
        if: env.DIGEST_AWARE_CONVERGENCE_ENABLED == 'true' && steps.surface.outputs.reuse != 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          predicate-type: ${{ env.SURFACE_PREDICATE_TYPE }}
          predicate-path: ${{ runner.temp }}/surface-predicate.json
          push-to-registry: true

      - name: Materialize one exact v3 service entry
        env:
          BUILT_DIGEST: ${{ steps.build-image.outputs.digest }}
          REUSED_DIGEST: ${{ steps.surface.outputs.digest }}
          REUSED: ${{ steps.surface.outputs.reuse }}
          LOOKUP_TAG: ${{ steps.surface.outputs.lookup_tag }}
        run: |
          set -euo pipefail
          if [ "$REUSED" = "true" ]; then
            digest="$REUSED_DIGEST"
            disposition=reused
          else
            digest="$BUILT_DIGEST"
            disposition=built
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::The v3 surface result has no immutable image digest."
            exit 1
          }
          predicate_hash="$(jq -cS . "$RUNNER_TEMP/surface-predicate.json" | sha256sum | awk '{print $1}')"
          jq --arg disposition "$disposition" \
             --arg lookup_tag "$LOOKUP_TAG" \
             --arg subject "$ECR_REGISTRY/$IMAGE_NAME" \
             --arg provenance_digest "sha256:$predicate_hash" '
            {
              repository,
              image_digest,
              immutable_lookup_tag: $lookup_tag,
              producer_source_revision,
              producer_source_tree,
              surface_fingerprint,
              recipe_fingerprint,
              producer_workflow_path,
              producer_workflow_blob,
              producer_run_id,
              producer_run_attempt,
              provenance_subject: $subject,
              provenance_digest: $provenance_digest,
              build_disposition: $disposition
            }
            + (if .service == "canonical-worker" then {solver_provenance} else {} end)
            + (if .service == "web" then {artifact_sha256} else {} end)
          ' "$RUNNER_TEMP/surface-predicate.json" > "$RUNNER_TEMP/service-entry.json"

      - name: Upload exact v3 service entry
        uses: actions/upload-artifact@v4
        with:
          name: surface-result-${{ matrix.image }}-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/service-entry.json
          if-no-files-found: error
          retention-days: 30

  verify:
    # The full-build path fans five matrix-owned v3 entries into one strict
    # provider-bound supply set. The selector-gated speculative adoption path
    # owns its existing supply artifact inside adopt. Build and adopt remain
    # mutually exclusive, so this job never rewrites an adopted artifact.
    needs: [prepare, adopt, build]
    if: >-
      ${{ !cancelled() && !inputs.promote && !inputs.speculative &&
          needs.prepare.result == 'success' &&
          needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ecr-release
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 807034087062.dkr.ecr.us-east-1.amazonaws.com
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Download exact v3 service entries
        uses: actions/download-artifact@v4
        with:
          pattern: surface-result-*-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/surface-results

      - name: Download exact v3 web deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: surface-web-dist-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: web/dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GHA-VerifyPlatformImages-${{ github.run_id }}

      - name: Login to ECR for immutable digest verification
        uses: aws-actions/amazon-ecr-login@v2

      - name: Write the immutable five-service staging supply set
        run: |
          set -euo pipefail
          declare -A entries
          for image in app broker canonical-worker harness web; do
            mapfile -t matches < <(find "$RUNNER_TEMP/surface-results" -type f \
              -path "*/surface-result-$image-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}/service-entry.json" \
              -print)
            if [ "${#matches[@]}" != "1" ]; then
              echo "::error::Expected one exact v3 service entry for $image, found ${#matches[@]}."
              exit 1
            fi
            entries["$image"]="${matches[0]}"
            digest="$(jq -er '.image_digest' "${matches[0]}")"
            repository="$(jq -er '.repository' "${matches[0]}")"
            [ "$repository" = "leaf-platform-$image" ] || {
              echo "::error::V3 service entry for $image names $repository."
              exit 1
            }
            # BEGIN V3_DIGEST_EXISTENCE_PROBE
            # BatchGetImage filters unsupported manifest-list media types, and
            # the release role deliberately has no listing permission. Probe
            # the authenticated registry by the exact immutable digest. This
            # reads only the manifest or index and never pulls image layers.
            if ! docker buildx imagetools inspect --raw \
              "$ECR_REGISTRY/$repository@$digest" >/dev/null; then
              echo "::error::V3 service entry for $image is absent from ECR."
              exit 1
            fi
            # END V3_DIGEST_EXISTENCE_PROBE
          done
          python scripts/platform_release_manifest.py generate-v3 \
            --release-source-revision "${{ needs.prepare.outputs.source_sha }}" \
            --release-source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --build-run-id "$GITHUB_RUN_ID" \
            --build-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --service-entry "app=${entries[app]}" \
            --service-entry "broker=${entries[broker]}" \
            --service-entry "canonical-worker=${entries[canonical-worker]}" \
            --service-entry "harness=${entries[harness]}" \
            --service-entry "web=${entries[web]}" \
            --output "$RUNNER_TEMP/staging-supply-set.json"
          {
            echo "## Provider-bound five-service staging supply set verified"
            echo ""
            echo "Release source: \`${{ needs.prepare.outputs.source_sha }}\`"
            for image in app broker canonical-worker harness web; do
              disposition="$(jq -er '.build_disposition' "${entries[$image]}")"
              digest="$(jq -er '.image_digest' "${entries[$image]}")"
              producer="$(jq -er '.producer_source_revision' "${entries[$image]}")"
              echo "- \`leaf-platform-$image@$digest\`: $disposition from \`$producer\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable staging supply-set manifest
        uses: actions/upload-artifact@v4
        with:
          name: staging-supply-set-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-supply-set.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload deterministic web deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: web/dist
          if-no-files-found: error
          retention-days: 30

  # Speculative image builds (operator decision D3). Dispatched per PR update
  # by speculate-platform-images.yml on the MAIN ref, so this text and the
  # main-branch OIDC subject are what run — a PR cannot edit its own
  # speculative build. Builds the merge preview `prepare` checked out and
  # pushes each image under the non-deployable spec-<tree> tag. A tree that
  # is already pushed (rerun, sibling PR with identical bytes) skips its
  # build: the tag is immutable and the content is the same by construction.
  speculate:
    needs: prepare
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.speculative }}
    # Re-flipped 2026-08-17 behind the ECR pull-through cache; see the `warm`
    # job's comment for why the first flip failed and what changed.
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 45
    environment: ecr-release
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        image: [app, broker, canonical-worker, harness, web]

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 807034087062.dkr.ecr.us-east-1.amazonaws.com
      IMAGE_NAME: leaf-platform-${{ matrix.image }}
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS_CACHE_TAG: ${{ needs.prepare.outputs.previous_cache_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.speculative_pr_number }}/merge
          # Deep enough for the cache step's first-parent ancestor walk
          # (its --max-count is 15); nothing here reads further back.
          fetch-depth: 20
          persist-credentials: false

      - name: Require the same merge preview prepare resolved
        env:
          PREPARED_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$PREPARED_SHA" ]; then
            echo "::error::The merge preview moved to $checked_out since prepare resolved $PREPARED_SHA; a newer speculative dispatch owns this PR."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GHA-SpeculatePlatform-${{ matrix.image }}-${{ github.run_id }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Describe the exact speculative surface
        id: spec-surface
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOLVER_REVISION: ${{ needs.prepare.outputs.solver_revision }}
          SOLVER_SOURCE_SHA256: ${{ needs.prepare.outputs.solver_source_sha256 }}
        run: |
          set -euo pipefail
          case "${{ matrix.image }}" in
            app) bases=(python:3.12-slim) ;;
            broker) bases=(node:20-slim python:3.12-slim) ;;
            canonical-worker) bases=(python:3.12-slim) ;;
            harness) bases=(node:22-bookworm node:22-slim) ;;
            web) bases=(nginx:alpine node:22-slim) ;;
            *) echo "::error::Unknown platform surface."; exit 1 ;;
          esac
          base_args=()
          for base in "${bases[@]}"; do
            # Resolved through this account's ECR pull-through cache, never
            # registry-1.docker.io: this step runs on the CodeBuild fleet's
            # shared NAT egress, where anonymous Docker Hub requests 429
            # (#658 cause 1 -- this exact line was the one code path #654's
            # build-contexts fix never covered). The cache serves the
            # byte-identical manifest, so the recorded digest and the
            # `--base-image name=digest` manifest key are unchanged; only
            # where the bytes come from moves.
            digest="$(docker buildx imagetools inspect \
              "$ECR_REGISTRY/public-ecr/docker/library/$base" \
              --format '{{json .Manifest}}' | jq -er '.digest')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Base image $base did not resolve to one immutable digest through the pull-through cache."
              exit 1
            }
            base_args+=(--base-image "$base=$digest")
          done
          build_args=()
          solver_args=()
          if [ "${{ matrix.image }}" = "canonical-worker" ]; then
            build_args+=(--build-arg "AUTOFILL_SOLVER_REVISION=$SOLVER_REVISION")
            solver_args+=(--solver-revision "$SOLVER_REVISION")
            solver_args+=(--solver-source-sha256 "$SOLVER_SOURCE_SHA256")
          fi
          python scripts/platform_release_manifest.py surface-fingerprint \
            --repo-root . \
            --source-revision "$SOURCE_SHA" \
            --service "${{ matrix.image }}" \
            "${base_args[@]}" \
            "${build_args[@]}" \
            --buildkit-version "$(docker buildx version | head -n 1)" \
            --platform linux/amd64 \
            "${solver_args[@]}" \
            --output "$RUNNER_TEMP/spec-surface-fingerprint.json"
          fingerprint="$(jq -er '.surface_fingerprint' "$RUNNER_TEMP/spec-surface-fingerprint.json")"
          echo "lookup_tag=surface-v1-$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Skip when this tree is already speculatively pushed
        id: exists
        run: |
          set -euo pipefail
          found="$(aws ecr batch-get-image \
            --repository-name "$IMAGE_NAME" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'length(images)' \
            --output text 2>/dev/null || true)"
          if [[ "$found" == "1" ]]; then
            echo "::notice::$IMAGE_NAME already carries $IMAGE_TAG; adoption can use it as-is"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the read-only canonical solver deploy key
        if: matrix.image == 'canonical-worker' && steps.exists.outputs.present != 'true'
        env:
          AUTOFILL_SOLVER_DEPLOY_KEY: ${{ secrets.AUTOFILL_SOLVER_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "$AUTOFILL_SOLVER_DEPLOY_KEY" ] || {
            echo "::error::AUTOFILL_SOLVER_DEPLOY_KEY is required for the private canonical solver checkout."
            exit 1
          }

      - name: Check out the exact canonical solver source
        if: matrix.image == 'canonical-worker' && steps.exists.outputs.present != 'true'
        uses: actions/checkout@v4
        with:
          repository: LEAF-Solar-Design/autofill-solver
          ref: ${{ needs.prepare.outputs.solver_revision }}
          path: autofill-solver
          ssh-key: ${{ secrets.AUTOFILL_SOLVER_DEPLOY_KEY }}
          persist-credentials: false

      - name: Select the merged-onto main tip's cache, import-only
        id: cache
        if: steps.exists.outputs.present != 'true'
        run: |
          # Import the cache of the main tip this preview merged onto and
          # export nothing: speculative trees churn too fast to be worth
          # polluting the immutable buildcache-* namespace, and no export
          # means no cache_to race to tolerate.
          set -euo pipefail
          cache_repo="$ECR_REGISTRY/$IMAGE_NAME-buildcache"
          cache_from=""
          if [[ -n "$PREVIOUS_CACHE_TAG" ]]; then
            found="$(aws ecr batch-get-image \
              --repository-name "$IMAGE_NAME-buildcache" \
              --image-ids "imageTag=$PREVIOUS_CACHE_TAG" \
              --query 'length(images)' \
              --output text 2>/dev/null || true)"
            if [[ "$found" == "1" ]]; then
              cache_from="type=registry,ref=$cache_repo:$PREVIOUS_CACHE_TAG"
            fi
          fi
          # Nearest-ancestor fallback (chain keeper, 2026-08-05): the
          # merged-onto main tip's exact tag can be several commits stale
          # when adopted merges published nothing, and the commit-stable
          # keys (#458) make a near-ancestor cache nearly as good. The
          # preview's first-parent chain IS main's history, so the same
          # walk warm/build use works here (fetch-depth: 20 above), probed
          # in ONE batch-get-image call — deliberately not an ECR listing,
          # which neither workflow role is granted. IMPORT stays the only
          # direction in this lane; every failure lands on the uncached
          # build.
          if [[ -z "$cache_from" ]]; then
            ids=()
            for sha in $(git rev-list --first-parent --skip=1 --max-count=15 HEAD 2>/dev/null); do
              short="$(git rev-parse --short "$sha" 2>/dev/null)" || continue
              if [[ "buildcache-$short" == "${CURRENT_CACHE_TAG:-}" ]]; then
                continue
              fi
              ids+=("imageTag=buildcache-$short")
            done
            if [[ "${#ids[@]}" -gt 0 ]]; then
              found_tags="$(aws ecr batch-get-image \
                --repository-name "$IMAGE_NAME-buildcache" \
                --image-ids "${ids[@]}" \
                --query 'images[].imageId.imageTag' \
                --output text 2>/dev/null | tr '\t\n' '  ' || true)"
              for id in "${ids[@]}"; do
                tag="${id#imageTag=}"
                if [[ " $found_tags " == *" $tag "* ]]; then
                  cache_from="type=registry,ref=$cache_repo:$tag"
                  echo "::notice::$IMAGE_NAME importing the nearest ancestor cache $tag"
                  break
                fi
              done
            fi
            if [[ -z "$cache_from" ]]; then
              echo "::notice::$IMAGE_NAME has no predecessor cache; building without cache input"
            fi
          fi
          echo "from=$cache_from" >> "$GITHUB_OUTPUT"

      - name: Build and push speculative ${{ matrix.image }}
        id: spec-build-image
        if: steps.exists.outputs.present != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          build-args: |
            LEAF_SOURCE_SHA=${{ needs.prepare.outputs.source_sha }}
            ${{ matrix.image == 'canonical-worker' && format('AUTOFILL_SOLVER_REVISION={0}', needs.prepare.outputs.solver_revision) || '' }}
          # Every upstream base resolves through this account's ECR pull-through
          # cache instead of Docker Hub. buildx named contexts override an image
          # reference WITHOUT editing the Dockerfile, which matters here: the
          # release-provenance contract
          # (scripts/platform_release_manifest.py::_dockerfile_contract) parses
          # the literal FROM tokens and asserts they equal the resolved
          # base-image set, so a templated `FROM ${...}python:3.12-slim` would
          # make the manifest record a name nothing can resolve. This keeps the
          # Dockerfiles, the manifest keys and the recorded digests unchanged
          # (the two registries serve byte-identical manifests) and changes only
          # where the bytes come from.
          #
          # All five are listed for every image so this block stays byte-identical
          # across warm/build/speculate, which the workflow validator requires;
          # named contexts an image does not reference are simply never resolved.
          # `node:20-slim` also covers Dockerfile.broker's `COPY --from=node:20-slim`,
          # which is a base-image pull that no FROM-only survey catches.
          build-contexts: |
            nginx:alpine=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/nginx:alpine
            node:20-slim=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/node:20-slim
            node:22-bookworm=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/node:22-bookworm
            node:22-slim=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/node:22-slim
            python:3.12-slim=docker-image://${{ env.ECR_REGISTRY }}/public-ecr/docker/library/python:3.12-slim
            ${{ matrix.image == 'canonical-worker' && 'autofill_solver=./autofill-solver' || '' }}
          # zstd, app leg only: mirrors the full-build leg above. Adoption
          # aliases the speculative digest onto the immutable sha-* tags, so
          # without this the spec-built app image would keep every merge on
          # gzip and the full-build zstd leg would never be reached.
          push: ${{ matrix.image != 'app' }}
          outputs: ${{ matrix.image == 'app' && 'type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true' || '' }}
          tags: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: ${{ steps.cache.outputs.from }}

      - name: Set up Node for speculative web evidence
        if: matrix.image == 'web' && steps.exists.outputs.present != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Hash the speculative web deployment artifact
        id: spec-web
        if: matrix.image == 'web' && steps.exists.outputs.present != 'true'
        working-directory: web
        env:
          VITE_API_BASE: ""
          VITE_MOCK: "0"
          VITE_AUTH0_DOMAIN: leafautomation.us.auth0.com
          VITE_AUTH0_CLIENT_ID: zkJjr0ZFtcyQjyJ8e4zdkdgzoMaVWt5O
          VITE_AUTH0_AUDIENCE: https://api.leafdesign.ai
          LEAF_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          printf '{"ok":true,"service":"leaf-platform-web","component":"frontend","source_sha":"%s"}\n' \
            "$LEAF_SOURCE_SHA" > dist/health.json
          artifact_sha256="$(python ../scripts/platform_release_manifest.py \
            digest-web-dist --root dist)"
          python ../scripts/platform_release_manifest.py pack-web-dist \
            --root dist \
            --output "$RUNNER_TEMP/spec-web-dist.zip" >/dev/null
          echo "sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the provider-bound speculative web deployment artifact
        if: matrix.image == 'web' && steps.exists.outputs.present != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spec-web-dist-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spec-web-dist.zip
          if-no-files-found: error
          retention-days: 30

      - name: Materialize one producer-owned speculative v3 service entry
        if: steps.exists.outputs.present != 'true'
        env:
          IMAGE_DIGEST: ${{ steps.spec-build-image.outputs.digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.prepare.outputs.source_tree }}
          WORKFLOW_BLOB: ${{ needs.prepare.outputs.workflow_blob }}
          LOOKUP_TAG: ${{ steps.spec-surface.outputs.lookup_tag }}
          WEB_ARTIFACT_SHA256: ${{ steps.spec-web.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::The speculative build returned no immutable component digest."
            exit 1
          }
          artifact_args=()
          if [ "${{ matrix.image }}" = "web" ]; then
            artifact_args+=(--artifact-sha256 "$WEB_ARTIFACT_SHA256")
          fi
          python scripts/platform_release_manifest.py surface-predicate \
            --fingerprint "$RUNNER_TEMP/spec-surface-fingerprint.json" \
            --repository "$IMAGE_NAME" \
            --image-digest "$IMAGE_DIGEST" \
            --source-tree "$SOURCE_TREE" \
            --workflow-blob "$WORKFLOW_BLOB" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            "${artifact_args[@]}" \
            --output "$RUNNER_TEMP/spec-surface-predicate.json"
          predicate_hash="$(jq -cS . "$RUNNER_TEMP/spec-surface-predicate.json" | sha256sum | awk '{print $1}')"
          jq --arg lookup_tag "$LOOKUP_TAG" \
             --arg subject "$ECR_REGISTRY/$IMAGE_NAME" \
             --arg provenance_digest "sha256:$predicate_hash" '
            {
              repository,
              image_digest,
              immutable_lookup_tag: $lookup_tag,
              producer_source_revision,
              producer_source_tree,
              surface_fingerprint,
              recipe_fingerprint,
              producer_workflow_path,
              producer_workflow_blob,
              producer_run_id,
              producer_run_attempt,
              provenance_subject: $subject,
              provenance_digest: $provenance_digest,
              build_disposition: "built"
            }
            + (if .service == "canonical-worker" then {solver_provenance} else {} end)
            + (if .service == "web" then {artifact_sha256} else {} end)
          ' "$RUNNER_TEMP/spec-surface-predicate.json" > "$RUNNER_TEMP/spec-service-entry.json"

      - name: Upload one producer-owned speculative v3 service entry
        if: steps.exists.outputs.present != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spec-surface-result-${{ matrix.image }}-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spec-service-entry.json
          if-no-files-found: error
          retention-days: 30

  # The speculative fan-in and the partial-push invariant, redefined over
  # tree identity: a spec-v3-supply-set-<tree> artifact exists ONLY when all
  # five digests and all five provider-owned entries agree on the exact
  # preview run and tree. `adopt` on
  # the merge run refuses anything less, so a partial speculative push can
  # never become a deployable supply set. Runs even when a matrix leg lost
  # an immutable-tag race to a sibling run — the digests decide, not the
  # leg's conclusion.
  speculate-manifest:
    needs: [prepare, speculate]
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch' &&
          inputs.speculative && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ecr-release
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 807034087062.dkr.ecr.us-east-1.amazonaws.com
      SPEC_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_TREE: ${{ needs.prepare.outputs.source_tree }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.speculative_pr_number }}/merge
          persist-credentials: false

      - name: Require the same merge preview prepare resolved
        env:
          PREPARED_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$PREPARED_SHA" ]; then
            echo "::error::The merge preview moved to $checked_out since prepare resolved $PREPARED_SHA; a newer speculative dispatch owns this PR."
            exit 1
          fi

      - name: Download exact speculative v3 service entries
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: spec-surface-result-*-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spec-surface-results

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GHA-SpeculateManifest-${{ github.run_id }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify all five speculative digests before minting a manifest
        id: digests
        run: |
          set -euo pipefail
          echo "complete=false" >> "$GITHUB_OUTPUT"
          declare -A digests
          for image in app broker canonical-worker harness web; do
            repository="leaf-platform-$image"
            digest="$(aws ecr batch-get-image \
              --repository-name "$repository" \
              --image-ids "imageTag=$SPEC_TAG" \
              --query 'images[0].imageId.imageDigest' \
              --output text 2>/dev/null || true)"
            if [[ -z "$digest" || "$digest" == "None" ]]; then
              echo "::notice::$repository does not carry $SPEC_TAG; the speculative set is incomplete and no manifest will be minted."
              exit 0
            fi
            digests["$image"]="$digest"
          done
          {
            echo "app=${digests[app]}"
            echo "broker=${digests[broker]}"
            echo "canonical_worker=${digests[canonical-worker]}"
            echo "harness=${digests[harness]}"
            echo "web=${digests[web]}"
            echo "complete=true"
          } >> "$GITHUB_OUTPUT"

      - name: Mint the provider-bound speculative v3 supply set
        id: evidence
        if: steps.digests.outputs.complete == 'true'
        run: |
          set -euo pipefail
          echo "complete=false" >> "$GITHUB_OUTPUT"
          declare -A entries digests
          digests[app]="${{ steps.digests.outputs.app }}"
          digests[broker]="${{ steps.digests.outputs.broker }}"
          digests[canonical-worker]="${{ steps.digests.outputs.canonical_worker }}"
          digests[harness]="${{ steps.digests.outputs.harness }}"
          digests[web]="${{ steps.digests.outputs.web }}"
          for image in app broker canonical-worker harness web; do
            mapfile -t matches < <(find "$RUNNER_TEMP/spec-surface-results" -type f \
              -path "*/spec-surface-result-$image-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}/spec-service-entry.json" \
              -print 2>/dev/null || true)
            if [ "${#matches[@]}" != "1" ]; then
              echo "::notice::Speculative $image has ${#matches[@]} current-run v3 entries; no provider-bound supply artifact will be minted."
              exit 0
            fi
            entries["$image"]="${matches[0]}"
            jq -e \
              --arg source "${{ needs.prepare.outputs.source_sha }}" \
              --arg tree "$SOURCE_TREE" \
              --arg digest "${digests[$image]}" \
              --argjson run "$GITHUB_RUN_ID" \
              --argjson attempt "$GITHUB_RUN_ATTEMPT" '
                .producer_source_revision == $source
                and .producer_source_tree == $tree
                and .image_digest == $digest
                and .producer_run_id == $run
                and .producer_run_attempt == $attempt
                and .build_disposition == "built"
              ' "${entries[$image]}" >/dev/null || {
                echo "::error::Speculative $image v3 entry is rebound from this provider run or live digest."
                exit 1
              }
          done
          python scripts/platform_release_manifest.py generate-v3 \
            --release-source-revision "${{ needs.prepare.outputs.source_sha }}" \
            --release-source-tree "$SOURCE_TREE" \
            --build-run-id "$GITHUB_RUN_ID" \
            --build-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --service-entry "app=${entries[app]}" \
            --service-entry "broker=${entries[broker]}" \
            --service-entry "canonical-worker=${entries[canonical-worker]}" \
            --service-entry "harness=${entries[harness]}" \
            --service-entry "web=${entries[web]}" \
            --output "$RUNNER_TEMP/spec-v3-supply-set.json"
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Upload the provider-bound speculative v3 supply set
        if: steps.evidence.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spec-v3-supply-set-${{ needs.prepare.outputs.source_tree }}
          path: ${{ runner.temp }}/spec-v3-supply-set.json
          if-no-files-found: error
          retention-days: 30

  # Tree-identity adoption (the merge-run half of the speculative lane).
  # BEFORE the first release-tag write this job has the gate-reuse probe's
  # posture: every failure degrades to adopted=false and the full build
  # runs (an EXIT trap converts even unexpected script deaths into that).
  # AFTER the first write, adoption is COMMITTED: the immutable prod-* tag
  # already points at a speculative digest, a fallback rebuild would only
  # collide with it, so a persistent alias failure fails THIS run with a
  # rerun-to-resume instruction instead (the alias loop is idempotent).
  # Provenance comes from the artifact listing's workflow_run metadata
  # (same-repo origin, this workflow's path, a workflow_dispatch run on
  # main), never from the file's own claims, and the content re-verifies
  # against the gate's proven tree plus the live registry digests before a
  # single tag is written.
  #
  # ADOPTED-PATH VERIFY (folded 2026-08-05): when the decide step ends
  # with adopted=true the whole build matrix skips, so this job finishes
  # the run's verify leg in place instead of handing it to the verify
  # job's fresh runner (~11s scheduling gap plus ~10s of duplicated
  # checkout/OIDC/node setup, measured on run 30992431627). The steps
  # after decide perform the same terminal supply-set and web-artifact duties
  # as the verify job, while consuming the main-run v3 envelope created by
  # decide. The verify JOB still owns the full-build path. Every such step is
  # conditional on adopted=true and
  # deliberately NOT absorbed: any failure there is post-commit by
  # construction (adopted=true means every alias re-verified), so it must
  # redden the run, and a RERUN resumes idempotently — decide re-confirms
  # the existing aliases and the verify steps run again. This adds no
  # credential reach: the job already held the release role for aliasing
  # and actions:read for the artifact listing; the supply-set write uses
  # only ECR reads the role already had.
  adopt:
    needs: [prepare, test]
    if: ${{ !inputs.promote && github.event_name == 'push' && needs.prepare.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ecr-release
    permissions:
      id-token: write
      contents: read
      # Read-only: lists and downloads provider-bound speculative v3 artifacts minted by
      # speculative runs through the Actions API.
      actions: read

    outputs:
      adopted: ${{ steps.decide.outputs.adopted }}
      spec_run_id: ${{ steps.decide.outputs.spec_run_id }}
      built_from: ${{ steps.decide.outputs.built_from }}

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 807034087062.dkr.ecr.us-east-1.amazonaws.com
      PROD_TAG: ${{ needs.prepare.outputs.tag }}
      PROVEN_TREE: ${{ needs.test.outputs.proven_tree }}
      # The merge commit whose tree the adopted digests realize — the
      # identity the src- stamp below records.
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      # Same value as PROD_TAG, under the name the byte-identical
      # verify-half scripts read (the verify job calls it TAG).
      TAG: ${{ needs.prepare.outputs.tag }}

    # Every setup step is individually absorbed (continue-on-error at STEP
    # level): a checkout, python, OIDC, or ECR login failure happens before
    # any tag write is even possible, so it must degrade through the decide
    # step's internal absorption (its aws/python calls fail, adopted=false,
    # the full build runs) — a red adopt job here would wrongly veto the
    # fallback build. The decide step itself is NOT absorbed: its only
    # deliberate nonzero exit is the post-write committed path, which must
    # fail the run.
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      # The v3 verifier and re-envelope helper are stdlib-only: no pip.
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.12'

      - name: Configure AWS credentials (OIDC)
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GHA-AdoptPlatform-${{ github.run_id }}

      - name: Login to ECR
        continue-on-error: true
        uses: aws-actions/amazon-ecr-login@v2

      - name: Adopt a verified speculative supply set for this exact tree
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deliberately NOT errexit (set +e overrides the runner's `bash -e`
          # wrapper): before the first release-tag write, every failure —
          # including an unexpected script death, via the EXIT trap — must
          # degrade to adopted=false (the full build runs). Once COMMITTED
          # flips, a failure propagates and fails the run instead: building
          # over a half-aliased release tag can only collide.
          set -uo pipefail
          set +e
          COMMITTED=false
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$COMMITTED" != "true" ]; then
              echo "adopted=false" >> "$GITHUB_OUTPUT"
              echo "::notice::adopt: unexpected failure (exit $rc) before any tag write; the full build runs"
              exit 0
            fi
          }
          trap on_exit EXIT
          finish() {
            echo "adopted=$1" >> "$GITHUB_OUTPUT"
            if [ -n "${2:-}" ]; then echo "::notice::adopt: $2"; fi
            exit 0
          }
          if [ "$DIGEST_AWARE_CONVERGENCE_ENABLED" = "true" ]; then
            finish false "digest-aware convergence uses per-surface signed reuse; speculative whole-set adoption is disabled"
          fi
          tree="$(git rev-parse 'HEAD^{tree}' 2>/dev/null || true)"
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || finish false "checkout has no tree"
          [[ "$PROVEN_TREE" == "$tree" ]] || finish false "gate verdict binds tree ${PROVEN_TREE:-<none>}, not $tree"
          [[ "$PROD_TAG" =~ ^prod-[0-9a-f]{7,40}$ ]] || finish false "refusing to alias non-release tag $PROD_TAG"
          repo_id="$(gh api "repos/$GITHUB_REPOSITORY" --jq .id 2>/dev/null || true)"
          artifact_name="spec-v3-supply-set-$tree"
          listing="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=30" 2>/dev/null || true)"
          if [[ -z "$repo_id" || -z "$listing" ]]; then
            finish false "artifact listing unavailable"
          fi
          # One exact provider artifact is required. Multiple valid candidates
          # are ambiguous and cannot be resolved by newest-wins metadata.
          mapfile -t candidates < <(jq -r --argjson repo_id "$repo_id" '
            [.artifacts[]
             | select(.expired | not)
             | select(.workflow_run.head_repository_id == $repo_id)]
            | .[] | [.id, .workflow_run.id, .digest] | @tsv
          ' <<<"$listing" 2>/dev/null || true)
          [ "${#candidates[@]}" = "1" ] || finish false "expected one exact provider-bound speculative v3 artifact, found ${#candidates[@]}"
          IFS=$'\t' read -r candidate_id candidate_run candidate_archive_digest <<<"${candidates[0]}"
          [[ "$candidate_archive_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || finish false "provider artifact has no immutable archive digest"

          # Only one completed main-ref dispatch of this immutable workflow
          # may own the artifact. All facts below come from provider records.
          run_record="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run" 2>/dev/null || true)"
          [[ -n "$run_record" ]] || finish false "speculative provider run is unavailable"
          path="$(jq -r '.path // empty' <<<"$run_record")"
          path="${path%%@*}"
          [[ "$path" == ".github/workflows/build-platform-images.yml" ]] || finish false "speculative provider workflow is foreign"
          [[ "$(jq -r '.event // empty' <<<"$run_record")" == "workflow_dispatch" ]] || finish false "speculative provider event is foreign"
          [[ "$(jq -r '.head_branch // empty' <<<"$run_record")" == "main" ]] || finish false "speculative provider branch is foreign"
          [[ "$(jq -r '.status // empty' <<<"$run_record")" == "completed" ]] || finish false "speculative provider run is not terminal"
          [[ "$(jq -r '.conclusion // empty' <<<"$run_record")" == "success" ]] || finish false "speculative provider run did not succeed"
          candidate_run_attempt="$(jq -r '.run_attempt // empty' <<<"$run_record")"
          [[ "$candidate_run_attempt" =~ ^[1-9][0-9]*$ ]] || finish false "speculative provider attempt is invalid"
          candidate_run_head="$(jq -r '.head_sha // empty' <<<"$run_record")"
          [[ "$candidate_run_head" =~ ^[0-9a-f]{40}$ ]] || finish false "speculative provider source is invalid"
          candidate_workflow_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build-platform-images.yml?ref=$candidate_run_head" --jq .sha 2>/dev/null || true)"
          [[ "$candidate_workflow_blob" =~ ^[0-9a-f]{40}$ ]] || finish false "speculative provider workflow blob is unavailable"

          rm -rf spec-candidate && mkdir -p spec-candidate
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$candidate_id/zip" \
            > spec-candidate/spec.zip 2>/dev/null || finish false "speculative artifact download failed"
          actual_archive_digest="sha256:$(sha256sum spec-candidate/spec.zip | awk '{print $1}')"
          [ "$actual_archive_digest" = "$candidate_archive_digest" ] || finish false "speculative provider archive digest changed"
          mapfile -t archive_paths < <(unzip -Z1 spec-candidate/spec.zip 2>/dev/null || true)
          [ "${#archive_paths[@]}" = "1" ] && [ "${archive_paths[0]}" = "spec-v3-supply-set.json" ] || finish false "speculative provider archive is not closed"
          unzip -o -q spec-candidate/spec.zip -d spec-candidate || finish false "speculative provider archive is malformed"
          candidate_source="$(jq -er '.release_source_revision' spec-candidate/spec-v3-supply-set.json 2>/dev/null)" \
            || finish false "speculative v3 source is unavailable"
          [[ "$candidate_source" =~ ^[0-9a-f]{40}$ ]] || finish false "speculative v3 source is invalid"
          web_artifact_name="spec-web-dist-$candidate_source-attempt-$candidate_run_attempt"
          web_listing="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run/artifacts?per_page=100" 2>/dev/null || true)"
          [[ -n "$web_listing" ]] || finish false "speculative web artifact listing is unavailable"
          mapfile -t web_candidates < <(jq -r --arg name "$web_artifact_name" '
            [.artifacts[] | select((.expired | not) and .name == $name)]
            | .[] | [.id, .digest] | @tsv
          ' <<<"$web_listing" 2>/dev/null || true)
          [ "${#web_candidates[@]}" = "1" ] || finish false "expected one provider-bound speculative web artifact, found ${#web_candidates[@]}"
          IFS=$'\t' read -r web_artifact_id web_archive_digest <<<"${web_candidates[0]}"
          [[ "$web_archive_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || finish false "speculative web artifact has no immutable provider digest"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$web_artifact_id/zip" \
            > spec-candidate/web-provider.zip 2>/dev/null || finish false "speculative web artifact download failed"
          actual_web_archive_digest="sha256:$(sha256sum spec-candidate/web-provider.zip | awk '{print $1}')"
          [ "$actual_web_archive_digest" = "$web_archive_digest" ] || finish false "speculative web provider archive digest changed"
          mapfile -t web_archive_paths < <(unzip -Z1 spec-candidate/web-provider.zip 2>/dev/null || true)
          [ "${#web_archive_paths[@]}" = "1" ] && [ "${web_archive_paths[0]}" = "spec-web-dist.zip" ] || finish false "speculative web provider archive is not closed"
          unzip -o -q spec-candidate/web-provider.zip -d spec-candidate || finish false "speculative web provider archive is malformed"
          claimed_old_web_artifact="$(jq -er '.services.web.artifact_sha256' spec-candidate/spec-v3-supply-set.json 2>/dev/null)" \
            || finish false "speculative v3 web artifact hash is unavailable"
          python scripts/platform_release_manifest.py restamp-web-artifact \
            --input-archive spec-candidate/spec-web-dist.zip \
            --output-archive spec-candidate/main-web-dist.zip \
            --output-root spec-candidate/restamped-web \
            --old-source-revision "$candidate_source" \
            --new-source-revision "$SOURCE_SHA" \
            --common-tree "$tree" \
            --expect-old-artifact-sha256 "$claimed_old_web_artifact" \
            --receipt spec-candidate/web-source-restamp.json \
            || finish false "speculative web artifact cannot be deterministically restamped"
          python scripts/platform_release_manifest.py re-envelope-speculative-v3 \
            --manifest spec-candidate/spec-v3-supply-set.json \
            --web-restamp-receipt spec-candidate/web-source-restamp.json \
            --speculative-run-id "$candidate_run" \
            --speculative-run-attempt "$candidate_run_attempt" \
            --expect-candidate-tree "$tree" \
            --expect-workflow-blob "$candidate_workflow_blob" \
            --release-source-revision "$SOURCE_SHA" \
            --release-source-tree "$tree" \
            --build-run-id "$GITHUB_RUN_ID" \
            --build-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output spec-candidate/main-v3-supply-set.json \
            || finish false "speculative v3 lineage cannot be re-enveloped for this main run"
          verified="spec-candidate/main-v3-supply-set.json"
          candidate_source="$(jq -r '.services.app.producer_source_revision' "$verified")"
          spec_tag="spec-$tree-${candidate_source:0:12}"
          [[ "$spec_tag" =~ ^spec-[0-9a-f]{40}-[0-9a-f]{12}$ ]] || finish false "verified manifest carries a malformed spec tag"
          # The registry is the ground truth: every manifest digest must be
          # exactly what the immutable spec tag carries right now.
          declare -A spec_digest spec_manifest
          for image in app broker canonical-worker harness web; do
            repository="leaf-platform-$image"
            record="$(aws ecr batch-get-image \
              --repository-name "$repository" \
              --image-ids "imageTag=$spec_tag" \
              --output json 2>/dev/null || true)"
            digest="$(jq -r '.images[0].imageId.imageDigest // empty' <<<"$record")"
            manifest_doc="$(jq -r '.images[0].imageManifest // empty' <<<"$record")"
            claimed="$(jq -r --arg image "$image" '.services[$image].image_digest' "$verified")"
            if [[ -z "$digest" || -z "$manifest_doc" || "$digest" != "$claimed" ]]; then
              finish false "$repository digest under $spec_tag does not match the verified manifest"
            fi
            spec_digest["$image"]="$digest"
            spec_manifest["$image"]="$manifest_doc"
          done
          # Alias phase, idempotent per image: an existing release tag must
          # already be the speculative digest (a rerun of an adopted run),
          # anything else means a full build owns this tag and adoption must
          # stand down — but ONLY while nothing has been written. After the
          # first confirmed alias, COMMITTED flips: from here a fallback
          # rebuild would collide with the immutable tag, so a persistent
          # failure (three attempts per image) fails the run with a
          # rerun-to-resume instruction instead of degrading.
          for image in app broker canonical-worker harness web; do
            repository="leaf-platform-$image"
            existing="$(aws ecr batch-get-image \
              --repository-name "$repository" \
              --image-ids "imageTag=$PROD_TAG" \
              --query 'images[0].imageId.imageDigest' \
              --output text 2>/dev/null || true)"
            if [[ -n "$existing" && "$existing" != "None" ]]; then
              if [[ "$existing" != "${spec_digest[$image]}" ]]; then
                if [ "$COMMITTED" = "true" ]; then
                  echo "::error::adopt: $repository:$PROD_TAG holds a foreign digest after adoption began; rerun this run to diagnose."
                  exit 1
                fi
                finish false "$repository:$PROD_TAG already points at a foreign digest"
              fi
              COMMITTED=true
              continue
            fi
            aliased=false
            for attempt in 1 2 3; do
              aws ecr put-image \
                --repository-name "$repository" \
                --image-tag "$PROD_TAG" \
                --image-manifest "${spec_manifest[$image]}" >/dev/null 2>&1
              rc=$?
              if [[ "$rc" -eq 0 ]]; then
                aliased=true
                break
              fi
              raced="$(aws ecr batch-get-image \
                --repository-name "$repository" \
                --image-ids "imageTag=$PROD_TAG" \
                --query 'images[0].imageId.imageDigest' \
                --output text 2>/dev/null || true)"
              if [[ "$raced" == "${spec_digest[$image]}" ]]; then
                aliased=true
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$aliased" != "true" ]; then
              # A write was ATTEMPTED, so unconfirmed state counts as
              # committed: ECR may have applied a put whose response was
              # lost, and during the same outage the raced re-reads fail
              # too. Degrading to the full build is safe only when one
              # SUCCESSFUL probe positively proves the tag absent; a probe
              # error cannot tell the difference and must fail toward
              # rerun-to-resume instead of a guaranteed tag collision.
              absent=false
              if probe="$(aws ecr batch-get-image \
                --repository-name "$repository" \
                --image-ids "imageTag=$PROD_TAG" \
                --query 'images[0].imageId.imageDigest' \
                --output text 2>/dev/null)"; then
                if [[ -z "$probe" || "$probe" == "None" ]]; then
                  absent=true
                fi
              fi
              if [ "$COMMITTED" != "true" ] && [ "$absent" = "true" ]; then
                finish false "$repository:$PROD_TAG alias failed after 3 attempts and the tag is positively absent"
              fi
              echo "::error::adopt: $repository:$PROD_TAG state is unconfirmed after a write attempt (or adoption was already committed); RERUN THIS RUN to resume — the alias loop is idempotent."
              exit 1
            fi
            COMMITTED=true
          done
          # Re-verify every alias before declaring adoption: the verdict
          # below is what skips the entire build matrix. Tags are written by
          # now, so a disagreement here fails the run (a fallback rebuild
          # could only collide), and a rerun resumes idempotently.
          for image in app broker canonical-worker harness web; do
            repository="leaf-platform-$image"
            final="$(aws ecr batch-get-image \
              --repository-name "$repository" \
              --image-ids "imageTag=$PROD_TAG" \
              --query 'images[0].imageId.imageDigest' \
              --output text 2>/dev/null || true)"
            if [[ "$final" != "${spec_digest[$image]}" ]]; then
              echo "::error::adopt: $repository:$PROD_TAG re-verification failed after aliasing; RERUN THIS RUN to resume."
              exit 1
            fi
          done
          # Stamp the adopted app image with its src-<full-commit>
          # identity tag, mirroring the full build's second app tag. The
          # adopted digests realize this exact merge commit's tree, so the
          # merge commit is the correct identity for migration-source
          # comparisons. src- is a CI build-identity namespace consumed
          # only by the staging migration source diff — never a release or
          # review tag, no deploy rail accepts it — so a failed stamp only
          # costs the fast path: loud warning, never a red run, and the
          # immutable-tag refusal below means a conflicting src- tag can
          # never be repointed.
          if [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            src_tag="src-$SOURCE_SHA"
            src_existing="$(aws ecr batch-get-image \
              --repository-name leaf-platform-app \
              --image-ids "imageTag=$src_tag" \
              --query 'images[0].imageId.imageDigest' \
              --output text 2>/dev/null || true)"
            if [[ "$src_existing" == "${spec_digest[app]}" ]]; then
              echo "::notice::adopt: leaf-platform-app:$src_tag already stamped"
            elif [[ -n "$src_existing" && "$src_existing" != "None" ]]; then
              echo "::warning::adopt: leaf-platform-app:$src_tag already names a different digest; leaving it alone (the staging migdiff fast path keeps the probe)"
            elif aws ecr put-image \
              --repository-name leaf-platform-app \
              --image-tag "$src_tag" \
              --image-manifest "${spec_manifest[app]}" >/dev/null 2>&1; then
              echo "::notice::adopt: stamped leaf-platform-app:$src_tag"
            else
              echo "::warning::adopt: could not stamp leaf-platform-app:$src_tag; the staging migdiff fast path keeps the probe"
            fi
          else
            echo "::warning::adopt: SOURCE_SHA is not one full commit; skipping the src- identity stamp"
          fi
          spec_run_id="$candidate_run"
          built_from="$candidate_source"
          {
            echo "spec_run_id=$spec_run_id"
            echo "built_from=$built_from"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Speculative supply set adopted"
            echo ""
            echo "Tree: \`$tree\` (provider-bound speculative run $spec_run_id)"
            echo "All five images aliased to \`$PROD_TAG\` with zero rebuild."
          } >> "$GITHUB_STEP_SUMMARY"
          finish true "aliased $PROD_TAG onto the speculative digests of tree $tree"

      # ----- Adopted-path verify half. It preserves the verify job's terminal
      # artifact duties but consumes the main-run provider-bound v3 envelope;
      # see the job comment above for the fold rationale and failure semantics. -----
      - name: Verify the provider-bound web source restamp
        if: steps.decide.outputs.adopted == 'true'
        run: |
          set -euo pipefail
          receipt_hash="$(jq -er '.new_artifact_sha256' spec-candidate/web-source-restamp.json)"
          materialized_hash="$(python scripts/platform_release_manifest.py \
            digest-web-dist --root spec-candidate/restamped-web/dist)"
          [ "$receipt_hash" = "$materialized_hash" ] || {
            echo "::error::The materialized web artifact differs from its source-restamp receipt."
            exit 1
          }
          jq -e \
            --arg old "${{ steps.decide.outputs.built_from }}" \
            --arg new "${{ needs.prepare.outputs.source_sha }}" \
            --arg tree "$(git rev-parse 'HEAD^{tree}')" '
              .schema == "leaf.web-source-restamp.v1"
              and .algorithm == "leaf.web-source-restamp.v1"
              and .old_source_revision == $old
              and .new_source_revision == $new
              and .common_tree == $tree
              and .changed_path == "dist/health.json"
              and .changed_field == "source_sha"
            ' spec-candidate/web-source-restamp.json >/dev/null || {
              echo "::error::The web source-restamp receipt is not bound to this main release."
              exit 1
            }

      - name: Write the immutable five-service staging supply set
        if: steps.decide.outputs.adopted == 'true'
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^(prod-[0-9a-f]{7,40}|sha-[0-9a-f]{40})$ ]]; then
            echo "::error::Refusing to verify an unapproved immutable tag: $TAG"
            exit 1
          fi
          declare -A digests
          for image in app broker canonical-worker harness web; do
            repository="leaf-platform-$image"
            digest="$(aws ecr batch-get-image \
              --repository-name "$repository" \
              --image-ids "imageTag=$TAG" \
              --query 'images[0].imageId.imageDigest' \
              --output text)"
            if [[ -z "$digest" || "$digest" == "None" ]]; then
              echo "::error::$repository does not contain $TAG"
              exit 1
            fi
            digests["$image"]="$digest"
            claimed="$(jq -er --arg image "$image" '.services[$image].image_digest' spec-candidate/main-v3-supply-set.json)"
            [ "$digest" = "$claimed" ] || {
              echo "::error::$repository:$TAG changed after the provider-bound v3 envelope was verified."
              exit 1
            }
          done
          jq -e \
            --arg source "${{ needs.prepare.outputs.source_sha }}" \
            --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --argjson run "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" '
              .schema == "leaf.staging-supply-set.v3"
              and .release_source_revision == $source
              and .release_source_tree == $tree
              and .build_run_id == $run
              and .build_run_attempt == $attempt
            ' spec-candidate/main-v3-supply-set.json >/dev/null || {
              echo "::error::The adopted v3 envelope is not bound to this main provider run."
              exit 1
            }
          claimed_web_artifact="$(jq -er '.services.web.artifact_sha256' spec-candidate/main-v3-supply-set.json)"
          restamped_web_artifact="$(jq -er '.new_artifact_sha256' spec-candidate/web-source-restamp.json)"
          [ "$claimed_web_artifact" = "$restamped_web_artifact" ] || {
            echo "::error::The adopted v3 web entry does not match the source-restamp receipt."
            exit 1
          }
          cp spec-candidate/main-v3-supply-set.json "$RUNNER_TEMP/staging-supply-set.json"
          {
            echo "## Provider-bound adopted v3 supply set verified"
            echo ""
            echo "Release source: \`${{ needs.prepare.outputs.source_sha }}\`"
            echo "Tag: \`$TAG\`"
            echo "Speculative producer run: \`${{ steps.decide.outputs.spec_run_id }}\`"
            for image in app broker canonical-worker harness web; do
              echo "- \`leaf-platform-$image@${digests[$image]}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable staging supply-set manifest
        if: steps.decide.outputs.adopted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staging-supply-set-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-supply-set.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload deterministic web deployment artifact
        if: steps.decide.outputs.adopted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: spec-candidate/restamped-web/dist
          if-no-files-found: error
          retention-days: 30

      - name: Upload provider-bound web source-restamp receipt
        if: steps.decide.outputs.adopted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-source-restamp-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ github.workspace }}/spec-candidate/web-source-restamp.json
          if-no-files-found: error
          retention-days: 30

  handoff:
    needs: [prepare]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.promote &&
      needs.prepare.outputs.source_mode == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.TERRAFORM_REPO_TOKEN }}
      RELEASE_RUN_ID: ${{ inputs.release_workflow_run_id }}
      RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
      ACCEPTANCE_RUN_ID: ${{ inputs.staging_acceptance_workflow_run_id }}
      ACCEPTANCE_RUN_ATTEMPT: ${{ inputs.staging_acceptance_run_attempt }}
      ACCEPTANCE_ARTIFACT: ${{ inputs.staging_acceptance_artifact }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Consume the release manifest and accepted staging execution receipt
        env:
          # The job-level GH_TOKEN is the cross-repo PAT for the
          # acceptance-repo API reads. The same-repo main fetch needs only
          # a same-repo read, so it gets the workflow's own token under a
          # separate name and the PAT never enters the git header.
          MAIN_FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_WORKFLOW_PATH=.github/workflows/build-platform-images.yml
          ACCEPTANCE_REPOSITORY=LEAF-Solar-Design/leaf-automation-aws-terraform
          ACCEPTANCE_WORKFLOW_PATH=.github/workflows/accept-leaf-platform-staging-authored-cad.yml
          RELEASE_ARTIFACT="staging-supply-set-$SOURCE_SHA-attempt-$RELEASE_RUN_ATTEMPT"
          [[ "$ACCEPTANCE_ARTIFACT" =~ ^staging-authored-execute-([a-z0-9][a-z0-9-]{5,49})-run-${ACCEPTANCE_RUN_ID}-attempt-${ACCEPTANCE_RUN_ATTEMPT}$ ]]
          ACCEPTANCE_RECEIPT_RUN_ID=${BASH_REMATCH[1]}
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" \
            > "$RUNNER_TEMP/release-workflow-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-platform-images.yml" \
            > "$RUNNER_TEMP/release-workflow.json"
          python scripts/platform_release_manifest.py verify-workflow-run \
            --run "$RUNNER_TEMP/release-workflow-run.json" \
            --workflow "$RUNNER_TEMP/release-workflow.json" \
            --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT" \
            --workflow-path "$RELEASE_WORKFLOW_PATH" \
            --event push --branch main --head-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/release-run-proof.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/release-artifacts.json"
          python scripts/platform_release_manifest.py verify-artifact \
            --listing "$RUNNER_TEMP/release-artifacts.json" \
            --artifact-name "$RELEASE_ARTIFACT" \
            --run-id "$RELEASE_RUN_ID" --head-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/release-artifact.json"
          RELEASE_ARTIFACT_ID=$(jq -er '.id' "$RUNNER_TEMP/release-artifact.json")
          mkdir -p "$RUNNER_TEMP/release"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RELEASE_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/release.zip"
          unzip -q "$RUNNER_TEMP/release.zip" -d "$RUNNER_TEMP/release"
          gh api "repos/$ACCEPTANCE_REPOSITORY/actions/runs/$ACCEPTANCE_RUN_ID" \
            > "$RUNNER_TEMP/staging-acceptance-run.json"
          gh api "repos/$ACCEPTANCE_REPOSITORY/actions/workflows/accept-leaf-platform-staging-authored-cad.yml" \
            > "$RUNNER_TEMP/staging-acceptance-workflow.json"
          ACCEPTANCE_HEAD_SHA=$(jq -er '.head_sha' "$RUNNER_TEMP/staging-acceptance-run.json")
          python scripts/platform_release_manifest.py verify-workflow-run \
            --run "$RUNNER_TEMP/staging-acceptance-run.json" \
            --workflow "$RUNNER_TEMP/staging-acceptance-workflow.json" \
            --run-id "$ACCEPTANCE_RUN_ID" \
            --run-attempt "$ACCEPTANCE_RUN_ATTEMPT" \
            --workflow-path "$ACCEPTANCE_WORKFLOW_PATH" \
            --event workflow_dispatch --branch main --head-sha "$ACCEPTANCE_HEAD_SHA" \
            --output "$RUNNER_TEMP/staging-acceptance-run-proof.json"
          gh api "repos/$ACCEPTANCE_REPOSITORY/compare/$ACCEPTANCE_HEAD_SHA...main" \
            > "$RUNNER_TEMP/staging-acceptance-main-ancestry.json"
          jq -e --arg head "$ACCEPTANCE_HEAD_SHA" '
            (.merge_base_commit.sha | ascii_downcase) == $head
            and (.status == "ahead" or .status == "identical")
          ' "$RUNNER_TEMP/staging-acceptance-main-ancestry.json" >/dev/null
          gh api "repos/$ACCEPTANCE_REPOSITORY/actions/runs/$ACCEPTANCE_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/staging-acceptance-artifacts.json"
          python scripts/platform_release_manifest.py verify-artifact \
            --listing "$RUNNER_TEMP/staging-acceptance-artifacts.json" \
            --artifact-name "$ACCEPTANCE_ARTIFACT" \
            --run-id "$ACCEPTANCE_RUN_ID" --head-sha "$ACCEPTANCE_HEAD_SHA" \
            --output "$RUNNER_TEMP/staging-acceptance-artifact.json"
          ACCEPTANCE_ARTIFACT_ID=$(jq -er '.id' "$RUNNER_TEMP/staging-acceptance-artifact.json")
          mkdir -p "$RUNNER_TEMP/staging-acceptance"
          gh api "repos/$ACCEPTANCE_REPOSITORY/actions/artifacts/$ACCEPTANCE_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/staging-acceptance.zip"
          unzip -q "$RUNNER_TEMP/staging-acceptance.zip" \
            -d "$RUNNER_TEMP/staging-acceptance"
          mapfile -t receipts < <(find "$RUNNER_TEMP/staging-acceptance" \
            -type f -name '*.json' -print)
          [ "${#receipts[@]}" -eq 1 ] || {
            echo "::error::The accepted staging artifact must contain exactly one JSON receipt."
            exit 1
          }
          # The checkout persisted no credentials and the repository is
          # private, so a bare fetch dies on auth. The main fetch carries
          # its own scoped, non-persisted header (the decide/merge-preview
          # fetch idiom) on the workflow's own token.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf '%s' "x-access-token:$MAIN_FETCH_TOKEN" | base64 -w0)" \
            fetch --no-tags origin main
          python scripts/platform_release_manifest.py verify-staging \
            --manifest "$RUNNER_TEMP/release/staging-supply-set.json" \
            --receipt "${receipts[0]}" \
            --repo-root . \
            --main-ref origin/main \
            --release-run-proof "$RUNNER_TEMP/release-run-proof.json" \
            --acceptance-run-proof "$RUNNER_TEMP/staging-acceptance-run-proof.json" \
            --expected-receipt-run-id "$ACCEPTANCE_RECEIPT_RUN_ID" \
            --output "$RUNNER_TEMP/production-handoff-candidate.json"
          echo "Verified receipt-bound production handoff candidate. No image was rebuilt or retagged, and no deployment was dispatched." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified production handoff
        uses: actions/upload-artifact@v4
        with:
          name: production-handoff-candidate-${{ needs.prepare.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-handoff-candidate.json
          if-no-files-found: error
          retention-days: 30
