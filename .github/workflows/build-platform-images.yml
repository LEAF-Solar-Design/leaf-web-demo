name: Build platform images

# ---------------------------------------------------------------------------
# Builds the three leaf-platform production images (app / broker / harness)
# in parallel from ONE commit and pushes all three to ECR at ONE tag:
# prod-<shortsha>. Each image has its own registry-backed Buildx cache.
# ECR tags are immutable, so cache publication uses buildcache-<shortsha> and
# never overwrites a tag. A push imports only its immediate predecessor's cache.
# Workflow dispatches and missing predecessor caches build without cache input.
#
# Cache retention contract: the AWS repository must expire buildcache-* tags
# after 14 days or retain no more than the latest 20 per repository. Production
# prod-* tags use a separate lifecycle and are never cache inputs or outputs.
# The deploy workflow in LEAF-Solar-Design/leaf-automation-aws-terraform
# refuses to deploy unless all three repos carry the tag, so a partial push
# here can never reach production.
#
# Auto-build, MANUAL promote: every push to main builds and pushes images;
# production deploys only happen when a human dispatches this workflow with
# promote=true (or dispatches deploy-service-production.yml directly in the
# terraform repo). Known gap, documented not skipped: leaf-platform has no
# staging environment yet, so pre-promote validation = the merged commit's
# gates plus the containerized smoke.
#
# Auth: OIDC via leaf-github-web-demo-ecr-push-role (AWS_ECR_PUSH_ROLE repo
# secret). That role can push to exactly the three leaf-platform-* ECR
# repositories and nothing else; it cannot touch ECS, IAM, or secrets.
# TERRAFORM_REPO_TOKEN (PAT with actions:write on the terraform repo) is
# only needed for the optional promote step.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional exact main commit or exact head of an open draft PR targeting main. Defaults to the workflow ref."
        type: string
        required: false
      promote:
        description: "Also trigger the production deploy in the terraform repo"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Serial main builds make the previous push's cache the normal input. GitHub
  # can replace an older pending run, so a missing predecessor remains valid
  # and falls back to an uncached build.
  group: build-platform-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      tag: ${{ steps.tag.outputs.value }}
      cache_tag: ${{ steps.tag.outputs.cache_value }}
      previous_cache_tag: ${{ steps.tag.outputs.previous_cache_value }}
      source_sha: ${{ steps.source.outputs.sha }}
      source_mode: ${{ steps.source.outputs.mode }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Require exact source to be reviewed
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_INPUT: ${{ inputs.promote }}
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          api_get() {
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/$1"
          }

          CURRENT_SHA=$(git rev-parse HEAD)
          SOURCE_MODE="main"
          if [[ ! "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checked-out source is not an exact commit."
            exit 1
          fi
          if [ -n "$SOURCE_SHA_INPUT" ]; then
            if [[ ! "$SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::source_sha must be a full 40-character lowercase hexadecimal commit."
              exit 1
            fi
            if [ "$CURRENT_SHA" != "$SOURCE_SHA_INPUT" ]; then
              echo "::error::Checkout did not resolve to source_sha."
              exit 1
            fi
          fi

          RESPONSE=$(api_get "repos/$GITHUB_REPOSITORY/compare/$CURRENT_SHA...main")
          MERGE_BASE=$(jq -r '.merge_base_commit.sha // empty' <<<"$RESPONSE")
          STATUS=$(jq -r '.status // empty' <<<"$RESPONSE")
          if [ "${MERGE_BASE,,}" != "$CURRENT_SHA" ] || \
             { [ "$STATUS" != "ahead" ] && [ "$STATUS" != "identical" ]; }; then
            SOURCE_MODE="draft-pr"
            PULLS=$(api_get "repos/$GITHUB_REPOSITORY/commits/$CURRENT_SHA/pulls")
            if ! jq -e --arg sha "$CURRENT_SHA" '
              any(.[];
                .state == "open"
                and .draft == true
                and .base.ref == "main"
                and (.head.sha | ascii_downcase) == $sha
              )
            ' <<<"$PULLS" >/dev/null; then
              echo "::error::Build source must be on main or the exact head of an open draft PR targeting main."
              exit 1
            fi
          fi
          if [ "$PROMOTE_INPUT" = "true" ] && [ "$SOURCE_MODE" != "main" ]; then
            echo "::error::Only a source commit on main may request production promotion."
            exit 1
          fi
          echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          echo "mode=$SOURCE_MODE" >> "$GITHUB_OUTPUT"

      - name: Validate image workflow invariants
        run: python scripts/test_build_platform_images_workflow.py

      - name: Derive immutable image tag
        id: tag
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_MODE: ${{ steps.source.outputs.mode }}
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          current_short="$(git rev-parse --short HEAD)"
          current_cache_tag="buildcache-$current_short"
          previous_cache_tag=""
          if [ "$SOURCE_MODE" = "draft-pr" ]; then
            image_tag="sha-$current_sha"
          else
            image_tag="prod-$current_short"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" \
            && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ \
            && ! "$BEFORE_SHA" =~ ^0+$ \
            && "$(git cat-file -t "$BEFORE_SHA" 2>/dev/null || true)" == "commit" ]]; then
            previous_short="$(git rev-parse --short "$BEFORE_SHA")"
            previous_cache_tag="buildcache-$previous_short"
          fi

          if [[ -n "$previous_cache_tag" \
            && "$previous_cache_tag" == "$current_cache_tag" ]]; then
            echo "::error::Current and previous cache tags must differ"
            exit 1
          fi

          echo "value=$image_tag" >> "$GITHUB_OUTPUT"
          echo "cache_value=$current_cache_tag" >> "$GITHUB_OUTPUT"
          echo "previous_cache_value=$previous_cache_tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        image: [app, broker, harness]

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 807034087062.dkr.ecr.us-east-1.amazonaws.com
      IMAGE_NAME: leaf-platform-${{ matrix.image }}
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
      CURRENT_CACHE_TAG: ${{ needs.prepare.outputs.cache_tag }}
      PREVIOUS_CACHE_TAG: ${{ needs.prepare.outputs.previous_cache_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GHA-BuildPlatform-${{ matrix.image }}-${{ github.run_id }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Select immutable cache references
        id: cache
        run: |
          set -euo pipefail
          cache_repo="$ECR_REGISTRY/$IMAGE_NAME"
          cache_from=""
          cache_to=""

          if [[ -n "$PREVIOUS_CACHE_TAG" ]]; then
            found="$(aws ecr batch-get-image \
              --repository-name "$IMAGE_NAME" \
              --image-ids "imageTag=$PREVIOUS_CACHE_TAG" \
              --query 'length(images)' \
              --output text 2>/dev/null || true)"
            if [[ "$found" == "1" ]]; then
              cache_from="type=registry,ref=$cache_repo:$PREVIOUS_CACHE_TAG"
            else
              echo "::notice::$IMAGE_NAME has no predecessor cache; building without cache input"
            fi
          fi

          if current_exists="$(aws ecr batch-get-image \
              --repository-name "$IMAGE_NAME" \
              --image-ids "imageTag=$CURRENT_CACHE_TAG" \
              --query 'length(images)' \
              --output text 2>/dev/null)"; then
            if [[ "$current_exists" == "1" ]]; then
              echo "::notice::$IMAGE_NAME cache $CURRENT_CACHE_TAG already exists; immutable tag will not be overwritten"
            else
              cache_to="type=registry,ref=$cache_repo:$CURRENT_CACHE_TAG,mode=max,image-manifest=true,oci-mediatypes=true"
            fi
          else
            echo "::warning::Unable to verify $CURRENT_CACHE_TAG; skipping cache publication"
          fi

          echo "from=$cache_from" >> "$GITHUB_OUTPUT"
          echo "to=$cache_to" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}

  verify:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 807034087062.dkr.ecr.us-east-1.amazonaws.com
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GHA-VerifyPlatformImages-${{ github.run_id }}

      - name: Verify all three repositories carry the immutable tag
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^(prod-[0-9a-f]{7,40}|sha-[0-9a-f]{40})$ ]]; then
            echo "::error::Refusing to verify an unapproved immutable tag: $TAG"
            exit 1
          fi
          declare -A digests
          for image in app broker harness; do
            repository="leaf-platform-$image"
            digest="$(aws ecr batch-get-image \
              --repository-name "$repository" \
              --image-ids "imageTag=$TAG" \
              --query 'images[0].imageId.imageDigest' \
              --output text)"
            if [[ -z "$digest" || "$digest" == "None" ]]; then
              echo "::error::$repository does not contain $TAG"
              exit 1
            fi
            digests["$image"]="$digest"
          done
          {
            echo "## Platform image set verified"
            echo ""
            echo "Tag: \`$TAG\` (all three of leaf-platform-app / broker / harness)"
            for image in app broker harness; do
              echo "- \`leaf-platform-$image@${digests[$image]}\`"
            done
            echo ""
            echo "Deploy via the terraform repo: deploy-service-production.yml with service=leaf-platform, image_tag=$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: [prepare, verify]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.promote &&
      needs.prepare.outputs.source_mode == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.TERRAFORM_REPO_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Trigger production deploy (manual opt-in only)
        run: |
          set -euo pipefail
          gh workflow run deploy-service-production.yml \
            -R LEAF-Solar-Design/leaf-automation-aws-terraform \
            -f service=leaf-platform \
            -f image_tag="$TAG"
          echo "Dispatched deploy-service-production.yml for leaf-platform at $TAG"
