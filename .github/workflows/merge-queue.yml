name: merge-queue

# ---------------------------------------------------------------------------
# Slice C of the merge-queue design (verdicts/merge-queue-design-astra.md,
# points 1, 2, 4, 7, 8). This is the GROUP-level controller: it never builds
# or deploys anything itself. mq-review proves every PR in the group's
# ordered prefix already carries a passing kimi-critic-review on its own
# head; mq-supply proves exactly one provider-bound speculative image set
# exists for the group's tree (or that the group is docs-only, in which case
# there is nothing to build); mq-prewarm proves the relay (slice B) staged
# every service the group needs and that the CodeBuild rail's deploy receipts
# confirm the staged task never touched weights, then it fails EXPLICITLY if
# either dependency failed or was cancelled, so a skipped job can never read
# as green.
#
# GitHub couples a PR's required checks with the merge queue's: the SAME two
# context names (mq-review, mq-prewarm) must exist on both a pull_request run
# and a merge_group run, or a PR can never satisfy its required checks well
# enough to enter the queue. On pull_request events mq-review decides
# admission from the newest kimi-critic-review status on the PR's own head,
# using the same reverse-then-sort_by(.created_at) tie-break the merge_group
# path proves at ~:146-170 (both arms are pinned byte-identical below, so
# they can never disagree), and mq-prewarm publishes a neutral "queue
# preparation deferred" success and does nothing else.
#
# R2 from the read of 58688301, ACKNOWLEDGED, NOT FIXED HERE: a pull_request
# run executes this workflow FILE from the PR's own head, so a PR could
# weaken or delete the decision step in its own branch and its mq-review
# check would pass green with no review anywhere. pull_request_target was
# tried and reverted: GitHub resolves a pull_request_target trigger from the
# DEFAULT BRANCH's copy of the workflow, so introducing it here (removing
# `pull_request:` on this PR's own branch while main still only declares
# `pull_request:`) meant mq-review and mq-prewarm never fired on THIS PR at
# all, empirically confirmed (zero check-runs of either name on c6732df8
# under either event). It would have broken every currently-open PR's
# admission the same way on merge, until each one saw a fresh push after
# main gained the new trigger. The real fix is the one the repo already uses
# for this class, the stable loader in scripts/ci/mq-codebuild-project.sh
# that pulls its script from origin/main: move the decision into the
# CodeBuild mq-review project, which no PR can edit. That is a separate
# change with its own spec and review. There is no status trigger: a
# status-triggered run's GITHUB_SHA is always the default branch tip, never
# the PR head, so it cannot correct a PR's own check run. A red mq-review
# clears the same way any other check does, by a re-run once the
# kimi-critic-review success is posted; the real staging work only ever runs
# for merge_group's checks_requested.
# ---------------------------------------------------------------------------

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: read
  checks: read

concurrency:
  # One head sha, one controller run. Never cancelled: a running group check
  # is proof-in-progress, and cancelling it would let a superseding event
  # race a still-open verdict rather than wait for it.
  group: merge-queue-${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  MQ_TRANSPORT_BUCKET: "leaf-mq-transport-807034087062-us-east-1"
  MQ_TRANSPORT_PREFIX: "mq/leaf-web-demo/"
  # The provider workflow mq-supply waits on, and the exact checks its
  # producer run must pass — read-only repeats of build-platform-images.yml's
  # own adopt.decide gate (its `adopt` job, ~line 2987): repository id, path,
  # event, branch, status, conclusion, then the immutable archive digest
  # verified against a real download.
  SUPPLY_PROVIDER_WORKFLOW_PATH: .github/workflows/build-platform-images.yml
  SUPPLY_SET_POLLS: "40"
  SUPPLY_SET_INTERVAL: "30"
  RELAY_RECEIPT_POLLS: "30"
  RELAY_RECEIPT_INTERVAL: "60"
  TERRAFORM_RECEIPT_POLLS: "40"
  TERRAFORM_RECEIPT_INTERVAL: "60"

jobs:
  mq-review:
    name: mq-review
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 20
    outputs:
      head_sha: ${{ steps.queue.outputs.head_sha }}
    steps:
      - name: Decide admission from the newest kimi-critic-review status (pull_request)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::mq-review: pull_request carries no usable head sha."; exit 1; }
          RAW=$(timeout 60 gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100") || {
            echo "::error::mq-review: kimi-critic-review status read failed for $HEAD_SHA; refusing to admit on an unreadable gate."
            exit 1
          }
          [ -n "$RAW" ] || {
            echo "::error::mq-review: kimi-critic-review status read for $HEAD_SHA returned an empty body; refusing to admit on an unreadable gate."
            exit 1
          }
          echo "$RAW" | jq -s 'add // []' > pr-statuses.json 2>/dev/null || {
            echo "::error::mq-review: kimi-critic-review status read for $HEAD_SHA returned unparsable JSON; refusing to admit on an unreadable gate."
            exit 1
          }
          # Newest by created_at, never the newest by list order: the
          # statuses API is not guaranteed sorted, and a plain sort_by is
          # stable, so two statuses sharing a created_at second would keep
          # list order and could pick the older one; reverse first so the
          # tie resolves to the newest.
          STATE=$(jq -r '[.[] | select(.context == "kimi-critic-review")] | reverse | sort_by(.created_at) | last | .state // "absent"' pr-statuses.json)
          if [ "$STATE" != "success" ]; then
            echo "::error::mq-review: this PR has no kimi-critic-review success on $HEAD_SHA; post a kimi-critic-review success on this head and re-run this check."
            exit 1
          fi
          echo "::notice::mq-review: queue preparation deferred until this PR enters the merge queue."

      - name: Read the live merge queue and resolve this group's members
        id: queue
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # Never infer members from head_ref alone: it names one PR, not the
          # group. The members are the ordered prefix of live queue entries
          # up to and including the entry whose headCommit.oid is our head.
          QUERY='query($owner:String!,$name:String!,$cursor:String){repository(owner:$owner,name:$name){mergeQueue(branch:"main"){entries(first:100,after:$cursor){pageInfo{hasNextPage endCursor}nodes{position baseCommit{oid}headCommit{oid}pullRequest{number headRefOid}}}}}}'
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY##*/}"
          echo "[]" > entries.json
          CURSOR="null"
          while :; do
            PAGE=$(timeout 60 gh api graphql -f query="$QUERY" -F owner="$OWNER" -F name="$NAME" -F cursor="$CURSOR") || {
              echo "::error::mq-review: GraphQL queue read failed."
              exit 1
            }
            jq -c '[.data.repository.mergeQueue.entries.nodes[]]' <<<"$PAGE" > page-nodes.json
            jq -c -s '.[0] + .[1]' entries.json page-nodes.json > entries.tmp && mv entries.tmp entries.json
            HAS_NEXT=$(jq -r '.data.repository.mergeQueue.entries.pageInfo.hasNextPage' <<<"$PAGE")
            [ "$HAS_NEXT" = "true" ] || break
            CURSOR=$(jq -r '.data.repository.mergeQueue.entries.pageInfo.endCursor' <<<"$PAGE")
          done
          jq -c 'sort_by(.position | tonumber)' entries.json > entries-sorted.json
          IDX=$(jq -r --arg head "$HEAD_SHA" '[.[] | .headCommit.oid] | index($head)' entries-sorted.json)
          if [ "$IDX" = "null" ]; then
            echo "::error::mq-review: group head $HEAD_SHA was not found in the live queue."
            exit 1
          fi
          jq -c --argjson idx "$IDX" '.[0:($idx + 1)]' entries-sorted.json > members.json
          cp members.json members-check.json
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "mq-review: group has $((IDX + 1)) member(s)."

      - name: Require the newest kimi-critic-review status on every member
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COUNT=$(jq 'length' members.json)
          [ "$COUNT" -gt 0 ] || { echo "::error::mq-review: group has no members."; exit 1; }
          i=0
          while [ "$i" -lt "$COUNT" ]; do
            MEMBER=$(jq -c ".[$i]" members.json)
            SHA=$(jq -r '.pullRequest.headRefOid' <<<"$MEMBER")
            NUMBER=$(jq -r '.pullRequest.number' <<<"$MEMBER")
            [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::mq-review: member #$NUMBER has no usable head sha."; exit 1; }
            timeout 60 gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses?per_page=100" \
              | jq -s 'add // []' > "statuses-$i.json"
            # Newest by created_at, never the newest by list order: the
            # statuses API is not guaranteed sorted, and a plain sort_by is
            # stable, so two statuses sharing a created_at second would keep
            # list order and could pick the older one; reverse first so the
            # newest of a tie wins. This arm and the pull_request arm above
            # are ONE rule: change them together or a PR admits on a tie the
            # group then ejects on.
            STATE=$(jq -r '[.[] | select(.context == "kimi-critic-review")] | reverse | sort_by(.created_at) | last | .state // "absent"' "statuses-$i.json")
            if [ "$STATE" != "success" ]; then
              echo "::error::mq-review: PR #$NUMBER ($SHA) newest kimi-critic-review state is '$STATE', not success."
              exit 1
            fi
            i=$((i + 1))
          done
          echo "mq-review: kimi-critic-review is success on all $COUNT member(s)."

      - name: Re-read the queue and require the same membership
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # A drift here (a member superseded or reordered while the checks
          # above ran) invalidates the verdict just proven: fail closed.
          QUERY='query($owner:String!,$name:String!,$cursor:String){repository(owner:$owner,name:$name){mergeQueue(branch:"main"){entries(first:100,after:$cursor){pageInfo{hasNextPage endCursor}nodes{position baseCommit{oid}headCommit{oid}pullRequest{number headRefOid}}}}}}'
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY##*/}"
          echo "[]" > entries-recheck.json
          CURSOR="null"
          while :; do
            PAGE=$(timeout 60 gh api graphql -f query="$QUERY" -F owner="$OWNER" -F name="$NAME" -F cursor="$CURSOR") || {
              echo "::error::mq-review: GraphQL post-check re-read failed."
              exit 1
            }
            jq -c '[.data.repository.mergeQueue.entries.nodes[]]' <<<"$PAGE" > page-nodes.json
            jq -c -s '.[0] + .[1]' entries-recheck.json page-nodes.json > entries-recheck.tmp && mv entries-recheck.tmp entries-recheck.json
            HAS_NEXT=$(jq -r '.data.repository.mergeQueue.entries.pageInfo.hasNextPage' <<<"$PAGE")
            [ "$HAS_NEXT" = "true" ] || break
            CURSOR=$(jq -r '.data.repository.mergeQueue.entries.pageInfo.endCursor' <<<"$PAGE")
          done
          jq -c 'sort_by(.position | tonumber)' entries-recheck.json > entries-recheck-sorted.json
          IDX=$(jq -r --arg head "$HEAD_SHA" '[.[] | .headCommit.oid] | index($head)' entries-recheck-sorted.json)
          if [ "$IDX" = "null" ]; then
            echo "::error::mq-review: group head $HEAD_SHA is no longer in the live queue."
            exit 1
          fi
          jq -c --argjson idx "$IDX" '.[0:($idx + 1)]' entries-recheck-sorted.json > members-recheck.json
          if ! diff -q \
              <(jq -c 'map({number: .pullRequest.number, headRefOid: .pullRequest.headRefOid, head: .headCommit.oid, position: .position})' members-check.json) \
              <(jq -c 'map({number: .pullRequest.number, headRefOid: .pullRequest.headRefOid, head: .headCommit.oid, position: .position})' members-recheck.json) \
              >/dev/null; then
            echo "::error::mq-review: queue membership drifted between the check read and the post-check re-read."
            exit 1
          fi
          echo "mq-review: post-check re-read confirms unchanged membership."

  mq-supply:
    name: mq-supply
    if: github.event_name == 'merge_group'
    needs: mq-review
    permissions:
      id-token: write
      contents: read
      actions: read
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 25
    outputs:
      supply: ${{ steps.docs.outputs.supply || steps.wait.outputs.supply }}
      tree: ${{ steps.tree.outputs.tree }}
      producer_run_id: ${{ steps.wait.outputs.producer_run_id }}
      producer_run_attempt: ${{ steps.wait.outputs.producer_run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve the group commit's tree
        id: tree
        run: |
          set -euo pipefail
          TREE=$(git rev-parse 'HEAD^{tree}')
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::mq-supply: checkout has no tree."; exit 1; }
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"

      - name: Recompute the docs-noop verdict over this group
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          echo "supply=" >> "$GITHUB_OUTPUT"
          if ! git rev-parse --verify --quiet 'HEAD^1' >/dev/null 2>&1; then
            echo "::notice::mq-supply: no first parent to diff; treating as build (fail open to building)."
            exit 0
          fi
          FILES=$(git diff --no-renames --name-only 'HEAD^1' HEAD) || {
            echo "::notice::mq-supply: could not read the group diff; treating as build."
            exit 0
          }
          VERDICT=$(printf '%s\n' "$FILES" | python3 scripts/docs_noop_filter.py) || VERDICT=build
          if [ "$VERDICT" = "skip" ]; then
            # Bound discovery to the newest matching run in one page. Missing
            # or unfinished evidence falls through to the supply-set wait.
            RUNS=$(timeout 60 gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&head_sha=$HEAD_SHA&per_page=100" 2>/dev/null || true)
            DISPATCH_RUN=$(jq -r --arg head "$HEAD_SHA" '
              [.workflow_runs[]?
               | select(.event == "merge_group" and .head_sha == $head)
               | select((.path | sub("@.*$"; "")) == ".github/workflows/speculate-platform-images.yml")]
              | sort_by(.created_at, .id) | last | .id // empty
            ' <<<"${RUNS:-{}}" 2>/dev/null || true)
            if [[ "$DISPATCH_RUN" =~ ^[0-9]+$ ]]; then
              JOBS=$(timeout 60 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DISPATCH_RUN/jobs?filter=latest&per_page=100" 2>/dev/null || true)
              DISPATCH_SKIPPED=$(jq -r '
                [.jobs[]? | select(.name == "dispatch-group" and .conclusion == "success")
                 | .steps[]? | select(.name == "Dispatch the merge-group build on the main ref")]
                | length == 1 and .[0].conclusion == "skipped"
              ' <<<"${JOBS:-{}}" 2>/dev/null || true)
              if [ "$DISPATCH_SKIPPED" = "true" ]; then
                echo "supply=none" >> "$GITHUB_OUTPUT"
                echo "::notice::mq-supply: reason=docs-only"
              fi
            fi
          fi

      - name: Assume the supply transport read role
        if: steps.docs.outputs.supply != 'none'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_MQ_PREWARM_READ_ROLE }}
          aws-region: us-east-1

      - name: Wait for the provider-bound speculative supply set
        id: wait
        if: steps.docs.outputs.supply != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          set -euo pipefail
          echo "supply=none" >> "$GITHUB_OUTPUT"
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          KEY="${MQ_TRANSPORT_PREFIX}supply-set/$TREE.json"
          REPO_ID=$(timeout 60 gh api "repos/$GITHUB_REPOSITORY" --jq .id)
          transport_error() {
            if grep -Eq 'AccessDenied|NoSuchBucket|\(403\)' s3-error.txt; then
              echo "::error::mq-supply: bucket $MQ_TRANSPORT_BUCKET unavailable; check the mq/leaf-web-demo/ transport policy."
              cat s3-error.txt
              exit 1
            fi
          }
          ATTEMPT=0
          while [ "$ATTEMPT" -lt "$SUPPLY_SET_POLLS" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            # List the exact key first: prefix-scoped ListBucket cannot prove absence via HeadObject.
            KEY_PRESENT=false
            if timeout 60 aws s3api list-objects-v2 --bucket "$MQ_TRANSPORT_BUCKET" --prefix "$KEY" --max-keys 1 > supply-list.json 2> s3-error.txt; then
              if jq -e --arg key "$KEY" 'any(.Contents[]?; .Key == $key)' supply-list.json >/dev/null; then
                KEY_PRESENT=true
              fi
            else
              S3_EXIT=$?
              transport_error
              echo "::notice::mq-supply: S3 listing returned $S3_EXIT."
            fi
            if [ "$KEY_PRESENT" = true ]; then
            if timeout 60 aws s3api head-object --bucket "$MQ_TRANSPORT_BUCKET" --key "$KEY" > supply-head.json 2> s3-error.txt; then
              CAND_RUN=$(jq -j '.Metadata["run-id"] // empty' supply-head.json)
              CAND_ATTEMPT=$(jq -j '.Metadata["run-attempt"] // empty' supply-head.json)
              CAND_SHA=$(jq -j '.Metadata["head-sha"] // empty' supply-head.json)
              if [[ "$CAND_RUN" =~ ^[0-9]+$ && "$CAND_ATTEMPT" =~ ^[0-9]+$ && "$CAND_SHA" =~ ^[0-9a-f]{40}$ ]] && \
                  jq -e --arg repo "$REPO_ID" --arg ref "$GITHUB_REPOSITORY/$SUPPLY_PROVIDER_WORKFLOW_PATH@refs/heads/main" '
                    .Metadata["repository-id"] == $repo and .Metadata["workflow-ref"] == $ref
                    and .Metadata.event == "workflow_dispatch"
                  ' supply-head.json >/dev/null; then
                RUN_RECORD=$(timeout 60 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAND_RUN" 2>/dev/null || true)
                if [ -n "$RUN_RECORD" ]; then
                  PATH_OK=$(jq -j --arg p "$SUPPLY_PROVIDER_WORKFLOW_PATH" '(.path // "" | sub("@.*$"; "")) == $p' <<<"$RUN_RECORD")
                  EVENT_OK=$(jq -j '.event == "workflow_dispatch"' <<<"$RUN_RECORD")
                  BRANCH_OK=$(jq -j '.head_branch == "main"' <<<"$RUN_RECORD")
                  STATUS_OK=$(jq -j '.status == "completed"' <<<"$RUN_RECORD")
                  CONCLUSION_OK=$(jq -j '.conclusion == "success"' <<<"$RUN_RECORD")
                  ATTEMPT_NUM=$(jq -j '.run_attempt' <<<"$RUN_RECORD")
                  REPO_OK=$(jq -j --argjson repo "$REPO_ID" '.repository.id == $repo and .head_repository.id == $repo' <<<"$RUN_RECORD")
                  if [ "$PATH_OK" = "true" ] && [ "$EVENT_OK" = "true" ] && [ "$BRANCH_OK" = "true" ] \
                      && [ "$STATUS_OK" = "true" ] && [ "$CONCLUSION_OK" = "true" ] \
                      && [ "$REPO_OK" = "true" ] && [ "$ATTEMPT_NUM" = "$CAND_ATTEMPT" ]; then
                    if timeout 60 aws s3api get-object --bucket "$MQ_TRANSPORT_BUCKET" --key "$KEY" --checksum-mode ENABLED spec-candidate.json > supply-get.json 2> s3-error.txt; then
                      EXPECTED_CHECKSUM=$(jq -j '.ChecksumSHA256 // empty' supply-get.json)
                      ACTUAL_CHECKSUM=$(openssl dgst -sha256 -binary spec-candidate.json | openssl base64 -A)
                      [ -n "$EXPECTED_CHECKSUM" ] && [ "$ACTUAL_CHECKSUM" = "$EXPECTED_CHECKSUM" ] || { echo "::error::mq-supply: S3 checksum mismatch."; exit 1; }
                      jq -e --arg tree "$TREE" --arg sha "$CAND_SHA" \
                        --argjson run "$CAND_RUN" --argjson attempt "$CAND_ATTEMPT" '
                        .release_source_tree == $tree and .release_source_revision == $sha
                        and .build_run_id == $run and .build_run_attempt == $attempt
                        and (.services | length == 5)
                        and all(.services[]; .producer_run_id == $run and .producer_run_attempt == $attempt
                          and .producer_source_revision == $sha and .producer_source_tree == $tree)
                      ' spec-candidate.json >/dev/null || { echo "::error::mq-supply: S3 body provenance mismatch."; exit 1; }
                      echo "supply=present" >> "$GITHUB_OUTPUT"
                      echo "producer_run_id=$CAND_RUN" >> "$GITHUB_OUTPUT"
                      echo "producer_run_attempt=$CAND_ATTEMPT" >> "$GITHUB_OUTPUT"
                      echo "mq-supply: provider-bound supply set verified after $ATTEMPT poll(s) (run $CAND_RUN)."
                      exit 0
                    else
                      S3_EXIT=$?
                      transport_error
                      echo "::notice::mq-supply: S3 read returned $S3_EXIT."
                    fi
                  fi
                fi
              fi
            else
              S3_EXIT=$?
              transport_error
              echo "::notice::mq-supply: S3 head returned $S3_EXIT."
            fi
            fi
            if [ "$ATTEMPT" -lt "$SUPPLY_SET_POLLS" ]; then
              sleep "$SUPPLY_SET_INTERVAL"
            fi
          done
          echo "::error::mq-supply: no exact provider-bound $KEY after $SUPPLY_SET_POLLS polls."
          exit 1

  mq-prewarm:
    name: mq-prewarm
    needs: [mq-review, mq-supply]
    if: always()
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 45
    # Queue refs assume their own read-only role without an environment.
    # The release role and ecr-release environment are for stage-group on main.
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Publish the deferred queue-preparation success (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          echo "::notice::mq-prewarm: queue preparation deferred until this PR enters the merge queue."

      - name: Fail explicitly on a failed or cancelled dependency
        if: >-
          github.event_name == 'merge_group' &&
          (needs.mq-review.result == 'failure' || needs.mq-review.result == 'cancelled' ||
           needs.mq-supply.result == 'failure' || needs.mq-supply.result == 'cancelled')
        run: |
          set -euo pipefail
          echo "::error::mq-prewarm: refusing to stage; mq-review=${{ needs.mq-review.result }} mq-supply=${{ needs.mq-supply.result }}."
          exit 1

      - name: Recognize a docs-only group
        id: docs
        if: github.event_name == 'merge_group' && needs.mq-supply.outputs.supply == 'none'
        run: |
          set -euo pipefail
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
          echo "::notice::mq-prewarm: reason=docs-only group: nothing to stage."

      - name: Assume the relay transport read role
        if: github.event_name == 'merge_group' && needs.mq-supply.outputs.supply == 'present'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_MQ_PREWARM_READ_ROLE }}
          aws-region: us-east-1

      - name: Wait for the relay's prewarm receipt for this group
        id: relay
        if: github.event_name == 'merge_group' && needs.mq-supply.outputs.supply == 'present'
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          [[ "$GROUP_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          SHA12="${GROUP_HEAD_SHA:0:12}"
          NAME="prewarm-relay-receipt-mg-$SHA12"
          PREFIX="${MQ_TRANSPORT_PREFIX}relay/$SHA12/"
          echo "present=false" >> "$GITHUB_OUTPUT"
          transport_error() {
            if grep -Eq 'AccessDenied|NoSuchBucket|\(403\)' s3-error.txt; then
              echo "::error::mq-prewarm: bucket $MQ_TRANSPORT_BUCKET unavailable; check the mq/leaf-web-demo/ transport policy."
              cat s3-error.txt
              exit 1
            fi
          }
          ATTEMPT=0
          while [ "$ATTEMPT" -lt "$RELAY_RECEIPT_POLLS" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            if LISTING=$(timeout 60 aws s3api list-objects-v2 --bucket "$MQ_TRANSPORT_BUCKET" --prefix "$PREFIX" 2> s3-error.txt); then
              NEWEST_KEY=$(jq -j '[.Contents[]?] | sort_by(.LastModified, .Key) | last | .Key // empty' <<<"$LISTING")
            else
              S3_EXIT=$?
              transport_error
              NEWEST_KEY=""
              echo "::notice::mq-prewarm: S3 listing returned $S3_EXIT."
            fi
            if [ -n "$NEWEST_KEY" ]; then
              [[ "$NEWEST_KEY" == "$PREFIX"* ]] || { echo "::error::mq-prewarm: foreign relay key."; exit 1; }
              SUFFIX="${NEWEST_KEY#"$PREFIX"}"
              [[ "$SUFFIX" =~ ^[0-9]+-[0-9]+\.json$ ]] || { echo "::error::mq-prewarm: invalid relay key."; exit 1; }
              if timeout 60 aws s3api head-object --bucket "$MQ_TRANSPORT_BUCKET" --key "$NEWEST_KEY" > relay-head.json 2> s3-error.txt; then
                mkdir -p relay-receipt
                if timeout 60 aws s3api get-object --bucket "$MQ_TRANSPORT_BUCKET" --key "$NEWEST_KEY" --checksum-mode ENABLED relay-receipt/prewarm-relay-receipt.json > relay-get.json 2> s3-error.txt; then
                  EXPECTED_CHECKSUM=$(jq -j '.ChecksumSHA256 // empty' relay-get.json)
                  ACTUAL_CHECKSUM=$(openssl dgst -sha256 -binary relay-receipt/prewarm-relay-receipt.json | openssl base64 -A)
                  [ -n "$EXPECTED_CHECKSUM" ] && [ "$ACTUAL_CHECKSUM" = "$EXPECTED_CHECKSUM" ] || { echo "::error::mq-prewarm: S3 checksum mismatch."; exit 1; }
                  CAND_RUN=$(jq -j '.Metadata["run-id"] // empty' relay-head.json)
                  CAND_ATTEMPT=$(jq -j '.Metadata["run-attempt"] // empty' relay-head.json)
                  [[ "$CAND_RUN" =~ ^[0-9]+$ && "$CAND_ATTEMPT" =~ ^[0-9]+$ ]] || { echo "::error::mq-prewarm: invalid relay metadata ids."; exit 1; }
                  [ "$SUFFIX" = "$CAND_RUN-$CAND_ATTEMPT.json" ] || { echo "::error::mq-prewarm: relay key metadata mismatch."; exit 1; }
                  REPO_ID=$(timeout 60 gh api "repos/$GITHUB_REPOSITORY" --jq .id)
                  jq -e --arg repo "$REPO_ID" --arg sha "$GROUP_HEAD_SHA" \
                    --arg ref "$GITHUB_REPOSITORY/.github/workflows/prewarm-staging-group.yml@refs/heads/main" '
                    .Metadata["repository-id"] == $repo and .Metadata["head-sha"] == $sha
                    and .Metadata["workflow-ref"] == $ref and .Metadata.event == "workflow_dispatch"
                  ' relay-head.json >/dev/null || { echo "::error::mq-prewarm: foreign relay metadata."; exit 1; }
                  RUN_RECORD=$(timeout 60 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAND_RUN")
                  jq -e --argjson repo "$REPO_ID" --argjson attempt "$CAND_ATTEMPT" '
                    (.path | sub("@.*$"; "")) == ".github/workflows/prewarm-staging-group.yml"
                    and .event == "workflow_dispatch" and .head_branch == "main"
                    and .run_attempt == $attempt and .repository.id == $repo and .head_repository.id == $repo
                  ' <<<"$RUN_RECORD" >/dev/null || { echo "::error::mq-prewarm: relay run provenance mismatch."; exit 1; }
                  jq -e --arg run "$CAND_RUN" --arg attempt "$CAND_ATTEMPT" '
                    .relay_run_id == $run and .relay_run_attempt == $attempt
                  ' relay-receipt/prewarm-relay-receipt.json >/dev/null || { echo "::error::mq-prewarm: relay body metadata mismatch."; exit 1; }
                  RECEIPT_HEAD=$(jq -j '.group.head_sha // empty' relay-receipt/prewarm-relay-receipt.json)
                  if [ "$RECEIPT_HEAD" = "$GROUP_HEAD_SHA" ]; then
                    MIGRATION_REFUSAL=$(jq -j 'if has("migration_refusal") then (.migration_refusal|tostring) else "false" end' relay-receipt/prewarm-relay-receipt.json)
                    echo "present=true" >> "$GITHUB_OUTPUT"
                    echo "migration_refusal=$MIGRATION_REFUSAL" >> "$GITHUB_OUTPUT"
                    if [ "$MIGRATION_REFUSAL" = "true" ]; then
                      echo "::notice::mq-prewarm: reason=migration candidate: normal deploy path"
                      exit 0
                    fi
                    python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          def fail(message):
              raise SystemExit("::error::mq-prewarm: " + message)

          relay = json.loads(Path("relay-receipt/prewarm-relay-receipt.json").read_text())
          if relay.get("producer") != "codebuild":
              fail("relay producer is not codebuild")
          if not isinstance(relay.get("relay_run_id"), str) or not re.fullmatch(r"[0-9]+", relay["relay_run_id"]):
              fail("invalid relay_run_id")
          entries = relay.get("dispatched")
          if not isinstance(entries, list) or not entries:
              fail("relay dispatched nothing for this group")
          dispatched = {}
          for entry in entries:
              if not isinstance(entry, dict):
                  fail("invalid dispatched entry for service <unknown>")
              service, build_id = entry.get("service"), entry.get("build_id")
              if (not isinstance(service, str) or not re.fullmatch(r"[a-z0-9][a-z0-9-]*", service)
                      or entry.get("disposition") != "dispatched"
                      or not isinstance(build_id, str)
                      or not re.fullmatch(r"leaf-deploy-terraform-staging:[0-9a-f-]{36}", build_id)):
                  fail(f"invalid dispatched build for service {service!r}")
              if service in dispatched:
                  fail(f"duplicate dispatched service {service}")
              dispatched[service] = build_id
          configured_services = relay.get("configured_services")
          if (not isinstance(configured_services, list) or not configured_services
                  or any(not isinstance(service, str)
                         or not re.fullmatch(r"[a-z0-9][a-z0-9-]*", service)
                         for service in configured_services)
                  or len(set(configured_services)) != len(configured_services)):
              fail("relay configured service list absent or unparsable")
          configured = set(configured_services)
          print("mq-prewarm: dispatched services: " + " ".join(sorted(dispatched)))
          print("mq-prewarm: configured services: " + " ".join(sorted(configured)))
          if set(dispatched) != configured:
              fail("relay dispatched services differ from configured services")
          Path("dispatched-map.json").write_text(json.dumps(dispatched))
          PY
                    echo "relay_run_id=$(jq -j .relay_run_id relay-receipt/prewarm-relay-receipt.json)" >> "$GITHUB_OUTPUT"
                    echo "dispatched_json=$(jq -c . dispatched-map.json)" >> "$GITHUB_OUTPUT"
                    echo "mq-prewarm: relay receipt $NAME verified after $ATTEMPT poll(s)."
                    exit 0
                  fi
                else
                  S3_EXIT=$?
                  transport_error
                  echo "::notice::mq-prewarm: S3 read returned $S3_EXIT."
                fi
              else
                S3_EXIT=$?
                transport_error
                echo "::notice::mq-prewarm: S3 head returned $S3_EXIT."
              fi
            fi
            if [ "$ATTEMPT" -lt "$RELAY_RECEIPT_POLLS" ]; then
              sleep "$RELAY_RECEIPT_INTERVAL"
            fi
          done
          echo "::error::mq-prewarm: no matching $NAME after $RELAY_RECEIPT_POLLS polls."
          exit 1

      - name: Configure AWS credentials for prewarm receipts
        if: >-
          github.event_name == 'merge_group' && needs.mq-supply.outputs.supply == 'present' &&
          steps.relay.outputs.present == 'true' && steps.relay.outputs.migration_refusal != 'true'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_MQ_PREWARM_READ_ROLE }}
          aws-region: us-east-1

      - name: Wait for every dispatched CodeBuild staging receipt
        if: >-
          github.event_name == 'merge_group' && needs.mq-supply.outputs.supply == 'present' &&
          steps.relay.outputs.present == 'true' && steps.relay.outputs.migration_refusal != 'true'
        env:
          TREE: ${{ needs.mq-supply.outputs.tree }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          DISPATCHED_JSON: ${{ steps.relay.outputs.dispatched_json }}
          RELAY_RUN_ID: ${{ steps.relay.outputs.relay_run_id }}
        run: |
          set -euo pipefail
          SHA12="${GROUP_HEAD_SHA:0:12}"
          EXPECTED_TAG="spec-$TREE-$SHA12"
          REQUEST_ID="$SHA12-$RELAY_RUN_ID"
          ARNS=""
          SERVICES=$(jq -ej 'keys | if length > 0 then join(" ") else error("empty dispatched set") end' <<<"$DISPATCHED_JSON")
          for SERVICE in $SERVICES; do
            BUILD_ID=$(jq -j --arg s "$SERVICE" '.[$s] // empty' <<<"$DISPATCHED_JSON")
            [[ "$BUILD_ID" =~ ^leaf-deploy-terraform-staging:[0-9a-f-]{36}$ ]] || { echo "::error::mq-prewarm: invalid dispatched build id for $SERVICE."; exit 1; }
            ATTEMPT=0
            FOUND=""
            while [ "$ATTEMPT" -lt "$TERRAFORM_RECEIPT_POLLS" ]; do
              ATTEMPT=$((ATTEMPT + 1))
              BUILD_RECORD=$(timeout 60 aws codebuild batch-get-builds --ids "$BUILD_ID" --output json)
              STATUS=$(jq -r '.builds[0].buildStatus // empty' <<<"$BUILD_RECORD")
              case "$STATUS" in
                SUCCEEDED) FOUND=true; break ;;
                IN_PROGRESS) ;;
                FAILED|FAULT|STOPPED|TIMED_OUT|*)
                  echo "::error::mq-prewarm: CodeBuild build $BUILD_ID for $SERVICE status '$STATUS', not SUCCEEDED."
                  exit 1 ;;
              esac
              if [ "$ATTEMPT" -lt "$TERRAFORM_RECEIPT_POLLS" ]; then
                sleep "$TERRAFORM_RECEIPT_INTERVAL"
              fi
            done
            [ "$FOUND" = "true" ] || { echo "::error::mq-prewarm: CodeBuild build $BUILD_ID for $SERVICE never completed after $TERRAFORM_RECEIPT_POLLS polls."; exit 1; }
            LOG_GROUP=$(jq -er '.builds[0].logs.groupName | select(type == "string" and length > 0)' <<<"$BUILD_RECORD")
            LOG_STREAM=$(jq -er '.builds[0].logs.streamName | select(type == "string" and length > 0)' <<<"$BUILD_RECORD")
            TOKEN=""
            COMPLETE=false
            : > receipt-lines.txt
            for ((PAGE=0; PAGE<200; PAGE++)); do
              TOKEN_ARGS=()
              [ -z "$TOKEN" ] || TOKEN_ARGS=(--next-token "$TOKEN")
              LOG_PAGE=$(timeout 60 aws logs get-log-events --log-group-name "$LOG_GROUP" \
                --log-stream-name "$LOG_STREAM" --start-from-head "${TOKEN_ARGS[@]}" --output json)
              jq -r '.events[]? | .message | split("\n")[] | select(startswith("LEAF_DEPLOY_RECEIPT "))' \
                <<<"$LOG_PAGE" >> receipt-lines.txt
              NEXT_TOKEN=$(jq -er '.nextForwardToken | select(type == "string" and length > 0)' <<<"$LOG_PAGE")
              if [ "$NEXT_TOKEN" = "$TOKEN" ]; then
                COMPLETE=true
                break
              fi
              TOKEN="$NEXT_TOKEN"
            done
            [ "$COMPLETE" = "true" ] || { echo "::error::mq-prewarm: log pagination exceeded 200 pages for $SERVICE."; exit 1; }
            [ -s receipt-lines.txt ] || { echo "::error::mq-prewarm: no LEAF_DEPLOY_RECEIPT line for $SERVICE."; exit 1; }
            # The last receipt supersedes earlier refusals in this build's log.
            tail -n 1 receipt-lines.txt | sed 's/^LEAF_DEPLOY_RECEIPT //' > staged-prewarm-receipt.json
            RECEIPT=staged-prewarm-receipt.json
            jq -e -s 'length == 1 and (.[0] | type == "object")' "$RECEIPT" >/dev/null || { echo "::error::mq-prewarm: invalid receipt JSON for $SERVICE."; exit 1; }
            REC_SERVICE=$(jq -j '.service // empty' "$RECEIPT")
            REC_TAG=$(jq -j '.image_tag // empty' "$RECEIPT")
            REC_WEIGHTS=$(jq -j 'if has("weights_touched") then (.weights_touched|tostring) else "missing" end' "$RECEIPT")
            REC_SCHEMA=$(jq -j '.schema // empty' "$RECEIPT")
            REC_RUN_ID=$(jq -j '.run_id | tostring' "$RECEIPT")
            [ "$REC_SCHEMA" = "leaf.staging-prewarm-receipt.v1" ] || { echo "::error::mq-prewarm: schema mismatch ($REC_SCHEMA)."; exit 1; }
            [ "$REC_RUN_ID" = "$REQUEST_ID" ] || { echo "::error::mq-prewarm: run_id mismatch ($REC_RUN_ID != $REQUEST_ID)."; exit 1; }
            [ "$REC_SERVICE" = "$SERVICE" ] || { echo "::error::mq-prewarm: service mismatch ($REC_SERVICE)."; exit 1; }
            [ "$REC_TAG" = "$EXPECTED_TAG" ] || { echo "::error::mq-prewarm: image_tag mismatch ($REC_TAG != $EXPECTED_TAG)."; exit 1; }
            [ "$REC_WEIGHTS" = "false" ] && jq -e '.weights_touched == false' "$RECEIPT" >/dev/null || { echo "::error::mq-prewarm: weights_touched is '$REC_WEIGHTS', not false."; exit 1; }
            jq -e --arg build_id "$BUILD_ID" '.producer.kind == "codebuild" and .producer.build_id == $build_id' "$RECEIPT" >/dev/null || { echo "::error::mq-prewarm: producer mismatch for $SERVICE."; exit 1; }
            ARN=$(jq -j '.staged_td_arn | select(type == "string") | select(startswith("arn:aws:ecs:"))' "$RECEIPT")
            [ -n "$ARN" ] || { echo "::error::mq-prewarm: empty or invalid staged task definition ARN for $SERVICE."; exit 1; }
            ARNS="${ARNS:+$ARNS }$ARN"
          done
          [ -n "$ARNS" ] || { echo "::error::mq-prewarm: empty staged task definition ARN list."; exit 1; }
          echo "mq-prewarm: staged task definitions: $ARNS"
