name: Contract

# ---------------------------------------------------------------------------
# The repo's first structural safety check over .github/workflows/ itself.
#
# Mirrors the intent of the tf apply-safety-contract.yml: real assertions
# parsed from workflow YAML (not text/regex sniffing), proven RED by mutation
# so a rubber-stamp check never lands. Scoped to what lwd workflows must
# hold: every workflow parses as YAML with no duplicate mapping keys, every
# job declares runs-on (or uses: for a reusable call), and no workflow grants
# permissions: write-all anywhere. tests/test_contract_workflow_shape.py also
# binds this file's own shape: pull_request trigger, job id `contract`, and
# no concurrency block.
#
# Deliberately carries NO concurrency block (the tf immune pattern) -- do NOT
# copy test-gate.yml's cancel-in-progress: true + per-PR group here.
#
# KNOWN LIMIT (PIPE-11, escalation_tier 1): this workflow lives under
# .github/workflows/, so the PR that adds it cannot be checked by its own
# not-yet-existing `contract` status. Merging it needs a one-time operator
# admin action; every PR after this one gets the real signal.
# ---------------------------------------------------------------------------

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract test dependencies
        run: python -m pip install pytest "PyYAML>=6"
      - name: Run workflow shape contract
        # PYTHONSAFEPATH keeps the repo root off sys.path[0]: the repo's own
        # platform/ package (platform/__init__.py) otherwise shadows stdlib
        # platform and crashes pytest at import (uuid -> platform.system).
        env:
          PYTHONSAFEPATH: "1"
        run: python -m pytest -q tests/test_contract_workflow_shape.py
