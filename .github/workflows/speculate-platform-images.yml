name: Speculate platform images

# ---------------------------------------------------------------------------
# Dispatches a speculative image build for every update of a same-repository
# PR targeting main (lane L5, operator decision D3, 2026-08-05). The real
# build runs in build-platform-images.yml as a workflow_dispatch on the MAIN
# ref, for two load-bearing reasons:
#
#   * the ECR push role's OIDC trust policy admits exactly one subject —
#     this repository at ref:refs/heads/main — so a pull_request-event build
#     could never authenticate;
#   * a dispatch on main runs MAIN's workflow text, so a PR cannot edit the
#     build that handles the push role and the solver deploy key. This
#     dispatcher itself needs no secret at all.
#
# The dispatched run builds the PR's MERGE PREVIEW and pushes spec-<tree>
# tags no deploy workflow accepts; the push-to-main run adopts them only
# after the gate's tree-bound proof matches. See
# docs/SPECULATIVE-PR-BUILDS.md.
#
# Docs-only PRs are not dispatched: their merge no-ops the whole build
# train (the noop gate in build-platform-images.yml), so speculative images
# for them can never be adopted — five builds per PR update for nothing.
# The decision reuses scripts/docs_noop_filter.py against the exact merge
# delta (preview vs its first parent, rename detection disabled) and FAILS
# OPEN to dispatching: an unfetchable preview, a failed diff, or a garbled
# verdict dispatches normally, mirroring the merge-side gate's posture.
#
# Fork PRs are skipped: they cannot be speculatively built (no OIDC, no
# adoption trust) and the build workflow re-validates same-repo origin
# against the pulls API anyway. Failures here cost only the speculation —
# the merge run falls back to the full build.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  # Lets github.token dispatch build-platform-images.yml in this repository.
  actions: write

concurrency:
  group: speculate-platform-images-${{ github.event_name == 'merge_group' && format('mg-{0}', github.event.merge_group.head_sha) || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The preview checkout only feeds the docs-only decision; it is
      # absorbed so a conflicted or still-computing preview cannot redden
      # the PR — the decide step then fails open and dispatches.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Dispatch the speculative build on the main ref
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::PR head is not an exact commit."
            exit 1
          }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || {
            echo "::error::PR number is invalid."
            exit 1
          }
          # Docs-only skip, FAIL-OPEN to dispatching: the diff below is the
          # exact merge delta (preview vs the main tip it merged onto), the
          # same basis the merge-side noop gate uses, with rename detection
          # disabled for the same reason (a rename reports only its
          # destination). Every abnormal path leaves DISPATCH=true.
          #
          # The filter EXECUTES from the TRUSTED first parent (the main tip
          # the preview merged onto), never from the PR-controlled preview
          # checkout: this step's env carries GH_TOKEN with actions:write,
          # so running preview-authored code here would hand a same-repo PR
          # that token before merge — the exact boundary the dispatch
          # indirection exists to hold. Only the FILE LIST is PR-derived,
          # and the filter treats stdin strictly as data.
          DISPATCH=true
          if git rev-parse --verify --quiet 'HEAD^1' >/dev/null 2>&1 \
            && git show 'HEAD^1:scripts/docs_noop_filter.py' \
              > "$RUNNER_TEMP/docs_noop_filter.py" 2>/dev/null; then
            if FILES=$(git diff --no-renames --name-only HEAD^1 HEAD 2>/dev/null); then
              if VERDICT=$(printf '%s\n' "$FILES" | python3 "$RUNNER_TEMP/docs_noop_filter.py" 2>/dev/null); then
                if [ "$VERDICT" = "skip" ]; then
                  echo "::notice::PR #$PR_NUMBER changes documentation only; its merge will no-op the build train, so there is nothing worth speculating."
                  DISPATCH=false
                fi
              fi
            fi
          fi
          if [ "$DISPATCH" != "true" ]; then
            exit 0
          fi
          # Soft-fail: speculation is an optimization. A failed dispatch
          # (e.g. main's workflow predates the speculative inputs while this
          # PR introduces them) must not redden the PR; the merge run simply
          # falls back to the full build.
          if gh workflow run build-platform-images.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "source_sha=$HEAD_SHA" \
            -f "speculative=true" \
            -f "speculative_pr_number=$PR_NUMBER"; then
            echo "Dispatched a speculative build of PR #$PR_NUMBER at $HEAD_SHA."
          else
            echo "::warning::Speculative dispatch failed; the merge run will fall back to a full build."
          fi

  dispatch-group:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Dispatch the merge-group build on the main ref
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Merge-group head is not an exact commit."
            exit 1
          }
          # Only the file list comes from the candidate. Execute the filter
          # from its trusted first parent, with the same fail-open posture.
          DISPATCH=true
          if git rev-parse --verify --quiet 'HEAD^1' >/dev/null 2>&1 \
            && git show 'HEAD^1:scripts/docs_noop_filter.py' \
              > "$RUNNER_TEMP/docs_noop_filter.py" 2>/dev/null; then
            if FILES=$(git diff --no-renames --name-only HEAD^1 HEAD 2>/dev/null); then
              if VERDICT=$(printf '%s\n' "$FILES" | python3 "$RUNNER_TEMP/docs_noop_filter.py" 2>/dev/null); then
                if [ "$VERDICT" = "skip" ]; then
                  echo "::notice::Merge group changes documentation only; skipping speculation."
                  DISPATCH=false
                fi
              fi
            fi
          fi
          if [ "$DISPATCH" != "true" ]; then
            exit 0
          fi
          if gh workflow run build-platform-images.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "source_sha=$HEAD_SHA" \
            -f "speculative=true" \
            -f "speculative_group_head=$HEAD_SHA"; then
            echo "Dispatched a speculative build of merge group $HEAD_SHA."
          else
            echo "::warning::Speculative dispatch failed; the merge run will fall back to a full build."
          fi
