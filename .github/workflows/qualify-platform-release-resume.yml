name: Qualify dormant platform release resume plan

on:
  workflow_dispatch:
    inputs:
      release_train_json:
        description: Closed fixture or captured release-train evidence JSON
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qualify-platform-release-resume-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Compile a non-executable resume plan
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile the closed plan without dispatch authority
        id: compile
        shell: bash
        env:
          RELEASE_TRAIN_JSON: ${{ inputs.release_train_json }}
        run: |
          set -euo pipefail
          set +e
          printf '%s' "$RELEASE_TRAIN_JSON" |
            python3 scripts/platform_release_train.py \
              --input - \
              --output "$RUNNER_TEMP/platform-release-resume-plan.json"
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 78
          python3 - "$RUNNER_TEMP/platform-release-resume-plan.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert plan["schema"] == "leaf.platform-release-resume-plan.v1"
          assert plan["status"] in {"ready", "complete", "stopped"}
          assert plan["dispatch_authorized"] is False
          with Path("resume-summary.txt").open("w", encoding="utf-8") as output:
              output.write(f"status={plan['status']}\n")
              output.write(f"code={plan['code']}\n")
              output.write(f"action_count={len(plan['actions'])}\n")
          PY

      - name: Upload the safe plan and summary
        uses: actions/upload-artifact@v4
        with:
          name: dormant-platform-release-resume-plan-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/platform-release-resume-plan.json
            resume-summary.txt
          if-no-files-found: error
          retention-days: 7

      - name: Report the dormant boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "The output is a fixture/replay plan with dispatch_authorized=false."
          echo "No credential, cloud API, deployment selector, or live resource was used."
