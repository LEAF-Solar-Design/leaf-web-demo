name: Prewarm staging cutover

# Queue-mode cutover, 2026-09-05: PR approval, label and synchronize events
# report retirement only. The merge-group dispatcher invokes the main-ref
# group relay, which owns prewarming the queue candidate.
# Unmerged PR closes still descale old PR stages through the terraform reaper.
# Keep the default-branch PR triggers for that token-bearing cleanup path.
on:
  workflow_dispatch:
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [synchronize, labeled, closed]
    branches: [main]
  # The queue's own stage: a merge group's head already has main folded in
  # (first parent == base), so its speculative supply set is built against the
  # exact tree the merge will use. `checks_requested` is the only type GitHub
  # sends for a queued group; there is no group-destroyed event (see the
  # descale job's comment). PR triggers now report retirement or clean up
  # old stages; only the group relay stages new candidates.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  # Listing this repository's speculative supply-set artifacts.
  actions: read
  pull-requests: read

concurrency:
  # Newest-wins per PR for staging (a superseded stage is pointless work), but
  # a close/descale must never be cancelled by anything. A merge group has no
  # PR number, so group events and their main-ref stages use head-sha keys.
  group: >-
    ${{ github.event_name == 'merge_group'
    && format('prewarm-staging-cutover-mg-dispatch-{0}', github.event.merge_group.head_sha)
    || format('prewarm-staging-cutover-{0}-{1}', github.event.pull_request.number, github.event.action == 'closed' && 'descale' || 'stage') }}
  cancel-in-progress: ${{ github.event_name == 'merge_group' || github.event.action != 'closed' }}

env:
  INFRA_REPO: LEAF-Solar-Design/leaf-automation-aws-terraform
  DEPLOY_WORKFLOW: deploy-leaf-platform-staging.yml
  REAPER_WORKFLOW: reap-leaf-platform-staging-prewarm-stages.yml
  STAGE_LABEL: stage-cutover
  # Paths whose change makes a candidate unstageable (design §4).
  MIGRATION_SURFACE: "platform/migrations/ platform/db.py"
  # WHICH SERVICES MAY BE STAGED. `web` and `app` are the two colour-surfaced
  # services; deploy-leaf-platform-staging.yml admits exactly those under
  # deploy_mode=prewarm and refuses every other service there.
  # `app` was withheld from 2026-08-17 to 2026-09-05 because its deploy job
  # ran on the single [self-hosted, linux, x64] runner, and a run holds the
  # shared leaf-platform-staging-ecs-mutation group from the moment it ENTERS
  # the group, including while its job waits for a runner: the first relayed
  # app prewarm (32065440036) and its web sibling (32065421731) sat pending 25
  # and 44 minutes behind an unrelated iOS capture job and were cancelled.
  # Since 2026-08-24 that job runs on an ephemeral CodeBuild-backed runner
  # (codebuild-leaf-gha-runner-platform-deploy-<run_id>-<attempt>, one per
  # run, BUILD_GENERAL1_LARGE); measured 2026-09-05 over nine consecutive app
  # relays, the deploy job waited 0.4 min for its runner every time, so the
  # runner no longer serialises anything. What still serialises is the group
  # itself: an app prewarm holds it for its own deploy (about 9 min measured)
  # and a real deploy arriving inside that window waits, exactly as it already
  # does behind a web prewarm; the deploy workflow's prewarm-yield job keeps a
  # prewarm from ever STARTING ahead of a queued real deploy. Cost: about 9
  # CodeBuild minutes on general1.large at $0.02/min, about $0.18 per app
  # prewarm (operator-approved 2026-09-05).
  # HISTORY: app was staged (#1055), paused because the posture gate refused
  # a prewarm over an open drawing-write lane (#1058),
  # restored once terraform #1474 taught the posture gate that an idle
  # weight-0 prewarm is not a forward deploy over an open lane (#1060), then
  # paused again (#1067, #1068) because the stage was taken on the PR's merge
  # PREVIEW and a busy main could move out from under it before the real
  # merge, leaving no speculative supply set for the merge's actual tree. The
  # merge group closes that gap: its head's first parent is checked equal to
  # its live queue base, so the group's exact tree is fresh at stage time.
  # Later invalidation or replay is still possible.
  # Keep this environment mirror aligned with the group relay, the sole
  # producer of new stages after PR-mode retirement.
  STAGE_SERVICES: "web app"
  # Bounded wait for the speculative supply set: 20 polls x 30s.
  SUPPLY_SET_POLLS: "20"
  SUPPLY_SET_INTERVAL: "30"

jobs:
  guard-ref:
    name: Refuse dispatches outside main
    if: github.event_name == 'workflow_dispatch'
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    permissions: {}
    steps:
      - name: Require the main workflow ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This relay must run from refs/heads/main."
            exit 1
          fi

  dispatch-group:
    name: Dispatch the group relay from main
    if: github.event_name == 'merge_group'
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the main-ref group relay
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if ! gh workflow run prewarm-staging-group.yml --repo "$GITHUB_REPOSITORY" --ref main -f "group_head_sha=$HEAD_SHA"; then
            echo "::warning::Prewarm dispatch for merge group failed; the merge deploy will warm normally."
          fi

  stage:
    name: PR-mode staging retired
    if: (github.event_name == 'pull_request_review' || github.event_name == 'pull_request_target') && github.event.action != 'closed'
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Report queue-mode cutover
        run: |
          echo "::notice::PR-mode staging retired 2026-09-05: the merge queue builds the group commit; see merge-queue.yml"
          exit 0


  descale:
    name: Descale the stage a closed PR left behind
    # Only an UNMERGED close needs this. A merged PR's stage is consumed by the
    # merge deploy (adopted on a document match, overwritten otherwise), so
    # descaling it would remove capacity the deploy is about to use.
    # PR-ONLY, explicitly. GitHub Actions delivers no "merge group destroyed" event.
    # A dropped group's stage has no close to react to at all, so it is
    # left entirely to the terraform TTL reaper (the existing bound). Adding a
    # descale path here for a group would be pretending an event exists that
    # does not.
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == false
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 10
    steps:
      - name: Find this PR's last relayed candidate
        id: staged
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "witness=" >> "$GITHUB_OUTPUT"
          # The relay receipt is the only record of WHICH candidate this PR
          # staged. No receipt means this PR never staged anything, or its
          # receipt aged out — either way the TTL reaper is the backstop and
          # there is nothing precise to ask for here.
          NAME="prewarm-relay-receipt-pr-$PR_NUMBER"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" > artifacts.json 2>/dev/null; then
            echo "::warning::Could not list artifacts; leaving the stage to the TTL reaper."
            exit 0
          fi
          NEWEST=$(jq -r '
            [.artifacts[]? | select(.expired == false)]
            | sort_by(.created_at) | last | .id // empty' artifacts.json)
          if [ -z "$NEWEST" ]; then
            echo "::notice::No unexpired relay receipt for PR #$PR_NUMBER; nothing precise to descale."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$NEWEST/zip" > receipt.zip 2>/dev/null || {
            echo "::warning::Could not download the relay receipt; leaving the stage to the TTL reaper."
            exit 0
          }
          unzip -o -q receipt.zip -d receipt || {
            echo "::warning::Relay receipt archive is unreadable; leaving the stage to the TTL reaper."
            exit 0
          }
          WITNESS=$(jq -r '.image_tag // empty' receipt/prewarm-relay-receipt.json)
          if [[ ! "$WITNESS" =~ ^spec-[0-9a-f]{40}-[0-9a-f]{12}$ ]]; then
            echo "::notice::Relay receipt carries no usable spec witness; leaving the stage to the TTL reaper."
            exit 0
          fi
          echo "witness=$WITNESS" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER last staged $WITNESS."

      - name: Ask the reaper to remove exactly that stage
        if: steps.staged.outputs.witness != ''
        env:
          GH_TOKEN: ${{ secrets.TERRAFORM_REPO_TOKEN }}
          WITNESS: ${{ steps.staged.outputs.witness }}
        run: |
          set -euo pipefail
          # The reaper owns every safety property (weight-0 refusal,
          # TD-equality ownership, readback); witness_tag only tells it WHICH
          # stage to consider without waiting out the TTL. A failed dispatch is
          # a warning, never a failure: the TTL sweep reaps it within the hour.
          if gh workflow run "$REAPER_WORKFLOW" \
              --repo "$INFRA_REPO" \
              --ref main \
              -f "mode=reap" \
              -f "witness_tag=$WITNESS"; then
            echo "Asked the reaper to descale $WITNESS."
          else
            echo "::warning::Targeted descale dispatch failed; the TTL sweep remains the backstop."
          fi
