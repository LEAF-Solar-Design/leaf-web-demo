name: Dispatch staging deploys

# ---------------------------------------------------------------------------
# Auto-dispatches the leaf-platform staging deploys (web + app, concurrently)
# when a main-branch "Build platform images" push run succeeds. Removes the
# hand-dispatch gap between build success and deploy start.
#
# The image tag is read from the build run's own staging supply-set manifest
# artifact (leaf.staging-supply-set.v1, field build_tag), never re-derived,
# so the deployed tag is exactly the tag the build recorded.
#
# Ordering guard: deploys dispatch only while the built commit is still the
# tip of main (latest-main-only staging). An older overlapping build can never
# roll staging backwards; if the newer commit's own build fails, staging stays
# on its previous deploy until the next successful main build.
#
# Docs-only no-op: a docs-only push's build run succeeds without building
# (its noop gate skips the graph) and publishes a docs-noop marker artifact
# instead of a supply set. Marker-without-manifest means RECONCILE, not skip
# (see below); manifest-and-marker both absent stays a hard error, because a
# successful build with no supply set means a partial run.
#
# Reconcile mode (2026-08-07) closes the residual PR #497 documented rather
# than hid. A relay that stands down after one service went live leaves
# staging split, and the newer commit's relay converges it ONLY if that
# commit builds images — a docs-only commit builds none, so the split used to
# survive until the next deployable merge. A docs-only merge landing inside
# web's ~8-minute deploy is not rare here. So the docs-only arm no longer
# exits: it asks whether the two services run the same image and, if not,
# moves the behind one FORWARD onto the ahead one's tag, through the same
# watched, one-at-a-time, fail-loudly loop the release path uses.
#
# Reconcile WAITS for the deploy workflow to go quiet before reading anything.
# Without that it misses the split it exists to close: a docs-only build
# finishes in a minute or two while the release it landed on top of takes ~8
# minutes per service, so both services still show their pre-release tag,
# reconcile calls that converged, and the stood-down relay's split is left
# with nobody to fix it. Observed shape, not hypothetical: infra run 31144173570
# deployed web (prod-d9306c3) at 03:22 on 2026-08-07 and no app deploy of that
# tag was ever dispatched; staging ran mixed for about two hours until the next
# CODE merge (prod-48204c4) happened to converge it.
#
# Which tag each service runs is read from the infra deploy workflow's own
# run-name ("Deploy leaf-platform staging <service> (<image_tag|sha|live
# baseline>)"), the contract this relay already depends on to find its runs —
# no new contract and no AWS credential. The NEWEST successful run per
# service is taken unconditionally, never the newest one that happens to
# carry a prod tag: a manual build-from-source or live-baseline recovery
# deploy names itself with a sha or a literal, and skipping past it would
# read a service as older than it is and reconcile it BACKWARDS.
#
# The target is then chosen by ANCESTRY (compare/<web>...<app>), never by
# recency, so "never deploy a tag older than what a service already runs" is
# proven rather than assumed. Anything undecidable — an unreadable live tag,
# a non-prod tag, two unrelated tags — is RED. Guessing there is precisely
# the silent backwards deploy the whole design exists to prevent, and the
# documented recovery (manual dispatch with an exact task-definition ARN) is
# the right owner for it.
#
# Reconcile runs the SAME per-attempt ungated tip re-check, so it stands down
# for a newer commit exactly as the release path does. A stand-down there
# leaves the split in place, but that is now bounded by the same convergence
# argument: whichever commit is the tip either releases both services or
# reconciles them.
#
# Rerun semantics: rerunning a successful build (or this relay) deploys
# both services again, deliberately. The deploys register a fresh task
# definition revision of the same images.
#
# One service at a time, and each one PROVEN to land. The infra repo funnels
# every staging mutation through ONE concurrency group
# (leaf-platform-staging-ecs-mutation, shared by 39 workflows) so no sampled
# digest can change before a release identity reaches the live app. GitHub
# keeps at most ONE pending run per group and a newly queued run CANCELS the
# previously pending one, so firing both deploys two seconds apart made the
# second evict the first whenever the lock was already busy: 4 merges between
# 2026-08-05 and 2026-08-06 deployed only one of their two services, silently,
# because this relay used to dispatch and exit without ever reading an
# outcome. Dispatching serially keeps at most one of our runs queued, and
# watching each run to a terminal state is what makes a lost deploy loud.
#
# A run cancelled before any job started never reached AWS, so eviction is a
# queueing loss rather than a deploy failure and is the one conclusion this
# relay retries. Every other non-success fails the relay red.
#
# Dispatch auth: TERRAFORM_REPO_TOKEN (PAT, workflow_dispatch on the infra
# repo) — the same pattern the aws-* service repos use with
# deploy-service-staging.yml. The deploys themselves run in
# LEAF-Solar-Design/leaf-automation-aws-terraform with its own review gates.
#
# Rollback: delete this file (or revert its PR). Manual workflow_dispatch of
# deploy-leaf-platform-staging.yml with an exact task-definition ARN is
# unchanged and remains the recovery path.
# ---------------------------------------------------------------------------

on:
  workflow_run:
    workflows: ["Build platform images"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: dispatch-staging-deploys-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # The relay now watches both deploys to completion (observed: ~8 min for
    # web, ~14 min for app, plus time queued behind the shared staging lock).
    # Comfortably above the step's own 95-minute deadline so the step reports
    # WHICH service was left undeployed instead of dying to a job timeout.
    timeout-minutes: 105

    env:
      INFRA_REPO: LEAF-Solar-Design/leaf-automation-aws-terraform
      DEPLOY_WORKFLOW: deploy-leaf-platform-staging.yml
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      BUILD_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Skip when the built commit is no longer the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$MAIN_SHA" != "$BUILD_HEAD_SHA" ]; then
            echo "::notice::main moved to $MAIN_SHA past built $BUILD_HEAD_SHA; skipping (latest-main-only staging: the next successful main build deploys)."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the exact image tag from the build's supply-set manifest
        id: manifest
        if: steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="staging-supply-set-$BUILD_HEAD_SHA-attempt-$BUILD_RUN_ATTEMPT"
          NOOP_NAME="docs-noop-$BUILD_HEAD_SHA-attempt-$BUILD_RUN_ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" \
            > artifacts.json
          ARTIFACT_ID=$(jq -r --arg name "$ARTIFACT_NAME" '
            first(.artifacts[] | select(.name == $name)).id // empty
          ' artifacts.json)
          if [ -z "$ARTIFACT_ID" ]; then
            # No supply set. A deliberate docs-only no-op run publishes a
            # marker instead; that hands the dispatch step a RECONCILE job
            # (no build tag: it resolves its own target from live state).
            # Skipping here is what let a split left by an earlier relay's
            # stand-down survive to the next deployable merge. Anything else
            # is still a loud failure: a successful build without a manifest
            # means a partial run and must never be silently swallowed.
            if jq -e --arg name "$NOOP_NAME" \
              'any(.artifacts[]; .name == $name)' artifacts.json >/dev/null; then
              echo "::notice::Build run $BUILD_RUN_ID was a docs-only no-op; no images were built, so this relay reconciles staging instead of releasing."
              {
                echo "deploy=true"
                echo "mode=reconcile"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Supply-set artifact $ARTIFACT_NAME not found and no $NOOP_NAME marker present."
            exit 1
          fi
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Supply-set artifact ID '$ARTIFACT_ID' is not numeric."
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > supply-set.zip
          unzip -o supply-set.zip
          SCHEMA=$(jq -er '.schema' staging-supply-set.json)
          # v2 = v1 plus tree-identity provenance (adopted speculative PR
          # builds). Both dispatch identically: the deployable fields are
          # byte-for-byte the same shape. v1 stays accepted because a rerun
          # of a pre-v2 build run regenerates its artifact from the old
          # workflow and must keep dispatching.
          case "$SCHEMA" in
            leaf.staging-supply-set.v1|leaf.staging-supply-set.v2) ;;
            *)
              echo "::error::Supply-set schema '$SCHEMA' is not an accepted staging supply-set schema."
              exit 1
              ;;
          esac
          IMAGE_TAG=$(jq -er '.build_tag' staging-supply-set.json)
          [[ "$IMAGE_TAG" =~ ^prod-[0-9a-f]{7,40}$ ]] || {
            echo "::error::Supply-set build_tag '$IMAGE_TAG' is not an immutable prod tag."
            exit 1
          }
          MANIFEST_SHA=$(jq -er '.source_revision' staging-supply-set.json)
          [ "$MANIFEST_SHA" = "$BUILD_HEAD_SHA" ] || {
            echo "::error::Supply-set source_revision $MANIFEST_SHA does not match the build head $BUILD_HEAD_SHA."
            exit 1
          }
          {
            echo "deploy=true"
            echo "mode=release"
            echo "image_tag=$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy each staging service in turn and prove each one landed
        if: >-
          steps.tip.outputs.current == 'true' &&
          steps.manifest.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.TERRAFORM_REPO_TOKEN }}
          # The tip re-check reads THIS repo, which the infra-repo PAT is not
          # scoped for; the job's own token is.
          HOME_TOKEN: ${{ github.token }}
          DEPLOY_MODE: ${{ steps.manifest.outputs.mode }}
          IMAGE_TAG: ${{ steps.manifest.outputs.image_tag }}
        run: |
          set -euo pipefail

          POLL_SECONDS=15
          EVICTION_RETRIES=2
          DEADLINE=$(( $(date +%s) + 95 * 60 ))

          before_deadline() { [ "$(date +%s)" -lt "$DEADLINE" ]; }

          # `gh workflow run` does not return the run it creates, so the run
          # we just made is "the one that appeared above this mark".
          latest_any_run_id() {
            gh run list --repo "$INFRA_REPO" --workflow "$DEPLOY_WORKFLOW" \
              --limit 100 --json databaseId \
              | jq -r '[.[].databaseId] | max // 0'
          }

          # Newest run above the mark whose run-name is EXACTLY this service
          # and this image tag.
          #
          # Identity must be positive, never inferred from "a new run
          # appeared". Sibling lanes dispatch this same workflow a few times
          # an hour, and GitHub creates and lists dispatched runs
          # asynchronously, so a sibling's run can become visible before ours
          # does. Binding the newest new run would then watch THEIR run,
          # report their success as our service's, and dispatch the next
          # service — which evicts our own still-queued run. That is exactly
          # the silent partial deploy this whole change exists to kill.
          #
          # A sibling that dispatched the identical service AND tag is
          # deploying precisely what we asked for, so matching its run is
          # still correct.
          find_run_named() {
            gh run list --repo "$INFRA_REPO" --workflow "$DEPLOY_WORKFLOW" \
              --limit 100 --json databaseId,displayTitle \
              | jq -r --argjson mark "$1" --arg want "$2" \
                  '[.[] | select(.databaseId > $mark and .displayTitle == $want)]
                   | sort_by(-.databaseId) | first | .databaseId // empty'
          }

          # Newest SUCCESSFUL deploy run for one service, as its full run
          # name. Every dispatch of the infra workflow names itself
          # "Deploy leaf-platform staging <service> (<image_tag|sha|live
          # baseline>)", so the newest successful run carrying this prefix IS
          # what that service currently runs.
          #
          # The newest one is taken UNCONDITIONALLY, not the newest one that
          # happens to carry a prod tag. A manual build-from-source or
          # live-baseline recovery deploy names itself with a sha or a
          # literal; skipping past it would read the service as older than it
          # is and reconcile it BACKWARDS. An unparseable newest run is an
          # undecidable live identity, and undecidable is red.
          newest_deploy_title() {
            gh run list --repo "$INFRA_REPO" --workflow "$DEPLOY_WORKFLOW" \
              --limit 200 --json databaseId,displayTitle,conclusion \
              | jq -r --arg prefix "Deploy leaf-platform staging $1 (" \
                  '[.[] | select(.conclusion == "success")
                        | select(.displayTitle | startswith($prefix))]
                   | sort_by(-.databaseId) | first | .displayTitle // empty'
          }

          # "...staging app (prod-abc1234)" -> "prod-abc1234"
          tag_of_title() {
            local rest=${1#*\(}
            printf '%s' "${rest%\)}"
          }

          require_prod_tag() {
            [[ "$1" =~ ^prod-[0-9a-f]{7,40}$ ]] || {
              echo "::error::$2"
              exit 1
            }
          }

          if [ "$DEPLOY_MODE" = "reconcile" ]; then
            # This merge built no images, so there is no release to make.
            # The only question is whether an earlier relay's stand-down left
            # staging split, and if so which service is behind.
            #
            # WAIT FOR QUIESCENCE FIRST. A deploy in flight means the live tags
            # are mid-change, and reading them early is how reconcile MISSES
            # the very split it exists to close. The motivating race is exactly
            # this shape: a docs-only build finishes in a minute or two while
            # the release it landed on top of takes ~8 minutes per service, so
            # at the moment this relay wakes up, web@A is often still
            # deploying. Both services would still report their pre-A tag,
            # reconcile would call that converged and exit green, and the
            # stood-down relay's split would then have nobody left to fix it.
            # Waiting also stops a duplicate dispatch racing a deploy that is
            # already putting the service where we want it.
            BUSY=-1
            while before_deadline; do
              BUSY=$(gh run list --repo "$INFRA_REPO" \
                --workflow "$DEPLOY_WORKFLOW" --limit 100 --json status \
                | jq -r '[.[] | select(.status != "completed")] | length')
              if [ "$BUSY" -eq 0 ]; then
                break
              fi
              echo "Waiting for $BUSY in-flight $DEPLOY_WORKFLOW run(s) to settle before reading staging's live image tags."
              sleep "$POLL_SECONDS"
            done
            if [ "$BUSY" -ne 0 ]; then
              echo "::error::Docs-only merge $BUILD_HEAD_SHA: $DEPLOY_WORKFLOW still had in-flight runs when the watch budget ran out, so staging's live image tags never settled and whether staging is split is undecidable. Recovery: manual workflow_dispatch of $DEPLOY_WORKFLOW with an exact task-definition ARN."
              exit 1
            fi

            WEB_TITLE=$(newest_deploy_title web)
            APP_TITLE=$(newest_deploy_title app)
            if [ -z "$WEB_TITLE" ] || [ -z "$APP_TITLE" ]; then
              echo "::error::Docs-only merge $BUILD_HEAD_SHA: no successful $DEPLOY_WORKFLOW run names a live image for both staging services within the last 200 runs (web='$WEB_TITLE', app='$APP_TITLE'), so whether staging is split is undecidable. This relay refuses to guess rather than risk deploying a service backwards. Recovery: manual workflow_dispatch of $DEPLOY_WORKFLOW with an exact task-definition ARN."
              exit 1
            fi
            WEB_TAG=$(tag_of_title "$WEB_TITLE")
            APP_TAG=$(tag_of_title "$APP_TITLE")
            require_prod_tag "$WEB_TAG" "Docs-only merge $BUILD_HEAD_SHA: the newest successful web deploy is '$WEB_TITLE', which does not name an immutable prod tag, so web's live identity cannot be compared and reconciling could deploy it backwards. Recovery: manual workflow_dispatch of $DEPLOY_WORKFLOW with an exact task-definition ARN."
            require_prod_tag "$APP_TAG" "Docs-only merge $BUILD_HEAD_SHA: the newest successful app deploy is '$APP_TITLE', which does not name an immutable prod tag, so app's live identity cannot be compared and reconciling could deploy it backwards. Recovery: manual workflow_dispatch of $DEPLOY_WORKFLOW with an exact task-definition ARN."

            SERVICES=""
            if [ "$WEB_TAG" = "$APP_TAG" ]; then
              echo "::notice::Docs-only merge $BUILD_HEAD_SHA builds no images and staging is already converged on $WEB_TAG; nothing to reconcile."
            else
              # ANCESTRY, never recency. compare/<base>...<head> reports the
              # HEAD side, so with web as base: 'ahead' means APP is ahead and
              # WEB is the service to move forward. Choosing by "whichever
              # deployed most recently" would deploy the older tag over the
              # newer one whenever the ahead service landed first, which is
              # exactly the case reconcile exists to clean up.
              RELATION=$(GH_TOKEN="$HOME_TOKEN" gh api \
                "repos/$GITHUB_REPOSITORY/compare/${WEB_TAG#prod-}...${APP_TAG#prod-}" \
                --jq '.status' || true)
              case "$RELATION" in
                identical)
                  echo "::notice::Docs-only merge $BUILD_HEAD_SHA: web=$WEB_TAG and app=$APP_TAG name the same commit; staging is converged and there is nothing to reconcile."
                  ;;
                ahead)
                  SERVICES="web"
                  IMAGE_TAG="$APP_TAG"
                  ;;
                behind)
                  SERVICES="app"
                  IMAGE_TAG="$WEB_TAG"
                  ;;
                *)
                  echo "::error::STAGING IS SPLIT and cannot be reconciled forward: web=$WEB_TAG, app=$APP_TAG, and comparing them reports '$RELATION' rather than one being an ancestor of the other. Deploying either onto the other would risk rolling a service BACKWARDS, which this relay never does. Recovery: manual workflow_dispatch of $DEPLOY_WORKFLOW with an exact task-definition ARN."
                  exit 1
                  ;;
              esac
            fi
            if [ -n "$SERVICES" ]; then
              echo "::warning::STAGING IS SPLIT: web=$WEB_TAG, app=$APP_TAG. Docs-only merge $BUILD_HEAD_SHA builds no images, so this relay will reconcile it forward by deploying $SERVICES onto $IMAGE_TAG (unless the tip re-check below stands it down for a newer commit)."
            fi
          else
            SERVICES="web app"
          fi

          # The empty-tag wall. Reaching a dispatch with no resolved tag was
          # previously prevented by the step's own `if` guard; reconcile now
          # enters that step deliberately without a build tag, so the check
          # lives here, where it covers both modes.
          if [ -n "$SERVICES" ]; then
            require_prod_tag "$IMAGE_TAG" "Refusing to dispatch: the resolved image tag '$IMAGE_TAG' (mode '$DEPLOY_MODE') is not an immutable prod tag."
          fi

          DEPLOYED_ANY=false

          for SERVICE in $SERVICES; do
            WANT="Deploy leaf-platform staging $SERVICE ($IMAGE_TAG)"
            ATTEMPT=0

            while :; do
              # Re-read the tip as the FIRST thing in every dispatch attempt,
              # retries included, and never gate it. Dispatching a tag that is
              # no longer current rolls staging BACKWARDS, and that is not
              # hypothetical: relay A can hold a queued app deploy across a
              # newer relay B's whole web-then-app sequence, each eviction
              # dutifully retried, and A's older app then lands on top of B's.
              # Deploying web before app orders the two services within ONE
              # relay; it does not order two relays against each other.
              MAIN_SHA=$(GH_TOKEN="$HOME_TOKEN" gh api \
                "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
              if [ "$MAIN_SHA" != "$BUILD_HEAD_SHA" ]; then
                if [ "$DEPLOYED_ANY" = "true" ]; then
                  # Standing down here leaves staging on a mixed identity, and
                  # that is still the lesser evil: finishing this release risks
                  # landing a stale tag over a newer deploy, which is silent
                  # corruption rather than a visible gap. The newer commit's
                  # relay now converges it either way — by releasing both
                  # services if that commit builds images, or by reconciling
                  # the split forward if it is docs-only.
                  echo "::warning::STAGING IS SPLIT: main moved to $MAIN_SHA past built $BUILD_HEAD_SHA after this release already deployed a service, so $SERVICE stays on its previous image. Standing down rather than risk landing $IMAGE_TAG on top of a newer deploy. The newer commit's relay converges this, releasing if it builds images and reconciling if it is docs-only."
                else
                  echo "::notice::main moved to $MAIN_SHA past built $BUILD_HEAD_SHA before this release put anything live; standing down (latest-main-only staging: the newer commit's relay owns the deploy)."
                fi
                exit 0
              fi

              BEFORE=$(latest_any_run_id)
              gh workflow run "$DEPLOY_WORKFLOW" \
                --repo "$INFRA_REPO" \
                --ref main \
                -f "service=$SERVICE" \
                -f "expected_task_definition=auto-live" \
                -f "image_tag=$IMAGE_TAG" \
                -f "app_deploy_intent=forward"
              echo "Dispatched $SERVICE deploy of $IMAGE_TAG (attempt $((ATTEMPT + 1)))."

              # Transient gh failures inside poll loops are tolerated and fail
              # CLOSED: an unresolved run exhausts its budget and errors below.
              RUN_ID=""
              RESOLVE_BY=$(( $(date +%s) + 5 * 60 ))
              while [ "$(date +%s)" -lt "$RESOLVE_BY" ] && before_deadline; do
                sleep 3
                RUN_ID=$(find_run_named "$BEFORE" "$WANT" || true)
                if [ -n "$RUN_ID" ]; then break; fi
              done
              if [ -z "$RUN_ID" ]; then
                echo "::error::Dispatched the $SERVICE deploy of $IMAGE_TAG but no run named '$WANT' appeared. This relay identifies its run by name and never guesses, so it fails here rather than watch a run that may not be ours. PREREQUISITE: $INFRA_REPO must set run-name on $DEPLOY_WORKFLOW to 'Deploy leaf-platform staging <service> (<image_tag>)'. Staging is NOT converged on $BUILD_HEAD_SHA."
                exit 1
              fi
              echo "Watching $SERVICE deploy run $RUN_ID."

              STATUS=""
              CONCLUSION=""
              while before_deadline; do
                STATE=$(gh run view "$RUN_ID" --repo "$INFRA_REPO" \
                  --json status,conclusion \
                  --jq '"\(.status) \(.conclusion // "")"' || true)
                STATUS=${STATE%% *}
                CONCLUSION=${STATE#* }
                [ "$STATUS" = "completed" ] && break
                sleep "$POLL_SECONDS"
              done

              if [ "$STATUS" != "completed" ]; then
                echo "::error::The $SERVICE deploy run $RUN_ID had not finished within the watch budget. Staging may be half-deployed on $BUILD_HEAD_SHA."
                exit 1
              fi
              if [ "$CONCLUSION" = "success" ]; then
                DEPLOYED_ANY=true
                echo "$SERVICE deploy of $IMAGE_TAG landed (run $RUN_ID)."
                break
              fi

              # Zero jobs means the run was cancelled while still queued, i.e.
              # evicted from the shared staging lock before touching AWS. Only
              # that is retryable; a run that started and then failed must
              # never be re-dispatched blind.
              JOBS=$(gh api "repos/$INFRA_REPO/actions/runs/$RUN_ID/jobs" \
                --jq '.total_count')
              if [ "$CONCLUSION" = "cancelled" ] && [ "$JOBS" -eq 0 ] \
                && [ "$ATTEMPT" -lt "$EVICTION_RETRIES" ]; then
                ATTEMPT=$((ATTEMPT + 1))
                echo "::warning::The $SERVICE deploy run $RUN_ID was evicted from the staging lock before starting a job; re-dispatching."
                continue
              fi

              echo "::error::The $SERVICE deploy of $IMAGE_TAG concluded '$CONCLUSION' (run $RUN_ID, $JOBS jobs). Staging is NOT converged on $BUILD_HEAD_SHA."
              exit 1
            done
          done
