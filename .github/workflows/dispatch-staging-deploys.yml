name: Dispatch staging deploys

# ---------------------------------------------------------------------------
# Auto-dispatches the leaf-platform staging deploys (web + app, ONE AT A TIME)
# when a main-branch "Build platform images" push run succeeds. Removes the
# hand-dispatch gap between build success and deploy start. This line said
# "concurrently" until 2026-08-07, left over from before the serial rewrite;
# it contradicted the serial-dispatch rationale 20 lines below it.
#
# The image tag is read from the build run's own staging supply-set manifest
# artifact (leaf.staging-supply-set.v1, field build_tag), never re-derived,
# so the deployed tag is exactly the tag the build recorded.
#
# Ordering guard: deploys dispatch only while the built commit is still the
# tip of main (latest-main-only staging). An older overlapping build can never
# roll staging backwards; if the newer commit's own build fails, staging stays
# on its previous deploy until the next successful main build.
#
# Docs-only no-op: a docs-only push's build run succeeds without building
# (its noop gate skips the graph) and publishes a docs-noop marker artifact
# instead of a supply set. This relay treats marker-without-manifest as a
# clean skip; manifest-and-marker both absent stays a hard error, because a
# successful build with no supply set means a partial run.
#
# Rerun semantics: rerunning a successful build (or this relay) deploys
# both services again, deliberately. The deploys register a fresh task
# definition revision of the same images.
#
# One service at a time, and each one PROVEN to land. The infra repo funnels
# every staging mutation through ONE concurrency group
# (leaf-platform-staging-ecs-mutation, shared by 39 workflows) so no sampled
# digest can change before a release identity reaches the live app. GitHub
# keeps at most ONE pending run per group and a newly queued run CANCELS the
# previously pending one, so firing both deploys two seconds apart made the
# second evict the first whenever the lock was already busy: 4 merges between
# 2026-08-05 and 2026-08-06 deployed only one of their two services, silently,
# because this relay used to dispatch and exit without ever reading an
# outcome. Dispatching serially keeps at most one of our runs queued, and
# watching each run to a terminal state is what makes a lost deploy loud.
#
# A run cancelled before any job started never reached AWS, so eviction is a
# queueing loss rather than a deploy failure and is the one conclusion this
# relay retries. Every other non-success fails the relay red.
#
# NEED-FIRST ORDERING (2026-08-07). The service loop used to be a hardcoded
# `for SERVICE in web app`, so web won every race and app lost every race. A
# relay superseded mid-release always dies before its SECOND service, so under
# any merge rate faster than one full release (~8 min web plus ~14 min app)
# app never advanced at all while web advanced every time. Observed: three
# consecutive relays (d9306c3, 7056e2e, 48204c4) produced web deploys with no
# app deploy between them, and staging ran a whole release split for over two
# hours. The stand-down is correct and stays; what was wrong is that the
# SAME service was always the one abandoned. Ordering by need hands the first
# slot to whichever service the last successful deploys show further behind,
# which removes that systematic bias: when the read decides, the service that
# lost the previous race is the one that advances now.
#
# It does NOT guarantee alternation, and it does NOT bound a split to one
# release. An earlier version of this comment claimed both and sol-critic
# returned RED for it. The read is BEST EFFORT and every failure mode falls
# back to the old fixed `web app` (see newest_deploy_title below): an
# unreadable title, a non-prod tag, equal tags, or an ancestry compare that
# does not come back "behind". A read that keeps failing, or keeps landing in
# one of those cases, restores exactly the old starvation shape. Nothing here
# stops the tip from moving either, so at a high enough merge rate a split can
# still outlive several relays. The honest claim is narrower: the bias toward
# one fixed victim is gone whenever the read decides, and the relay still
# announces every split it leaves, naming the service it left behind.
#
# THAT READ MAY ONLY AFFECT ORDER, and here is exactly what that does and does
# not buy. What it CANNOT do: choose a deploy tag (the tag always comes from
# the verified supply-set manifest), drop a service from the list, inject a
# token into the loop, or fail the release when the read itself errors. So it
# cannot cause a backwards deploy, which is the invariant that matters most.
#
# What it CAN do, stated plainly because an earlier version of this comment
# claimed otherwise and sol-critic returned RED for it: ORDER DECIDES WHO GETS
# SKIPPED. Only the first service is dispatched unconditionally; the second sits
# behind another tip re-check and is abandoned if main moved. So a WRONG read
# can be worse than the fixed order in one concrete schedule: app (~14 min) is
# put first on bad evidence, main moves at t=10, and web is skipped, where
# web-first would have landed web at t=8 and dispatched app before the move.
#
# That trade is taken deliberately. The fixed order did not avoid the cost, it
# just always charged it to the same service: web won every race and app lost
# every race, forever. Occasionally swapping WHICH service lags is strictly
# better than permanently starving one, and no ordering can stop the tip from
# moving. The relay still announces the split it leaves, naming the skipped
# service, so the cost is visible rather than silent.
#
# Inferring live
# state from CI run history is NOT sound, and an earlier cut of this change
# that used it to pick a DEPLOY TAG was returned RED by sol-critic on PR #506
# for two reasons: a deploy that flips traffic and then fails or is cancelled
# leaves the new colour live while its run reads as unsuccessful, so the read
# can name an older tag as live; and the read/dispatch window is not atomic,
# so a sibling deploy can move a service forward in between while main has not
# moved. Both turn a tag DECISION into a silent backwards deploy. Neither can
# do worse than pick the wrong order here. The task definitions are also
# digest-pinned and staging app/web are blue/green, so "live" is a function of
# ALB rule weights: no amount of run-name reading is authoritative about what
# is serving, and this code must never pretend otherwise.
#
# Converging a split with NO new images (a docs-only tip builds none) would
# need a sound read of live state, which means the relay reading ECS/ALB
# directly through an OIDC role. That adds id-token: write, breaks the pinned
# capability wall below, and needs an infra-repo trust change. Deliberately
# out of scope here: a docs-only tip still skips, so the split waits for the
# next DEPLOYABLE merge, and even that one only converges it if its own relay
# is not itself superseded and its own need-first read decides. Need-first
# ordering makes prompt convergence more likely; it does not make it certain.
#
# CLAIM DISCIPLINE, because this file keeps getting this wrong. Rounds 2, 3
# and 4 of review on PR #506 were all RED for the same reason: a comment
# promising convergence, alternation, or non-starvation that the code cannot
# deliver. Every one of those guarantees is conditional on a best-effort read
# and on the tip holding still, and NEITHER is guaranteed. Before adding any
# sentence with "converges", "alternates", "cannot starve" or "bounded",
# check it against the fallbacks at the ordering site and the tip re-check.
#
# Dispatch auth: TERRAFORM_REPO_TOKEN (PAT, workflow_dispatch on the infra
# repo) — the same pattern the aws-* service repos use with
# deploy-service-staging.yml. The deploys themselves run in
# LEAF-Solar-Design/leaf-automation-aws-terraform with its own review gates.
#
# Rollback: delete this file (or revert its PR). Manual workflow_dispatch of
# deploy-leaf-platform-staging.yml with an exact task-definition ARN is
# unchanged and remains the recovery path.
# ---------------------------------------------------------------------------

on:
  workflow_run:
    workflows: ["Build platform images"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: dispatch-staging-deploys-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # The relay now watches both deploys to completion (observed: ~8 min for
    # web, ~14 min for app, plus time queued behind the shared staging lock).
    # Comfortably above the step's own 95-minute deadline so the step reports
    # WHICH service was left undeployed instead of dying to a job timeout.
    timeout-minutes: 105

    env:
      INFRA_REPO: LEAF-Solar-Design/leaf-automation-aws-terraform
      DEPLOY_WORKFLOW: deploy-leaf-platform-staging.yml
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      BUILD_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Skip when the built commit is no longer the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$MAIN_SHA" != "$BUILD_HEAD_SHA" ]; then
            echo "::notice::main moved to $MAIN_SHA past built $BUILD_HEAD_SHA; skipping (latest-main-only staging: the next successful main build deploys)."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the exact image tag from the build's supply-set manifest
        id: manifest
        if: steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="staging-supply-set-$BUILD_HEAD_SHA-attempt-$BUILD_RUN_ATTEMPT"
          NOOP_NAME="docs-noop-$BUILD_HEAD_SHA-attempt-$BUILD_RUN_ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" \
            > artifacts.json
          ARTIFACT_ID=$(jq -r --arg name "$ARTIFACT_NAME" '
            first(.artifacts[] | select(.name == $name)).id // empty
          ' artifacts.json)
          if [ -z "$ARTIFACT_ID" ]; then
            # No supply set. A deliberate docs-only no-op run publishes a
            # marker instead; that skips cleanly. Anything else is still a
            # loud failure: a successful build without a manifest means a
            # partial run and must never be silently swallowed.
            if jq -e --arg name "$NOOP_NAME" \
              'any(.artifacts[]; .name == $name)' artifacts.json >/dev/null; then
              echo "::notice::Build run $BUILD_RUN_ID was a docs-only no-op; nothing to deploy."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Supply-set artifact $ARTIFACT_NAME not found and no $NOOP_NAME marker present."
            exit 1
          fi
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Supply-set artifact ID '$ARTIFACT_ID' is not numeric."
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > supply-set.zip
          unzip -o supply-set.zip
          SCHEMA=$(jq -er '.schema' staging-supply-set.json)
          # v2 = v1 plus tree-identity provenance (adopted speculative PR
          # builds). Both dispatch identically: the deployable fields are
          # byte-for-byte the same shape. v1 stays accepted because a rerun
          # of a pre-v2 build run regenerates its artifact from the old
          # workflow and must keep dispatching.
          case "$SCHEMA" in
            leaf.staging-supply-set.v1|leaf.staging-supply-set.v2) ;;
            *)
              echo "::error::Supply-set schema '$SCHEMA' is not an accepted staging supply-set schema."
              exit 1
              ;;
          esac
          IMAGE_TAG=$(jq -er '.build_tag' staging-supply-set.json)
          [[ "$IMAGE_TAG" =~ ^prod-[0-9a-f]{7,40}$ ]] || {
            echo "::error::Supply-set build_tag '$IMAGE_TAG' is not an immutable prod tag."
            exit 1
          }
          MANIFEST_SHA=$(jq -er '.source_revision' staging-supply-set.json)
          [ "$MANIFEST_SHA" = "$BUILD_HEAD_SHA" ] || {
            echo "::error::Supply-set source_revision $MANIFEST_SHA does not match the build head $BUILD_HEAD_SHA."
            exit 1
          }
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy each staging service in turn and prove each one landed
        if: >-
          steps.tip.outputs.current == 'true' &&
          steps.manifest.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.TERRAFORM_REPO_TOKEN }}
          # The tip re-check reads THIS repo, which the infra-repo PAT is not
          # scoped for; the job's own token is.
          HOME_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.manifest.outputs.image_tag }}
        run: |
          set -euo pipefail

          POLL_SECONDS=15
          EVICTION_RETRIES=2
          DEADLINE=$(( $(date +%s) + 95 * 60 ))

          before_deadline() { [ "$(date +%s)" -lt "$DEADLINE" ]; }

          # `gh workflow run` does not return the run it creates, so the run
          # we just made is "the one that appeared above this mark".
          latest_any_run_id() {
            gh run list --repo "$INFRA_REPO" --workflow "$DEPLOY_WORKFLOW" \
              --limit 100 --json databaseId \
              | jq -r '[.[].databaseId] | max // 0'
          }

          # Newest run above the mark whose run-name is EXACTLY this service
          # and this image tag.
          #
          # Identity must be positive, never inferred from "a new run
          # appeared". Sibling lanes dispatch this same workflow a few times
          # an hour, and GitHub creates and lists dispatched runs
          # asynchronously, so a sibling's run can become visible before ours
          # does. Binding the newest new run would then watch THEIR run,
          # report their success as our service's, and dispatch the next
          # service — which evicts our own still-queued run. That is exactly
          # the silent partial deploy this whole change exists to kill.
          #
          # A sibling that dispatched the identical service AND tag is
          # deploying precisely what we asked for, so matching its run is
          # still correct.
          find_run_named() {
            gh run list --repo "$INFRA_REPO" --workflow "$DEPLOY_WORKFLOW" \
              --limit 100 --json databaseId,displayTitle \
              | jq -r --argjson mark "$1" --arg want "$2" \
                  '[.[] | select(.databaseId > $mark and .displayTitle == $want)]
                   | sort_by(-.databaseId) | first | .databaseId // empty'
          }

          # Newest SUCCESSFUL deploy run for one service, as its full run name.
          # Every dispatch of the infra workflow names itself
          # "Deploy leaf-platform staging <service> (<image_tag|sha|live
          # baseline>)". Best effort ONLY: this feeds the loop ORDER and
          # nothing else, so every failure mode below falls back to the old
          # fixed order rather than failing the release.
          newest_deploy_title() {
            gh run list --repo "$INFRA_REPO" --workflow "$DEPLOY_WORKFLOW" \
              --limit 200 --json databaseId,displayTitle,conclusion \
              | jq -r --arg prefix "Deploy leaf-platform staging $1 (" \
                  '[.[] | select(.conclusion == "success")
                        | select(.displayTitle | startswith($prefix))]
                   | sort_by(-.databaseId) | first | .displayTitle // empty'
          }

          # "...staging app (prod-abc1234)" -> "prod-abc1234"
          tag_of_title() {
            local rest=${1#*\(}
            printf '%s' "${rest%\)}"
          }

          # Hand the first slot to whichever service looks further behind, so
          # the one abandoned by the last superseded relay is the one that
          # advances now. Only the FIRST service is dispatched
          # unconditionally, so this decides who gets skipped if main moves;
          # read the header for why that trade is taken. It cannot change the
          # tag, drop a service, or fail the release.
          SERVICES="web app"
          WEB_TAG=$(tag_of_title "$(newest_deploy_title web || true)")
          APP_TAG=$(tag_of_title "$(newest_deploy_title app || true)")
          if [[ "$WEB_TAG" =~ ^prod-[0-9a-f]{7,40}$ ]] \
            && [[ "$APP_TAG" =~ ^prod-[0-9a-f]{7,40}$ ]] \
            && [ "$WEB_TAG" != "$APP_TAG" ]; then
            # compare/<base>...<head> reports the HEAD side, so with web as
            # base "behind" means APP is behind and app goes first.
            RELATION=$(GH_TOKEN="$HOME_TOKEN" gh api \
              "repos/$GITHUB_REPOSITORY/compare/${WEB_TAG#prod-}...${APP_TAG#prod-}" \
              --jq '.status' || true)
            if [ "$RELATION" = "behind" ]; then
              SERVICES="app web"
              echo "::notice::app ($APP_TAG) trails web ($WEB_TAG); deploying app first so the service that lost the last race is the one that advances now. This does not guarantee app lands: if main moves before its dispatch, this relay stands down and web is the service left behind instead."
            fi
          fi

          DEPLOYED_ANY=false

          for SERVICE in $SERVICES; do
            WANT="Deploy leaf-platform staging $SERVICE ($IMAGE_TAG)"
            ATTEMPT=0

            while :; do
              # Re-read the tip as the FIRST thing in every dispatch attempt,
              # retries included, and never gate it. Dispatching a tag that is
              # no longer current rolls staging BACKWARDS, and that is not
              # hypothetical: relay A can hold a queued app deploy across a
              # newer relay B's whole web-then-app sequence, each eviction
              # dutifully retried, and A's older app then lands on top of B's.
              # Deploying web before app orders the two services within ONE
              # relay; it does not order two relays against each other.
              MAIN_SHA=$(GH_TOKEN="$HOME_TOKEN" gh api \
                "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
              if [ "$MAIN_SHA" != "$BUILD_HEAD_SHA" ]; then
                if [ "$DEPLOYED_ANY" = "true" ]; then
                  # KNOWN RESIDUAL, stated rather than hidden. Standing down
                  # here leaves staging on a mixed identity, and NOTHING here
                  # guarantees when that ends. The newer commit's relay clears
                  # it only if that commit builds images AND that relay is not
                  # itself superseded before it reaches the behind service. A
                  # docs-only commit builds none and its relay skips outright.
                  # So the split can survive several relays, not just one.
                  # Standing down is still the lesser evil: finishing this
                  # release risks landing a stale tag over a newer deploy,
                  # which is silent corruption rather than a visible gap.
                  echo "::warning::STAGING IS SPLIT: main moved to $MAIN_SHA past built $BUILD_HEAD_SHA after this release already deployed a service, so $SERVICE stays on its previous image. Standing down rather than risk landing $IMAGE_TAG on top of a newer deploy. The newer commit's relay clears this only if that commit builds images AND its own relay is not superseded before it reaches $SERVICE; a docs-only commit builds none and skips. This split is not guaranteed to clear on the next merge."
                else
                  echo "::notice::main moved to $MAIN_SHA past built $BUILD_HEAD_SHA before this release put anything live; standing down (latest-main-only staging: the newer commit's relay owns the deploy)."
                fi
                exit 0
              fi

              BEFORE=$(latest_any_run_id)
              gh workflow run "$DEPLOY_WORKFLOW" \
                --repo "$INFRA_REPO" \
                --ref main \
                -f "service=$SERVICE" \
                -f "expected_task_definition=auto-live" \
                -f "image_tag=$IMAGE_TAG" \
                -f "app_deploy_intent=forward"
              echo "Dispatched $SERVICE deploy of $IMAGE_TAG (attempt $((ATTEMPT + 1)))."

              # Transient gh failures inside poll loops are tolerated and fail
              # CLOSED: an unresolved run exhausts its budget and errors below.
              RUN_ID=""
              RESOLVE_BY=$(( $(date +%s) + 5 * 60 ))
              while [ "$(date +%s)" -lt "$RESOLVE_BY" ] && before_deadline; do
                sleep 3
                RUN_ID=$(find_run_named "$BEFORE" "$WANT" || true)
                if [ -n "$RUN_ID" ]; then break; fi
              done
              if [ -z "$RUN_ID" ]; then
                echo "::error::Dispatched the $SERVICE deploy of $IMAGE_TAG but no run named '$WANT' appeared. This relay identifies its run by name and never guesses, so it fails here rather than watch a run that may not be ours. PREREQUISITE: $INFRA_REPO must set run-name on $DEPLOY_WORKFLOW to 'Deploy leaf-platform staging <service> (<image_tag>)'. Staging is NOT converged on $BUILD_HEAD_SHA."
                exit 1
              fi
              echo "Watching $SERVICE deploy run $RUN_ID."

              STATUS=""
              CONCLUSION=""
              while before_deadline; do
                STATE=$(gh run view "$RUN_ID" --repo "$INFRA_REPO" \
                  --json status,conclusion \
                  --jq '"\(.status) \(.conclusion // "")"' || true)
                STATUS=${STATE%% *}
                CONCLUSION=${STATE#* }
                [ "$STATUS" = "completed" ] && break
                sleep "$POLL_SECONDS"
              done

              if [ "$STATUS" != "completed" ]; then
                echo "::error::The $SERVICE deploy run $RUN_ID had not finished within the watch budget. Staging may be half-deployed on $BUILD_HEAD_SHA."
                exit 1
              fi
              if [ "$CONCLUSION" = "success" ]; then
                DEPLOYED_ANY=true
                echo "$SERVICE deploy of $IMAGE_TAG landed (run $RUN_ID)."
                break
              fi

              # Zero jobs means the run was cancelled while still queued, i.e.
              # evicted from the shared staging lock before touching AWS. Only
              # that is retryable; a run that started and then failed must
              # never be re-dispatched blind.
              JOBS=$(gh api "repos/$INFRA_REPO/actions/runs/$RUN_ID/jobs" \
                --jq '.total_count')
              if [ "$CONCLUSION" = "cancelled" ] && [ "$JOBS" -eq 0 ] \
                && [ "$ATTEMPT" -lt "$EVICTION_RETRIES" ]; then
                ATTEMPT=$((ATTEMPT + 1))
                echo "::warning::The $SERVICE deploy run $RUN_ID was evicted from the staging lock before starting a job; re-dispatching."
                continue
              fi

              echo "::error::The $SERVICE deploy of $IMAGE_TAG concluded '$CONCLUSION' (run $RUN_ID, $JOBS jobs). Staging is NOT converged on $BUILD_HEAD_SHA."
              exit 1
            done
          done
