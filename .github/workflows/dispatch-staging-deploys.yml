name: Dispatch staging deploys

# ---------------------------------------------------------------------------
# Auto-dispatches the leaf-platform staging deploys (web + app, ONE AT A TIME)
# when a main-branch "Build platform images" push run succeeds. Removes the
# hand-dispatch gap between build success and deploy start. This line said
# "concurrently" until 2026-08-07, left over from before the serial rewrite;
# it contradicted the serial-dispatch rationale 20 lines below it.
#
# The image tag is read from the build run's own staging supply-set manifest
# artifact (leaf.staging-supply-set.v1, field build_tag), never re-derived,
# so the deployed tag is exactly the tag the build recorded.
#
# Ordering guard: deploys dispatch only while the built commit is still the
# tip of main (latest-main-only staging). An older overlapping build can never
# roll staging backwards; if the newer commit's own build fails, staging stays
# on its previous deploy until the next successful main build.
#
# Docs-only no-op: a docs-only push's build run succeeds without building
# (its noop gate skips the graph) and publishes a docs-noop marker artifact
# instead of a supply set. This relay treats marker-without-manifest as a
# clean skip; manifest-and-marker both absent stays a hard error, because a
# successful build with no supply set means a partial run.
#
# Rerun semantics: rerunning a successful build (or this relay) deploys
# both services again, deliberately. The deploys register a fresh task
# definition revision of the same images.
#
# One service at a time, and each one PROVEN to land. The infra repo funnels
# every staging mutation through ONE concurrency group
# (leaf-platform-staging-ecs-mutation, shared by 39 workflows) so no sampled
# digest can change before a release identity reaches the live app. GitHub
# keeps at most ONE pending run per group and a newly queued run CANCELS the
# previously pending one, so firing both deploys two seconds apart made the
# second evict the first whenever the lock was already busy: 4 merges between
# 2026-08-05 and 2026-08-06 deployed only one of their two services, silently,
# because this relay used to dispatch and exit without ever reading an
# outcome. Dispatching serially keeps at most one of our runs queued, and
# watching each run to a terminal state is what makes a lost deploy loud.
#
# A run cancelled before any job started never reached AWS, so eviction is a
# queueing loss rather than a deploy failure and is the one conclusion this
# relay retries. Every other non-success fails the relay red.
#
# Superseded mid-release: being overtaken by a newer merge after one service
# is already live leaves staging split, so the relay asks whether the newer
# commit will converge it, using that commit's OWN build receipt rather than
# a re-derived diff. A docs-only push publishes a docs-noop marker and no
# supply set, and the manifest step above turns that marker into
# deploy=false, so a marker proves the superseder dispatches NOTHING: no
# newer deploy exists to land on top of, and nothing else would ever close
# the split, so this release finishes its remaining services instead of
# standing down. A superseder whose build SUCCEEDED without a marker
# produced a supply set, so its own relay converges staging and standing
# down is both safe and silent-free. Anything else (its build failed, never
# appeared, or outlived the watch budget) leaves staging split with no known
# converger and fails this relay RED. Observed 2026-08-07: relay
# 31144164225 stood down after deploying web, the superseding commit was
# docs-only, nothing converged, and the run still concluded success, so
# leaf-platform-web-alt ran prod-d9306c3 while leaf-platform-app-alt ran
# prod-87294a9 with a ::warning:: on a green run as the only trace.
# NEED-FIRST ORDERING (2026-08-07). The service loop used to be a hardcoded
# `for SERVICE in web app`, so web won every race and app lost every race. A
# relay superseded mid-release always dies before its SECOND service, so under
# any merge rate faster than one full release (~8 min web plus ~14 min app)
# app never advanced at all while web advanced every time. Observed: three
# consecutive relays (d9306c3, 7056e2e, 48204c4) produced web deploys with no
# app deploy between them, and staging ran a whole release split for over two
# hours. The stand-down is correct and stays; what was wrong is that the
# SAME service was always the one abandoned. Ordering by need hands the first
# slot to whichever service the last successful deploys show further behind,
# which removes that systematic bias: when the read decides, the service that
# lost the previous race is the one that advances now.
#
# It does NOT guarantee alternation, and it does NOT bound a split to one
# release. An earlier version of this comment claimed both and sol-critic
# returned RED for it. The read is BEST EFFORT and every failure mode falls
# back to the old fixed `web app` (see newest_deploy_title below): an
# unreadable title, a non-prod tag, equal tags, or an ancestry compare that
# does not come back "behind". A read that keeps failing, or keeps landing in
# one of those cases, restores exactly the old starvation shape. Nothing here
# stops the tip from moving either, so at a high enough merge rate a split can
# still outlive several relays. The honest claim is narrower: the bias toward
# one fixed victim is gone whenever the read decides, and the relay still
# announces every split it leaves, naming the service it left behind.
#
# THAT READ MAY ONLY AFFECT ORDER, and here is exactly what that does and does
# not buy. What it CANNOT do: choose a deploy tag (the tag always comes from
# the verified supply-set manifest), drop a service from the list, inject a
# token into the loop, or fail the release when the read itself errors. So it
# cannot cause a backwards deploy, which is the invariant that matters most.
#
# What it CAN do, stated plainly because an earlier version of this comment
# claimed otherwise and sol-critic returned RED for it: ORDER DECIDES WHO GETS
# SKIPPED. Only the first service is dispatched unconditionally; the second sits
# behind another tip re-check and is abandoned if main moved. So a WRONG read
# can be worse than the fixed order in one concrete schedule: app (~14 min) is
# put first on bad evidence, main moves at t=10, and web is skipped, where
# web-first would have landed web at t=8 and dispatched app before the move.
#
# That trade is taken deliberately. The fixed order did not avoid the cost, it
# just always charged it to the same service: web won every race and app lost
# every race, forever. Occasionally swapping WHICH service lags is strictly
# better than permanently starving one, and no ordering can stop the tip from
# moving. The relay still announces the split it leaves, naming the skipped
# service, so the cost is visible rather than silent.
#
# Inferring live
# state from CI run history is NOT sound, and an earlier cut of this change
# that used it to pick a DEPLOY TAG was returned RED by sol-critic on PR #506
# for two reasons: a deploy that flips traffic and then fails or is cancelled
# leaves the new colour live while its run reads as unsuccessful, so the read
# can name an older tag as live; and the read/dispatch window is not atomic,
# so a sibling deploy can move a service forward in between while main has not
# moved. Both turn a tag DECISION into a silent backwards deploy. Neither can
# do worse than pick the wrong order here. The task definitions are also
# digest-pinned and staging app/web are blue/green, so "live" is a function of
# ALB rule weights: no amount of run-name reading is authoritative about what
# is serving, and this code must never pretend otherwise.
#
# Converging a split with NO new images (a docs-only tip builds none) would
# need a sound read of live state, which means the relay reading ECS/ALB
# directly through an OIDC role. That adds id-token: write, breaks the pinned
# capability wall below, and needs an infra-repo trust change. Deliberately
# out of scope here: a docs-only tip still skips, so the split waits for the
# next DEPLOYABLE merge, and even that one only converges it if its own relay
# is not itself superseded and its own need-first read decides. Need-first
# ordering makes prompt convergence more likely; it does not make it certain.
#
# CLAIM DISCIPLINE, because this file keeps getting this wrong. Rounds 2, 3
# and 4 of review on PR #506 were all RED for the same reason: a comment
# promising convergence, alternation, or non-starvation that the code cannot
# deliver. Every one of those guarantees is conditional on a best-effort read
# and on the tip holding still, and NEITHER is guaranteed. Before adding any
# sentence with "converges", "alternates", "cannot starve" or "bounded",
# check it against the fallbacks at the ordering site and the tip re-check.
#
# Dispatch auth: TERRAFORM_REPO_TOKEN (PAT, workflow_dispatch on the infra
# repo) — the same pattern the aws-* service repos use with
# deploy-service-staging.yml. The deploys themselves run in
# LEAF-Solar-Design/leaf-automation-aws-terraform with its own review gates.
#
# Rollback: delete this file (or revert its PR). Manual workflow_dispatch of
# deploy-leaf-platform-staging.yml with an exact task-definition ARN is
# unchanged and remains the recovery path.
# ---------------------------------------------------------------------------

on:
  workflow_run:
    workflows: ["Build platform images"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: dispatch-staging-deploys-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # The relay now watches both deploys to completion (observed: ~8 min for
    # web, ~14 min for app, plus time queued behind the shared staging lock).
    # Comfortably above the step's own 95-minute deadline so the step reports
    # WHICH service was left undeployed instead of dying to a job timeout.
    timeout-minutes: 105

    env:
      INFRA_REPO: LEAF-Solar-Design/leaf-automation-aws-terraform
      DEPLOY_WORKFLOW: deploy-leaf-platform-staging.yml
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      BUILD_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      # Job-level, not step-level: the manifest step names the build's own
      # supply set and docs-noop marker with it, and the receipt publish step
      # names the CONVERGENCE RECEIPT with it. One definition so those names
      # cannot drift apart.
      BUILD_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}

    steps:
      - name: Skip when the built commit is no longer the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$MAIN_SHA" != "$BUILD_HEAD_SHA" ]; then
            echo "::notice::main moved to $MAIN_SHA past built $BUILD_HEAD_SHA; skipping (latest-main-only staging: the next successful main build deploys)."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the exact image tag from the build's supply-set manifest
        id: manifest
        if: steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Download run $1's supply-set artifact named $2 into
          # staging-supply-set.json. Returns non-zero QUIETLY when that run
          # published no such artifact, because the two callers below mean
          # opposite things by an absence: for THIS build it may be a
          # legitimate docs-only no-op, for a historical build it just means
          # "keep looking". Leaves the run's artifact listing in artifacts.json
          # either way, which the no-op marker check reads.
          fetch_supply_set() {
            local run_id=$1 name=$2 artifact_id
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              > artifacts.json
            artifact_id=$(jq -r --arg name "$name" '
              first(.artifacts[] | select(.name == $name)).id // empty
            ' artifacts.json)
            [ -n "$artifact_id" ] || return 1
            [[ "$artifact_id" =~ ^[0-9]+$ ]] || {
              echo "::error::Supply-set artifact ID '$artifact_id' is not numeric."
              exit 1
            }
            rm -f staging-supply-set.json
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > supply-set.zip
            unzip -o supply-set.zip
            [ -f staging-supply-set.json ] || {
              echo "::error::Artifact $name carried no staging-supply-set.json."
              exit 1
            }
          }

          # Validate the downloaded supply set and print its build_tag. BOTH the
          # primary read and the docs-only reconcile go through this, so the
          # reconcile can never deploy a manifest the ordinary path would have
          # refused. Diagnostics go to STDERR because every caller runs it as
          # $(supply_set_tag), so anything on stdout is captured into the tag.
          supply_set_tag() {
            local schema tag
            schema=$(jq -er '.schema' staging-supply-set.json)
            case "$schema" in
              leaf.staging-supply-set.v1|leaf.staging-supply-set.v2) ;;
              *)
                echo "::error::Supply-set schema '$schema' is not an accepted staging supply-set schema." >&2
                exit 1
                ;;
            esac
            tag=$(jq -er '.build_tag' staging-supply-set.json)
            [[ "$tag" =~ ^prod-[0-9a-f]{7,40}$ ]] || {
              echo "::error::Supply-set build_tag '$tag' is not an immutable prod tag." >&2
              exit 1
            }
            printf '%s' "$tag"
          }

          ARTIFACT_NAME="staging-supply-set-$BUILD_HEAD_SHA-attempt-$BUILD_RUN_ATTEMPT"
          NOOP_NAME="docs-noop-$BUILD_HEAD_SHA-attempt-$BUILD_RUN_ATTEMPT"

          # The ordinary path: THIS build published its own supply set, so
          # deploy exactly the tag it names and require its provenance to match.
          if fetch_supply_set "$BUILD_RUN_ID" "$ARTIFACT_NAME"; then
            IMAGE_TAG=$(supply_set_tag)
            MANIFEST_SHA=$(jq -er '.source_revision' staging-supply-set.json)
            [ "$MANIFEST_SHA" = "$BUILD_HEAD_SHA" ] || {
              echo "::error::Supply-set source_revision $MANIFEST_SHA does not match the build head $BUILD_HEAD_SHA."
              exit 1
            }
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No supply set for THIS build. Two very different situations, and only
          # one is legitimate: a deliberate docs-only no-op run publishes a
          # marker instead. Manifest AND marker both absent means a successful
          # build produced a partial run, which must never be silently swallowed.
          if ! jq -e --arg name "$NOOP_NAME" \
            'any(.artifacts[]; .name == $name)' artifacts.json >/dev/null; then
            echo "::error::Supply-set artifact $ARTIFACT_NAME not found and no $NOOP_NAME marker present."
            exit 1
          fi

          # DOCS-ONLY RECONCILE. This arm used to set deploy=false and exit 0,
          # and that skip is what let a staging split outlive an unbounded number
          # of merges: only a DEPLOYABLE merge's relay deploys a service the
          # stand-down left behind, so every docs-only merge in between was a
          # guaranteed miss (observed 2026-08-07: web on prod-bc2fef0, app on
          # prod-1133e9b). A docs-only tip builds no images, so there is nothing
          # of its own to deploy; instead resolve the LAST tag built from main
          # and set deploy=true onto it. The guarded dispatch step below then
          # deploys BOTH services onto that tag through its one watched,
          # one-at-a-time, fail-loud path -- there is no second dispatch site.
          # The target tag comes from an authoritative artifact, never a read of
          # live state: staging app/web are blue/green over digest-pinned task
          # definitions, so "live" is a function of ALB weights and no run-name
          # read is authoritative about it (sol-critic RED on PR #506 round 1).
          echo "::notice::Build run $BUILD_RUN_ID was a docs-only no-op, which builds no images; reconciling both staging services onto the last tag built from main."

          # Successful main build runs, newest first, selected by workflow PATH
          # (a display name is not an identity: another workflow could share the
          # name). Each row is "id head_sha run_attempt".
          RUNS=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&event=push&status=success&per_page=100" \
            --jq '[.workflow_runs[]
                   | select(.path == ".github/workflows/build-platform-images.yml")]
                  | sort_by(-.id) | .[]
                  | "\(.id) \(.head_sha) \(.run_attempt)"')

          IMAGE_TAG=""
          TARGET_SHA=""
          SCANNED=0
          # Fed on fd 3, not stdin: the loop body runs gh, jq and unzip, and any
          # one of them reading stdin would swallow the rest of the candidate
          # list and cut the scan short. CR is an IFS separator so a CRLF-emitting
          # jq (the Windows build does) cannot append a stray CR to the last
          # field; GNU jq on ubuntu-latest emits LF, so this is belt-and-braces.
          while IFS=$' \t\r' read -r RUN_ID RUN_SHA RUN_ATTEMPT <&3; do
            [ -n "${RUN_ID:-}" ] || continue
            [ "$RUN_ID" != "$BUILD_RUN_ID" ] || continue
            SCANNED=$((SCANNED + 1))
            if ! fetch_supply_set "$RUN_ID" \
              "staging-supply-set-$RUN_SHA-attempt-$RUN_ATTEMPT"; then
              # This successful build run published no supply set under its own
              # name. Only ONE reason is safe to scan past: it published its
              # docs-noop marker, so it built no images and left nothing to
              # deploy. Any other absence -- an expired, deleted, or
              # partially-uploaded supply set on a DEPLOYABLE run -- must FAIL
              # CLOSED, because that run may have deployed a NEWER tag than the
              # older ancestor the scan would otherwise fall back to, and landing
              # the older one would roll a service BACKWARDS. This is the same
              # rule the ordinary path applies to THIS build; the newest-first
              # reachability argument below holds only when every run we skip
              # provably built nothing (sol-critic RED on PR #519, defect 1).
              if jq -e --arg name "docs-noop-$RUN_SHA-attempt-$RUN_ATTEMPT" \
                'any(.artifacts[]; .name == $name)' artifacts.json >/dev/null; then
                continue
              fi
              echo "::error::Docs-only build $BUILD_RUN_ID cannot reconcile safely: successful main build run $RUN_ID ($RUN_SHA) published neither a supply set nor a docs-noop marker (expired, deleted, or a partial upload), so its images cannot be read. Scanning past it to an older tag could roll a service backwards, so failing closed. Converge staging with a successful main build, or dispatch $DEPLOY_WORKFLOW by hand with an exact task-definition ARN."
              exit 1
            fi
            CANDIDATE_SHA=$(jq -er '.source_revision' staging-supply-set.json)
            # Bind the supply set to its run. The ordinary path requires
            # source_revision == the build head; the reconcile requires the same
            # of every candidate, so an artifact that names a DIFFERENT (possibly
            # older) revision than the run it hangs off cannot smuggle an older
            # tag past the ancestor check below (sol-critic RED on PR #519,
            # defect 2).
            [ "$CANDIDATE_SHA" = "$RUN_SHA" ] || {
              echo "::error::Supply set for run $RUN_ID names source_revision $CANDIDATE_SHA, not the run's head $RUN_SHA; refusing to reconcile onto a manifest whose provenance does not match its run."
              exit 1
            }
            # REACHABILITY IS THE NEVER-BACKWARDS ARGUMENT. Runs are scanned
            # newest-first; every run skipped above provably built no images (it
            # carried a docs-noop marker) and every unreadable deployable run
            # failed the release closed, so the FIRST ancestor found is the newest
            # main-derived image and nothing newer exists to be older than. A
            # candidate whose commit is NOT an ancestor (history rewritten, or an
            # artifact that outlived its branch) is skipped; an unreadable compare
            # yields an empty relation and is skipped too, so this fails closed.
            RELATION=$(gh api \
              "repos/$GITHUB_REPOSITORY/compare/$CANDIDATE_SHA...$BUILD_HEAD_SHA" \
              --jq '.status' || true)
            if [ "$RELATION" != "ahead" ]; then
              echo "::notice::Ignoring the supply set from run $RUN_ID ($CANDIDATE_SHA): the compare against the tip reports '$RELATION', not 'ahead', so that commit is not an ancestor of $BUILD_HEAD_SHA and its images are not what this tip describes."
              continue
            fi
            IMAGE_TAG=$(supply_set_tag)
            TARGET_SHA="$CANDIDATE_SHA"
            break
          done 3<<< "$RUNS"

          if [ -z "$IMAGE_TAG" ]; then
            echo "::error::Docs-only build $BUILD_RUN_ID has nothing to reconcile onto: scanned $SCANNED successful main build run(s) and found no valid staging supply set whose commit is an ancestor of $BUILD_HEAD_SHA. Failing loudly rather than skipping, because skipping is how a staging split used to survive a docs-only merge. Supply-set artifacts expire after 30 days, so the usual cause is that main has had no deployable merge in that long; land one, or dispatch $DEPLOY_WORKFLOW by hand with an exact task-definition ARN."
            exit 1
          fi

          echo "Reconciling both staging services onto $IMAGE_TAG, built from $TARGET_SHA ($SCANNED run(s) scanned)."
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy each staging service in turn and prove each one landed
        id: deploy
        if: >-
          steps.tip.outputs.current == 'true' &&
          steps.manifest.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.TERRAFORM_REPO_TOKEN }}
          # The tip re-check reads THIS repo, which the infra-repo PAT is not
          # scoped for; the job's own token is.
          HOME_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.manifest.outputs.image_tag }}
        run: |
          set -euo pipefail

          POLL_SECONDS=15
          EVICTION_RETRIES=2
          DEADLINE=$(( $(date +%s) + 95 * 60 ))

          before_deadline() { [ "$(date +%s)" -lt "$DEADLINE" ]; }

          # `gh workflow run` does not return the run it creates, so the run
          # we just made is "the one that appeared above this mark".
          latest_any_run_id() {
            gh run list --repo "$INFRA_REPO" --workflow "$DEPLOY_WORKFLOW" \
              --limit 100 --json databaseId \
              | jq -r '[.[].databaseId] | max // 0'
          }

          # Newest run above the mark whose run-name is EXACTLY this service
          # and this image tag.
          #
          # Identity must be positive, never inferred from "a new run
          # appeared". Sibling lanes dispatch this same workflow a few times
          # an hour, and GitHub creates and lists dispatched runs
          # asynchronously, so a sibling's run can become visible before ours
          # does. Binding the newest new run would then watch THEIR run,
          # report their success as our service's, and dispatch the next
          # service — which evicts our own still-queued run. That is exactly
          # the silent partial deploy this whole change exists to kill.
          #
          # A sibling that dispatched the identical service AND tag is
          # deploying precisely what we asked for, so matching its run is
          # still correct.
          find_run_named() {
            gh run list --repo "$INFRA_REPO" --workflow "$DEPLOY_WORKFLOW" \
              --limit 100 --json databaseId,displayTitle \
              | jq -r --argjson mark "$1" --arg want "$2" \
                  '[.[] | select(.databaseId > $mark and .displayTitle == $want)]
                   | sort_by(-.databaseId) | first | .databaseId // empty'
          }

          # Will the commit that superseded this release deploy anything of
          # its own? Answered from that commit's OWN build receipt, never a
          # re-derived diff: the build gate decides docs-only from the real
          # push diff with local git and rename detection disabled, which no
          # compare-API window can reproduce. Re-deriving it here would be a
          # second, drifting copy of that rule.
          #
          # Echoes exactly one word:
          #   no      docs-noop marker present, so the superseder builds no
          #           images and its relay dispatches nothing
          #   yes     its build concluded success with no marker, so it
          #           produced a supply set and its own relay converges
          #   unknown its build failed, never appeared, or outlived the
          #           budget; nothing is KNOWN to converge staging
          # Every read here FAILS CLOSED. A read that cannot be proven
          # complete retries until the deadline and then answers `unknown`;
          # it never falls through to a decision. Suppressing a failed read
          # with `|| true` used to empty the artifact list, skip the marker
          # check, and classify a DOCS-ONLY superseder as `yes` on the
          # strength of its build concluding success -- which is exactly the
          # green-on-a-split outcome this guard exists to stop.
          BUILD_WORKFLOW_PATH=".github/workflows/build-platform-images.yml"
          # ONE poll of the superseder's build. Echoes no/yes/unknown only
          # when the reads PROVE that answer, echoes nothing while the build
          # has not decided yet, and returns 1 when any read could not be
          # proven complete. An unproven read is therefore always a retry and
          # never a decision, and the caller alone owns the retry.
          classify_superseder_once() {
            SUP_SHA="$1"
            SUP_RUNS=$(GH_TOKEN="$HOME_TOKEN" gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SUP_SHA&event=push&per_page=100") \
              || return 1
            # Select the build by workflow PATH, not display name. A name is
            # not an identity: another workflow could also be called "Build
            # platform images" and supply a colliding marker or conclusion,
            # and adding one would not change this file or its frozen hash.
            SUP_RUN=$(printf '%s' "$SUP_RUNS" \
              | jq -r --arg path "$BUILD_WORKFLOW_PATH" \
                  '[.workflow_runs[] | select(.path == $path)]
                   | sort_by(-.id) | first | .id // empty') \
              || return 1
            [ -n "$SUP_RUN" ] || return 0
            # One read carries status, conclusion AND the current attempt.
            SUP_RECORD=$(GH_TOKEN="$HOME_TOKEN" gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SUP_RUN") || return 1
            SUP_ATTEMPT=$(printf '%s' "$SUP_RECORD" | jq -r '.run_attempt // empty') \
              || return 1
            SUP_STATE=$(printf '%s' "$SUP_RECORD" \
              | jq -r '"\(.status) \(.conclusion // "")"') || return 1
            [ -n "$SUP_ATTEMPT" ] || return 1
            # Hand the attempt back to the CALLER. superseder_deploys runs this
            # function in a command substitution, so every variable set here
            # dies with that subshell, and a `yes` verdict alone does not carry
            # the one number the receipt wait below needs to name the receipt.
            # The file is written by the SAME read that produced the verdict, so
            # the receipt we wait for is bound to the exact attempt whose supply
            # set earned `yes`, never to a re-read a rerun could move.
            printf '%s' "$SUP_ATTEMPT" > superseder-attempt
            SUP_ARTIFACTS=$(GH_TOKEN="$HOME_TOKEN" gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SUP_RUN/artifacts?per_page=100") \
              || return 1
            # Artifact ABSENCE only counts against a listing proven WHOLE, and
            # a response is only whole if it actually carries the two fields
            # that say so. A truncated page, or a body missing `total_count`,
            # says nothing about the entries it did not return.
            printf '%s' "$SUP_ARTIFACTS" \
              | jq -e '(.artifacts | type == "array")
                       and (.total_count | type == "number")
                       and (.total_count <= (.artifacts | length))' >/dev/null \
              || return 1
            # The marker is written in `prepare`, so it lands minutes before
            # any supply set and decides this early. Bind it to the run's
            # CURRENT attempt, the same way this workflow names its own marker
            # above. Artifacts are keyed by run id and NOT by attempt, so an
            # attempt-1 docs marker outlives a rerun whose attempt 2 built real
            # images; matching any attempt would call that rerun `no` and
            # finish this release on the older tag, landing it on top of the
            # images that rerun is about to deploy.
            if printf '%s' "$SUP_ARTIFACTS" \
              | jq -e --arg n "docs-noop-$SUP_SHA-attempt-$SUP_ATTEMPT" \
                  'any(.artifacts[]; .name == $n)' >/dev/null; then
              echo no
              return 0
            fi
            # `yes` asserts that the superseder's OWN relay will converge
            # staging, so it has to be earned by the artifact that relay
            # actually needs, not by a green conclusion. A build can conclude
            # success and still publish no supply set (a partial run, a failed
            # upload). The manifest step above then fails LOUD on exactly that
            # -- "Supply-set artifact ... not found and no ... marker present"
            # -- so that relay deploys NOTHING and this split never converges,
            # while we would have exited green on its success. Require the
            # exact attempt-bound supply set; anything else falls to `unknown`,
            # which is the RED path.
            # An EXPIRED artifact is a name with nothing behind it: the
            # superseder's own manifest step downloads this artifact, and that
            # download is only valid until expiry. A name match that ignores
            # `.expired` would answer `yes` for a supply set that relay can no
            # longer fetch.
            if printf '%s' "$SUP_ARTIFACTS" \
              | jq -e --arg n "staging-supply-set-$SUP_SHA-attempt-$SUP_ATTEMPT" \
                  'any(.artifacts[]; (.name == $n) and (.expired == false))' \
                  >/dev/null; then
              case "$SUP_STATE" in
                "completed success") echo yes; return 0 ;;
              esac
            fi
            case "$SUP_STATE" in
              completed*) echo unknown ;;
            esac
            return 0
          }

          superseder_deploys() {
            while before_deadline; do
              if VERDICT=$(classify_superseder_once "$1"); then
                if [ -n "$VERDICT" ]; then
                  echo "$VERDICT"
                  return 0
                fi
              fi
              sleep "$POLL_SECONDS"
            done
            echo unknown
          }

          # Newest SUCCESSFUL deploy run for one service, as its full run name.
          # Every dispatch of the infra workflow names itself
          # "Deploy leaf-platform staging <service> (<image_tag|sha|live
          # baseline>)". Best effort ONLY: this feeds the loop ORDER and
          # nothing else, so every failure mode below falls back to the old
          # fixed order rather than failing the release.
          newest_deploy_title() {
            gh run list --repo "$INFRA_REPO" --workflow "$DEPLOY_WORKFLOW" \
              --limit 200 --json databaseId,displayTitle,conclusion \
              | jq -r --arg prefix "Deploy leaf-platform staging $1 (" \
                  '[.[] | select(.conclusion == "success")
                        | select(.displayTitle | startswith($prefix))]
                   | sort_by(-.databaseId) | first | .displayTitle // empty'
          }

          # "...staging app (prod-abc1234)" -> "prod-abc1234"
          tag_of_title() {
            local rest=${1#*\(}
            printf '%s' "${rest%\)}"
          }

          # Hand the first slot to whichever service looks further behind, so
          # the one abandoned by the last superseded relay is the one that
          # advances now. Only the FIRST service is dispatched
          # unconditionally, so this decides who gets skipped if main moves;
          # read the header for why that trade is taken. It cannot change the
          # tag, drop a service, or fail the release.
          SERVICES="web app"
          WEB_TAG=$(tag_of_title "$(newest_deploy_title web || true)")
          APP_TAG=$(tag_of_title "$(newest_deploy_title app || true)")
          if [[ "$WEB_TAG" =~ ^prod-[0-9a-f]{7,40}$ ]] \
            && [[ "$APP_TAG" =~ ^prod-[0-9a-f]{7,40}$ ]] \
            && [ "$WEB_TAG" != "$APP_TAG" ]; then
            # compare/<base>...<head> reports the HEAD side, so with web as
            # base "behind" means APP is behind and app goes first.
            RELATION=$(GH_TOKEN="$HOME_TOKEN" gh api \
              "repos/$GITHUB_REPOSITORY/compare/${WEB_TAG#prod-}...${APP_TAG#prod-}" \
              --jq '.status' || true)
            if [ "$RELATION" = "behind" ]; then
              SERVICES="app web"
              echo "::notice::app ($APP_TAG) trails web ($WEB_TAG); deploying app first so the service that lost the last race is the one that advances now. This does not guarantee app lands: if main moves before its dispatch, this relay stands down and web is the service left behind instead."
            fi
          fi

          # THE CONVERGENCE RECEIPT, waited for. Returns 0 only once the
          # superseding release has PUBLISHED proof that both of its services
          # landed, and 1 when this relay's own deadline runs out first.
          #
          # A supply set proves the superseder COULD deploy. Only the receipt
          # proves its relay DID. Nothing read before this relay exits can
          # substitute, because the superseder's relay can still stand down
          # after any read we take -- that is the whole race.
          #
          # Read from the REPOSITORY artifact endpoint, filtered by exact
          # name, because the receipt is published by the superseder's RELAY
          # run and we cannot name that run: a workflow_run run carries the tip
          # at trigger time as its own head_sha, not the commit that triggered
          # it. The name is the identity, and it is bound to the BUILD's sha
          # and attempt precisely so this relay can compute it from what the
          # classifier already read.
          #
          # NO COMPLETENESS CHECK, deliberately, and this is not the
          # classifier's rule relaxed. That check exists because the classifier
          # reasons from artifact ABSENCE, and a truncated page says nothing
          # about what it did not return. This function reasons only from
          # PRESENCE: a match on any page is a real match, and no match keeps
          # polling until the deadline and then fails RED. It already fails
          # closed, so proving the page whole would add nothing.
          wait_for_receipt() {
            WANT_RECEIPT="staging-converged-$1-attempt-$2"
            echo "Waiting for the superseder's convergence receipt $WANT_RECEIPT."
            while before_deadline; do
              if RECEIPTS=$(GH_TOKEN="$HOME_TOKEN" gh api \
                "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$WANT_RECEIPT"); then
                # Re-match the name locally. The server-side filter is a
                # narrowing convenience, never the proof.
                if printf '%s' "$RECEIPTS" \
                  | jq -e --arg n "$WANT_RECEIPT" \
                      'any(.artifacts[]; (.name == $n) and (.expired == false))' \
                      >/dev/null; then
                  return 0
                fi
              fi
              sleep "$POLL_SECONDS"
            done
            return 1
          }

          DEPLOYED_ANY=false

          for SERVICE in $SERVICES; do
            WANT="Deploy leaf-platform staging $SERVICE ($IMAGE_TAG)"
            ATTEMPT=0

            while :; do
              # Re-read the tip as the FIRST thing in every dispatch attempt,
              # retries included, and never gate it. Dispatching a tag that is
              # no longer current rolls staging BACKWARDS, and that is not
              # hypothetical: relay A can hold a queued app deploy across a
              # newer relay B's whole web-then-app sequence, each eviction
              # dutifully retried, and A's older app then lands on top of B's.
              # Deploying web before app orders the two services within ONE
              # relay; it does not order two relays against each other.
              MAIN_SHA=$(GH_TOKEN="$HOME_TOKEN" gh api \
                "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
              # Set only when this attempt dispatches DESPITE a moved tip.
              NOOP_FINISH_FROM=""
              if [ "$MAIN_SHA" != "$BUILD_HEAD_SHA" ]; then
                if [ "$DEPLOYED_ANY" != "true" ]; then
                  echo "::notice::main moved to $MAIN_SHA past built $BUILD_HEAD_SHA before this release put anything live; standing down (latest-main-only staging: the newer commit's relay owns the deploy)."
                  exit 0
                fi
                # Something of this release is already live, so standing down
                # leaves staging on a mixed identity. Whether that is benign
                # turns entirely on whether the superseder converges it.
                CONVERGER=$(superseder_deploys "$MAIN_SHA")
                if [ "$CONVERGER" = "no" ]; then
                  # The classification POLLS, so MAIN_SHA is a snapshot taken
                  # before that wait. Re-read the tip and refuse to act on a
                  # stale finding: while we classified $MAIN_SHA, a DEPLOYABLE
                  # commit could have merged and its relay could have deployed
                  # a newer tag to both services. Dispatching afterwards would
                  # land $IMAGE_TAG last, which is the backwards deploy the
                  # whole latest-main-only rule exists to stop.
                  #
                  # The shared concurrency group does NOT save us here, and
                  # the tempting argument that it does is wrong at the source.
                  # GitHub's concurrency docs state that FIFO is based on when
                  # a run "started waiting on the concurrency group, not the
                  # time each workflow was dispatched", and that "ordering is
                  # not guaranteed". So the group orders neither by dispatch
                  # time nor reliably at all: an earlier-dispatched run can
                  # reach the group after a later one and execute last. There
                  # is no serialization argument that makes a stale tag safe;
                  # only a fresh tip read does.
                  TIP_NOW=$(GH_TOKEN="$HOME_TOKEN" gh api \
                    "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
                  if [ "$TIP_NOW" != "$MAIN_SHA" ]; then
                    echo "::error::STAGING IS SPLIT AND UNCONVERGED: main moved again to $TIP_NOW while this relay was classifying $MAIN_SHA, so the docs-noop finding is stale and finishing $SERVICE on $IMAGE_TAG could land it on top of a newer deploy. Standing down. Staging is NOT converged on $BUILD_HEAD_SHA; converge it with a successful main build."
                    exit 1
                  fi
                  # The superseder builds NO images, so its relay dispatches
                  # nothing and there is no newer deploy for $IMAGE_TAG to
                  # land on top of. The hazard that makes standing down
                  # correct does not exist here, and standing down would
                  # strand the split with no converger, so finish the
                  # release. This does NOT reopen the sol-critic RED from
                  # PR #497 (relay A's older app landing over relay B's):
                  # that needs a competing deploy, and a docs-only
                  # superseder has none.
                  #
                  # KNOWN RESIDUAL, not closed here and deliberately named.
                  # The re-read shrinks the window to the gap between it and
                  # the dispatch below, but does not remove it: a DEPLOYABLE
                  # commit C can merge inside that gap, C's own relay can
                  # deploy newer images, and because the shared group orders
                  # neither by dispatch time nor reliably at all, this relay's
                  # older tag can still execute last. The same residual
                  # predates this arm and covers a third commit merging while
                  # a dispatched run is already being watched. No read taken
                  # BEFORE a dispatch can close it, because the truth can
                  # change after the read and before the deploy acts. The
                  # durable fix is to validate deploy authority INSIDE the
                  # deploy workflow while it already holds the staging
                  # mutation lock, comparing the requested tag against the
                  # tip at that moment; that lives in the infra repo and is
                  # out of scope for this one. Until then the window is
                  # seconds rather than the classifier's minutes, and the
                  # failure it can still produce is the one this relay now
                  # reports loudly rather than the one it used to hide.
                  # Remember that this dispatch happens on a tip we had to
                  # clear, so the landing check below can prove it stayed put.
                  NOOP_FINISH_FROM="$MAIN_SHA"
                  echo "::warning::main moved to $MAIN_SHA past built $BUILD_HEAD_SHA after this release already deployed a service, but $MAIN_SHA published a docs-noop marker: it builds no images and its relay dispatches nothing, so no newer deploy exists and nothing else would converge staging. Finishing $SERVICE on $IMAGE_TAG is what closes the split."
                elif [ "$CONVERGER" = "yes" ]; then
                  # SYMMETRY WITH THE DOCS-NOOP ARM: this classification also
                  # POLLED, so $MAIN_SHA is a snapshot taken before the wait,
                  # and `yes` is a claim about a commit that may no longer be
                  # the tip. sol-critic reproduced the consequence: A deploys
                  # web and starts polling deployable B; docs-only C lands
                  # while B is still building; B completes with its supply
                  # set so A answers `yes` and exits green; B's own relay then
                  # SKIPS because C is the tip; C's relay skips on its own
                  # docs-noop marker. Nothing converges and A, B and C are all
                  # green. That is the original incident displaced by one hop.
                  # A supply set proves B COULD deploy, never that its relay
                  # WILL. Fail CLOSED when the tip moved under the poll.
                  TIP_NOW=$(GH_TOKEN="$HOME_TOKEN" gh api \
                    "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
                  if [ "$TIP_NOW" != "$MAIN_SHA" ]; then
                    echo "::error::STAGING IS SPLIT AND UNCONVERGED: main moved again to $TIP_NOW while this relay was classifying $MAIN_SHA, so the finding that $MAIN_SHA converges staging is stale. That commit's relay may itself stand down on the newer tip and deploy nothing, leaving this split with no converger. Staging is NOT converged on $BUILD_HEAD_SHA; converge it with a successful main build."
                    exit 1
                  fi
                  # THE FRESH TIP READ ABOVE IS NECESSARY AND NOT SUFFICIENT.
                  # It proves $MAIN_SHA is the tip at that instant and nothing
                  # more. sol-critic carried the incident one hop further: A
                  # reads TIP_NOW=B and classifies `yes`, docs-only C pushes
                  # immediately AFTER that read, A exits green, B's relay then
                  # skips on its latest-main-only check because C is the tip,
                  # and C's relay dispatches nothing on its own docs-noop
                  # marker. A's split survives with A, B and C all green. No
                  # read taken before A exits can close that, so the proof has
                  # to come from B ACTUALLY LANDING.
                  #
                  # So wait for B's receipt, bounded by this relay's own
                  # existing deadline. A superseded B publishes none, and this
                  # relay then fails RED rather than assuming.
                  SUP_ATTEMPT_SEEN=$(cat superseder-attempt 2>/dev/null || true)
                  if [ -z "$SUP_ATTEMPT_SEEN" ]; then
                    echo "::error::STAGING IS SPLIT AND UNCONVERGED: $MAIN_SHA classified as a converger but its build attempt was not recorded, so the convergence receipt to wait for cannot be named. Refusing to stand down on an unprovable claim. Staging is NOT converged on $BUILD_HEAD_SHA; converge it with a successful main build."
                    exit 1
                  fi
                  if wait_for_receipt "$MAIN_SHA" "$SUP_ATTEMPT_SEEN"; then
                    echo "::notice::STAGING WAS SPLIT AND IS NOW CONVERGED: main moved to $MAIN_SHA past built $BUILD_HEAD_SHA after this release already deployed a service, and $MAIN_SHA's relay has published its convergence receipt, so both staging services are live on that newer release. Standing down on PROOF that the split closed, not on the expectation that it would."
                    exit 0
                  fi
                  echo "::error::STAGING IS SPLIT AND UNCONVERGED: main moved to $MAIN_SHA past built $BUILD_HEAD_SHA after this release already deployed a service, so $SERVICE stays on its previous image, and $MAIN_SHA never published a convergence receipt within this relay's budget. Its build produced a supply set, but its relay did not prove both services landed -- it may itself have been superseded and stood down. Staging is NOT converged on $BUILD_HEAD_SHA; converge it with a successful main build."
                  exit 1
                else
                  echo "::error::STAGING IS SPLIT AND UNCONVERGED: main moved to $MAIN_SHA past built $BUILD_HEAD_SHA after this release already deployed a service, so $SERVICE stays on its previous image, and $MAIN_SHA is not known to deploy anything that would converge it (its build failed, never appeared, or outlived this watch). Standing down rather than risk landing $IMAGE_TAG on top of a newer deploy. Staging is NOT converged on $BUILD_HEAD_SHA; converge it with a successful main build."
                  exit 1
                fi
              fi

              BEFORE=$(latest_any_run_id)
              gh workflow run "$DEPLOY_WORKFLOW" \
                --repo "$INFRA_REPO" \
                --ref main \
                -f "service=$SERVICE" \
                -f "expected_task_definition=auto-live" \
                -f "image_tag=$IMAGE_TAG" \
                -f "app_deploy_intent=forward"
              echo "Dispatched $SERVICE deploy of $IMAGE_TAG (attempt $((ATTEMPT + 1)))."

              # Transient gh failures inside poll loops are tolerated and fail
              # CLOSED: an unresolved run exhausts its budget and errors below.
              RUN_ID=""
              RESOLVE_BY=$(( $(date +%s) + 5 * 60 ))
              while [ "$(date +%s)" -lt "$RESOLVE_BY" ] && before_deadline; do
                sleep 3
                RUN_ID=$(find_run_named "$BEFORE" "$WANT" || true)
                if [ -n "$RUN_ID" ]; then break; fi
              done
              if [ -z "$RUN_ID" ]; then
                echo "::error::Dispatched the $SERVICE deploy of $IMAGE_TAG but no run named '$WANT' appeared. This relay identifies its run by name and never guesses, so it fails here rather than watch a run that may not be ours. PREREQUISITE: $INFRA_REPO must set run-name on $DEPLOY_WORKFLOW to 'Deploy leaf-platform staging <service> (<image_tag>)'. Staging is NOT converged on $BUILD_HEAD_SHA."
                exit 1
              fi
              echo "Watching $SERVICE deploy run $RUN_ID."

              STATUS=""
              CONCLUSION=""
              while before_deadline; do
                STATE=$(gh run view "$RUN_ID" --repo "$INFRA_REPO" \
                  --json status,conclusion \
                  --jq '"\(.status) \(.conclusion // "")"' || true)
                STATUS=${STATE%% *}
                CONCLUSION=${STATE#* }
                [ "$STATUS" = "completed" ] && break
                sleep "$POLL_SECONDS"
              done

              if [ "$STATUS" != "completed" ]; then
                echo "::error::The $SERVICE deploy run $RUN_ID had not finished within the watch budget. Staging may be half-deployed on $BUILD_HEAD_SHA."
                exit 1
              fi
              if [ "$CONCLUSION" = "success" ]; then
                DEPLOYED_ANY=true
                # THE READ-TO-DISPATCH WINDOW, closed for REPORTING.
                #
                # Only the docs-noop arm dispatches after main has already
                # moved, and no read taken BEFORE a dispatch can prove the tip
                # held across it. So check now that the deploy has landed. If a
                # third commit merged inside that window it may build images
                # and deploy them, and this older tag could have landed last,
                # leaving staging BACKWARDS. We cannot prove staging is
                # forward, so say so loudly instead of concluding success.
                # Preventing the stale write (rather than reporting it) needs
                # authority validated inside the deploy workflow while it holds
                # the staging mutation lock, which lives in the infra repo.
                if [ -n "$NOOP_FINISH_FROM" ]; then
                  TIP_AFTER=$(GH_TOKEN="$HOME_TOKEN" gh api \
                    "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
                  if [ "$TIP_AFTER" != "$NOOP_FINISH_FROM" ]; then
                    echo "::error::STAGING MAY BE BACKWARDS: $SERVICE was finished on $IMAGE_TAG after main had already moved to $NOOP_FINISH_FROM, and main moved again to $TIP_AFTER while that deploy was in flight. If $TIP_AFTER builds images, its relay may have deployed them before this one landed, leaving staging on an OLDER release. Staging is NOT provably converged on $BUILD_HEAD_SHA; check the live images and converge with a successful main build."
                    exit 1
                  fi
                fi
                echo "$SERVICE deploy of $IMAGE_TAG landed (run $RUN_ID)."
                break
              fi

              # Zero jobs means the run was cancelled while still queued, i.e.
              # evicted from the shared staging lock before touching AWS. Only
              # that is retryable; a run that started and then failed must
              # never be re-dispatched blind.
              JOBS=$(gh api "repos/$INFRA_REPO/actions/runs/$RUN_ID/jobs" \
                --jq '.total_count')
              if [ "$CONCLUSION" = "cancelled" ] && [ "$JOBS" -eq 0 ] \
                && [ "$ATTEMPT" -lt "$EVICTION_RETRIES" ]; then
                ATTEMPT=$((ATTEMPT + 1))
                echo "::warning::The $SERVICE deploy run $RUN_ID was evicted from the staging lock before starting a job; re-dispatching."
                continue
              fi

              echo "::error::The $SERVICE deploy of $IMAGE_TAG concluded '$CONCLUSION' (run $RUN_ID, $JOBS jobs). Staging is NOT converged on $BUILD_HEAD_SHA."
              exit 1
            done
          done

          # EVERY service landed, so this release converged staging. Record
          # that as an artifact the NEXT superseded relay can wait on, which is
          # the only evidence that distinguishes a relay that COULD have
          # deployed from one that DID.
          #
          # Reached only by falling out of the loop. Every stand-down and every
          # failure above exits first, so the receipt cannot be written by a
          # relay that skipped, stood down, or left a service behind. Keyed by
          # the BUILD's sha and attempt, exactly like the supply set and the
          # docs-noop marker, so a superseded relay can compute this name from
          # the build record it already reads. The services array records the
          # ACTUAL order this relay deployed, not a hardcoded pair.
          jq -n \
            --arg sha "$BUILD_HEAD_SHA" \
            --arg attempt "$BUILD_RUN_ATTEMPT" \
            --arg tag "$IMAGE_TAG" \
            --arg relay "$GITHUB_RUN_ID" \
            --arg services "$SERVICES" \
            '{schema: "leaf.staging-converged.v1",
              source_revision: $sha,
              build_run_attempt: $attempt,
              build_tag: $tag,
              relay_run_id: $relay,
              services: ($services | split(" "))}' > staging-converged.json
          echo "converged=true" >> "$GITHUB_OUTPUT"

      # Publishing is a SEPARATE step because the deploy step above exits
      # non-zero on every unconverged path, and a step that has failed cannot
      # upload anything. The `converged` output is written on the single line
      # that follows a completed service loop, so the receipt exists if and
      # only if both services provably landed. This step runs NO script and
      # holds NO token: it is a pure upload of a file the guarded step already
      # wrote, so it cannot be the place a dispatch is smuggled in.
      - name: Publish the convergence receipt
        if: steps.deploy.outputs.converged == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staging-converged-${{ github.event.workflow_run.head_sha }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: staging-converged.json
          if-no-files-found: error
