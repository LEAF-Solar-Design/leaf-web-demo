name: Qualify dormant platform release guardrails

on:
  workflow_dispatch:
    inputs:
      captured_evidence_json:
        description: Closed fixture or captured release evidence JSON
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qualify-platform-release-guardrails-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Evaluate non-executable release guardrails
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Evaluate captured evidence without dispatch authority
        shell: bash
        env:
          CAPTURED_EVIDENCE_JSON: ${{ inputs.captured_evidence_json }}
        run: |
          set -euo pipefail
          set +e
          printf '%s' "$CAPTURED_EVIDENCE_JSON" |
            python3 scripts/platform_release_guardrails.py \
              --input - \
              --output "$RUNNER_TEMP/platform-release-guardrail-result.json"
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 78
          python3 - "$RUNNER_TEMP/platform-release-guardrail-result.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert result["schema"] == "leaf.platform-release-guardrail-result.v1"
          assert result["status"] in {"ready", "stopped"}
          assert result["selector_activation_authorized"] is False
          assert result["dispatch_authorized"] is False
          assert result["live_mutation_authorized"] is False
          PY

      - name: Upload the dormant guardrail result
        uses: actions/upload-artifact@v4
        with:
          name: dormant-platform-release-guardrails-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-release-guardrail-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Report the dormant boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "The result is captured-evidence policy with all activation authority false."
          echo "No credential, provider API, deployment selector, or live resource was used."
