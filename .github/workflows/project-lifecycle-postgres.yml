name: Project lifecycle PostgreSQL gate

# WHY THIS EXISTS: platform/tests/test_project_lifecycle.py is the executable
# Wave B lifecycle + tenant-isolation contract, and until this workflow it ran
# NOWHERE. It skips without DATABASE_URL, and no workflow provided one, so the
# membership/clone/export/reset/delete authority rules shipped unexercised. A
# suite that only ever skips is not coverage, it is the appearance of coverage.
on:
  pull_request:
    paths:
      - '.github/workflows/project-lifecycle-postgres.yml'
      - 'harness/**'
      - 'scripts/run-all-gates.py'
      - 'platform/project_lifecycle.py'
      - 'platform/api.py'
      - 'platform/deps.py'
      - 'platform/store.py'
      - 'platform/db.py'
      - 'platform/models.py'
      - 'platform/__init__.py'
      - 'platform/migrations/**'
      - 'platform/requirements.txt'
      - 'platform/tests/conftest.py'
      - 'platform/tests/test_project_lifecycle.py'
      # The soft-delete / project-authority guard rides this lane for the same
      # reason: it is DB-backed, so the hermetic test-gate can only ever SKIP
      # it. These three modules are the other holders of the live-project
      # predicate the guard pins.
      - 'platform/tests/test_soft_delete_authority_guard.py'
      - 'platform/annotation_store.py'
      - 'platform/canonical_jobs.py'
      - 'platform/signing.py'
      # Review signatures also need this live PostgreSQL lane. The hermetic
      # gate cannot exercise their persisted payload and timezone behavior.
      - 'platform/tests/test_signing.py'
  workflow_dispatch: {}

# The gate only reads the tree and runs tests against its own throwaway
# Postgres service; the GITHUB_TOKEN needs nothing beyond checkout.
permissions:
  contents: read

jobs:
  project-lifecycle:
    runs-on: codebuild-leaf-gha-runner-web-demo-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leaf_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leaf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/leaf_test
      # The repo's own platform/ package shadows stdlib platform and crashes
      # pytest at import (uuid -> platform.system); PYTHONSAFEPATH keeps the
      # repo root off sys.path[0]. Same reason as contract.yml.
      PYTHONSAFEPATH: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install platform requirements
        run: python -m pip install -r platform/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install harness dependencies
        working-directory: harness
        run: npm ci

      - name: Run canonical project source PostgreSQL tests
        working-directory: harness
        env:
          PG_REPO_LEASE_TEST_URL: ${{ env.DATABASE_URL }}
        run: |
          report="$RUNNER_TEMP/canonical-project-source-vitest.json"
          rm -f "$report"
          npm test -- --run test/projectRepositorySourceInitialize.test.ts test/projectRepositorySourceExport.test.ts --reporter=json --outputFile="$report" || exit $?
          python -I - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = {
              Path("test/projectRepositorySourceInitialize.test.ts").resolve(): 5,
              Path("test/projectRepositorySourceExport.test.ts").resolve(): 4,
          }
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          modules = report["testResults"]
          if len(modules) != 2 or {Path(m["name"]).resolve() for m in modules} != set(expected):
              sys.exit("FAIL: expected exactly the initializer and exporter modules")
          for module in modules:
              name = Path(module["name"]).resolve()
              assertions = module["assertionResults"]
              if len(assertions) < expected[name]:
                  sys.exit(f"FAIL: {name.name} has fewer than {expected[name]} assertions")
              if module.get("status") != "passed" or any(a.get("status") != "passed" for a in assertions):
                  sys.exit(f"FAIL: {name.name} contains a non-passing result")
              print(f"{name.name}: {len(assertions)} passed")
          PY

      - name: Run the project-lifecycle contract
        # A SKIP IS A FAILURE HERE. The suite skips itself when DATABASE_URL is
        # not reaching pytest, which looks identical to a pass in the summary
        # line, so assert on the absence of "skipped" rather than on exit 0.
        run: |
          set -o pipefail
          if ! out=$(python -m pytest --import-mode=importlib -q -rs \
              platform/tests/test_project_lifecycle.py 2>&1); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          if printf '%s\n' "$out" | grep -qi 'skipped'; then
            printf '%s\n' "$out"
            echo 'FAIL: lifecycle tests skipped - DATABASE_URL is not reaching pytest.'
            exit 1
          fi

      - name: Run review signature PostgreSQL tests
        # Default pytest import mode is required. test_signing.py imports its
        # sibling test_compliance_store module, which importlib mode does not
        # place on sys.path.
        run: |
          set -o pipefail
          if ! out=$(python -m pytest -q -rs platform/tests/test_signing.py 2>&1); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          if [[ "${out,,}" == *skipped* ]]; then
            printf '%s\n' "$out"
            echo 'FAIL: review signature tests skipped - DATABASE_URL is not reaching pytest.'
            exit 1
          fi

      - name: Run the soft-delete / project-authority guard contract
        # Same lane, same reasoning as the step above. This suite pins the
        # 2026-08-28 incident: project_authority_modes rows outlive their
        # project's soft delete, an unguarded join therefore selects dead
        # projects, and create_drawing_version reported it as a bare
        # "project not found". It needs a live database, so the hermetic
        # test-gate can only ever SKIP it -- which reads identically to a pass.
        # This step is where it actually executes.
        run: |
          set -o pipefail
          if ! out=$(python -m pytest --import-mode=importlib -q -rs \
              platform/tests/test_soft_delete_authority_guard.py 2>&1); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | tail -5
          if printf '%s\n' "$out" | grep -qi 'skipped'; then
            printf '%s\n' "$out"
            echo 'FAIL: soft-delete guard tests skipped - DATABASE_URL is not reaching pytest.'
            exit 1
          fi
