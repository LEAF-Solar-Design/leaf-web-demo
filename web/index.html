<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Neutral calm mark: the plot-stamp diamond in plotter-pen green (#1e6b45), no emoji. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20x='26'%20y='26'%20width='48'%20height='48'%20rx='8'%20transform='rotate(45%2050%2050)'%20fill='%231e6b45'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- App-only surface: the indexable site is https://www.leafautomation.ai
         (front-door contract, contract/FRONT-DOOR.md). Every route of this SPA
         serves this shell, so this one tag noindexes the whole deployment. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Leaf — build CAD tools with AI, run on Leaf</title>
    <meta name="description" content="We do the drafting. You do the engineering. Branch strings a 3.2 MW rooftop live behind this page — 25 hours of drafting in 3 minutes, zero NEC violations." />
  </head>
  <body>
    <!-- First-paint skeleton: replaced by React on mount. Keeps the cold-load
         from showing a white screen on stage. Inline styles only (no CSS
         request in the critical path). -->
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e9e7e0;color:#4f5851;font-family:'Barlow',system-ui,-apple-system,sans-serif;">
        <div style="text-align:center;">
          <div style="width:18px;height:18px;margin:0 auto 16px;background:#1e6b45;transform:rotate(45deg);border-radius:4px;"></div>
          <div style="font-size:14px;letter-spacing:0.01em;">Loading workspace…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
