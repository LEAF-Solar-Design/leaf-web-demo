# Opt-in canonical PostgreSQL overlay.
#
# Usage from the leaf-web-demo repository root:
#   docker compose -f docker-compose.yml -f docker-compose.canonical.yml build app canonical-worker migrate
#   docker compose -f docker-compose.yml -f docker-compose.canonical.yml up -d
#
# The autofill-solver repository remains the source owner. Compose passes its
# checkout as a named BuildKit context, and the image build refuses it unless
# the copied bytes match the trusted digest for the required commit.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leaf
      POSTGRES_USER: leaf
      POSTGRES_PASSWORD: leaf-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaf -d leaf"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - leaf-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    image: leaf-canonical-worker:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.canonical-worker
      args:
        AUTOFILL_SOLVER_REVISION: ${AUTOFILL_SOLVER_REVISION:?set AUTOFILL_SOLVER_REVISION to the exact autofill-solver commit}
      additional_contexts:
        autofill_solver: ${AUTOFILL_SOLVER_CONTEXT:-../autofill-solver}
    environment:
      DATABASE_URL: postgresql://leaf:leaf-local-only@postgres:5432/leaf
    command:
      - python
      - -c
      - "import sys; sys.path.insert(0, '/app/platform'); import db; db.apply_migration(); db.assert_schema_current()"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  broker:
    environment:
      # Supplying a connection is not an authority cutover. The legacy default
      # remains active until the operator explicitly selects postgres.
      DATABASE_URL: postgresql://leaf:leaf-local-only@postgres:5432/leaf
      LEAF_BROKER_STORE: ${LEAF_BROKER_STORE:-legacy}
      LEAF_CALLBACK_REPLAY_STORE: ${LEAF_CALLBACK_REPLAY_STORE:-legacy}
      LEAF_DRAWING_STORE: ${LEAF_DRAWING_STORE:-legacy}
      LEAF_JOBS_STORE: ${LEAF_JOBS_STORE:-legacy}
    depends_on:
      migrate:
        condition: service_completed_successfully

  harness:
    environment:
      LEAF_HARNESS_DATABASE_URL: postgresql://leaf:leaf-local-only@postgres:5432/leaf
      LEAF_HARNESS_SESSION_STORE: ${LEAF_HARNESS_SESSION_STORE:-file}
      LEAF_HARNESS_AUTHORING_MODE: ${LEAF_HARNESS_AUTHORING_MODE:-disabled}
    depends_on:
      migrate:
        condition: service_completed_successfully

  canonical-worker:
    image: leaf-canonical-worker:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.canonical-worker
      args:
        AUTOFILL_SOLVER_REVISION: ${AUTOFILL_SOLVER_REVISION:?set AUTOFILL_SOLVER_REVISION to the exact autofill-solver commit}
      additional_contexts:
        autofill_solver: ${AUTOFILL_SOLVER_CONTEXT:-../autofill-solver}
    environment:
      DATABASE_URL: postgresql://leaf:leaf-local-only@postgres:5432/leaf
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  app:
    environment:
      DATABASE_URL: postgresql://leaf:leaf-local-only@postgres:5432/leaf
      LEAF_JOBS_STORE: ${LEAF_JOBS_STORE:-legacy}
      LEAF_SESSIONS_STORE: ${LEAF_SESSIONS_STORE:-legacy}
      LEAF_AGENT_STORE: ${LEAF_AGENT_STORE:-legacy}
      LEAF_GUEST_CAP_STORE: ${LEAF_GUEST_CAP_STORE:-memory}
      LEAF_DRAWING_STORE: ${LEAF_DRAWING_STORE:-legacy}
      LEAF_UPLOAD_STORE: ${LEAF_UPLOAD_STORE:-legacy}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  leaf-postgres:
